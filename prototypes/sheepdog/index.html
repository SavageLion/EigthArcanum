<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sheepdog</title>
<style>html,body{margin:0;height:100%;background:#0f140f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100vw;height:100vh;object-fit:contain;image-rendering:pixelated}</style>
</head><body><canvas id="c"></canvas>
<script>
/* Sheepdog: a real-time flock-herding roguelike. You are the dog.
   DAY: sheep run from pressure, so steer the flock through the gate into the pen. The faster you finish, the more lantern oil you earn.
   NIGHT: the gate is shut. Foxes sneak off with lambs and strays, wolf packs circle and rush the flock and gnaw the fence.
   Light your lantern, bark them off, stare them down, repair the fence, and keep the flock alive until dawn. Survivors carry over to the next day. */
(()=>{
let W=960;const H=540,cv=document.getElementById('c'),c=cv.getContext('2d');
cv.width=W;cv.height=H;
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];
const hyp=Math.hypot;

/* ---------------- perks (your build between rounds) ---------------- */
const PERKS=[
 {id:'bark',n:'Loud Bark',d:'Bigger bark, shorter cooldown. Scares predators further.',ic:'!'},
 {id:'legs',n:'Fast Paws',d:'+15% running speed.',ic:'>'},
 {id:'stare',n:'Steady Stare',d:'Crouching calms sheep, and wolves hesitate when you stare.',ic:'o'},
 {id:'nose',n:'Collie Nose',d:'Sheep feel you from further away.',ic:'~'},
 {id:'bell',n:'Bell Wether',d:'The flock sticks together tighter.',ic:'*'},
 {id:'treats',n:'Pocket Treats',d:'+10 seconds on every day.',ic:'+'},
 {id:'helper',n:'Second Dog',d:'A helper dog herds by day and chases predators by night.',ic:'2',max:1},
 {id:'lantern',n:'Bright Lantern',d:'Your lantern lights further, and burns oil slower.',ic:'L'},
 {id:'flare',n:'Signal Flares',d:'A FLARE button: lights a big area for 4 s and scares predators.',ic:'F',max:1},
 {id:'campfire',n:'Campfire',d:'A fire by the pen: light, and predators keep away.',ic:'C',max:1},
 {id:'fence',n:'Sturdy Fence',d:'Tougher fence that you repair faster.',ic:'#'},
];
/* ---------------- game state ---------------- */
const G={state:'ready',mode:'day',day:1,perks:{},herd:[],time:0,limit:0,sheep:[],dog:null,helper:null,pen:null,walls:[],rocks:[],parts:[],texts:[],rings:[],offers:[],
 preds:[],warns:[],events:[],flare:null,flareCd:0,oil:0,oilMax:1,lost:0,penned:0,outside:0,score:0,t:0,bot:false,barkCd:0,msg:'',msgT:0,best:0,packId:0,stars:0,fireOn:false,dawnInfo:null,duskInfo:null};
const perk=id=>G.perks[id]||0;
const TYPES={
 normal:{r:7,zone:120,flee:1,speed:1,col:'#f2efe6',n:'Ewe',hp:2},
 ram:{r:9,zone:62,flee:.55,speed:.8,col:'#d8d0bc',n:'Ram',hp:4},
 panicky:{r:6.5,zone:175,flee:1.5,speed:1.25,col:'#fff6ea',n:'Panicker',hp:2},
 lamb:{r:4.5,zone:105,flee:1,speed:1.1,col:'#fffdf6',n:'Lamb',hp:1},
 black:{r:7,zone:120,flee:1,speed:1,col:'#3a3438',n:'Black sheep',hp:2},
 goat:{r:7,zone:90,flee:.45,speed:.9,col:'#b8986a',n:'Goat',hp:3},
};

/* ---------------- seasons: every 3 days, and a new thing gets introduced slowly ---------------- */
const SEASONS=[{n:'SPRING',gr:['#5f9a48','#68a44e','#5a9444'],mud:2},{n:'SUMMER',gr:['#8aa44a','#94ae54','#809a42'],mud:0},{n:'AUTUMN',gr:['#9a7a3c','#a4843f','#8c6e36'],mud:1},{n:'WINTER',gr:['#dfe8ee','#e8f0f4','#d2dde4'],mud:2}];
const season=()=>SEASONS[Math.floor((G.day-1)/3)%4];
const NEWS={2:'Mud slows you and the flock',3:'Black sheep wander. Wolves hunt at night',4:'A stream cuts the field. Eagles take lambs',5:'Goats ignore you until you stare. BEAR NIGHT!',6:'Trees block the way',8:'The gate narrows'};
function zoneAt(o){for(const z of G.zones||[])if(o.x>z.x&&o.x<z.x+z.w&&o.y>z.y&&o.y<z.y+z.h)return z;return null;}
/* ---------------- starting a day ---------------- */
function startGame(){G.day=1;G.perks={};G.score=0;G.herd=[];for(let i=0;i<8;i++)G.herd.push({type:'normal'});startDay();}
function mkWall(x1,y1,x2,y2,pen,hp){const w=[x1,y1,x2,y2];w.pen=!!pen;w.max=hp||0;w.hp=hp||0;w.broken=false;w.dig=0;return w;}
function fenceHp(){return 70*(1+.5*perk('fence'));}
function startDay(){
 fit();G.mode='day';G.state='play';G.t=0;G.parts=[];G.texts=[];G.rings=[];G.barkCd=0;G.preds=[];G.warns=[];G.events=[];G.flare=null;G.lost=0;G.fireOn=false;
 const n=G.day,count=G.herd.length;
 G.limit=70+3*n+10*perk('treats')+(season().n==='SUMMER'?-8:0);G.time=G.limit;
 const pw=150,ph=190,px=W-pw-18,py=rnd(70,H-ph-70),gy=py+ph/2+rnd(-40,40),gap=(n>=8?66:84),hp=fenceHp();
 G.pen={x:px,y:py,w:pw,h:ph,gy,gap};
 G.walls=[mkWall(px,py,px+pw,py,1,hp),mkWall(px,py+ph,px+pw,py+ph,1,hp),mkWall(px+pw,py,px+pw,py+ph,1,hp),mkWall(px,py,px,gy-gap/2,1,hp),mkWall(px,gy+gap/2,px,py+ph,1,hp),
  mkWall(px-70,gy-gap/2-46,px,gy-gap/2,0),mkWall(px-70,gy+gap/2+46,px,gy+gap/2,0)];
 G.rocks=[];
 const nr=n>=3?Math.min(9,n):0;
 for(let i=0;i<nr;i++){let ok=0;for(let k=0;k<30&&!ok;k++){const r=rnd(16,30),x=rnd(220,px-130),y=rnd(60,H-50);if(Math.abs(x-300)<60&&Math.abs(y-H/2)<80)continue;if(G.rocks.some(o=>hyp(o.x-x,o.y-y)<o.r+r+40))continue;G.rocks.push({x,y,r});ok=1;}}
 if(n>=6){const nt=Math.min(6,n-4);for(let i=0;i<nt;i++){for(let k=0;k<30;k++){const x=rnd(220,px-130),y=rnd(70,H-50);if(Math.abs(x-300)<70&&Math.abs(y-H/2)<90)continue;if(G.rocks.some(o=>hyp(o.x-x,o.y-y)<o.r+14+40))continue;G.rocks.push({x,y,r:14,tree:true});break;}}}
 G.zones=[];
 const sk=season().n==='WINTER'?'snow':'mud';
 if(n>=2){const nm=Math.min(5,season().mud+Math.floor(n/3));for(let i=0;i<nm;i++)G.zones.push({k:sk,slow:1,x:rnd(200,px-230),y:rnd(50,H-120),w:rnd(90,150),h:rnd(60,100)});}
 if(n>=4){const sx=rnd(440,540),fy=rnd(120,H-220);G.zones.push({k:'water',x:sx,y:40,w:46,h:fy-40},{k:'water',x:sx,y:fy+100,w:46,h:H-fy-100});}
 G.dog={x:140,y:H/2,vx:0,vy:0,hx:1,hy:0,tx:140,ty:H/2,crouch:false,stun:0,face:1,run:0,walk:false};
 G.helper=perk('helper')?{x:160,y:H/2+40,vx:0,vy:0,face:1,run:0}:null;
 G.sheep=[];
 const cx=rnd(300,420),cy=rnd(150,H-150);
 for(const h of G.herd){
  let x,y,k=0;do{const a=rnd(0,TAU),d=rnd(0,95);x=cx+Math.cos(a)*d;y=cy+Math.sin(a)*d;k++;}while(k<20&&G.rocks.some(o=>hyp(o.x-x,o.y-y)<o.r+14));
  const T=TYPES[h.type];
  G.sheep.push({x,y,vx:0,vy:0,type:h.type,T,hp:T.hp,panic:0,inPen:false,wa:rnd(0,TAU),graze:rnd(0,3),face:1,hop:rnd(0,6),flash:0,carried:false,bumpT:0});
 }
 G.msg='DAY '+n+' · '+season().n;G.msg2=NEWS[n]||((n-1)%3===0&&n>1?'A new season begins':'');G.msgT=3.5;G.penned=0;
}
function endDay(why){
 if(G.state!=='play'||G.mode!=='day')return;
 G.penned=G.sheep.filter(s=>s.inPen).length;G.outside=G.sheep.length-G.penned;
 const left=Math.max(0,G.time);
 G.oilMax=G.oil=clamp(24+left*.6,24,80);
 G.duskInfo={why,penned:G.penned,outside:G.outside,left:Math.round(left),oil:Math.round(G.oil)};
 G.score+=Math.round(G.penned*6+left*2);
 G.state='dusk';
}
/* ---------------- starting a night ---------------- */
function startNight(){
 G.mode='night';G.state='play';G.t=0;G.parts=[];G.texts=[];G.rings=[];G.preds=[];G.warns=[];G.flare=null;G.flareCd=0;G.lost=0;G.packId=0;
 const n=G.day,P=G.pen,hp=fenceHp();
 const gw=mkWall(P.x,P.gy-P.gap/2,P.x,P.gy+P.gap/2,1,hp);gw.gate=true;G.walls.push(gw);       // the gate swings shut
 G.limit=Math.round(Math.min(110,46+6*n)*({SUMMER:.75,WINTER:1.25}[season().n]||1));G.time=G.limit;G.fireOn=!!perk('campfire');G.msg2=n===5||n%5===0?'A BEAR is coming':'';
 // who comes when: foxes sneak in from the start, wolf packs arrive later and louder
 G.events=[];
 const sn=season().n;const foxes=Math.min(6,1+Math.floor(n/2)+(sn==='SUMMER'?1:0));for(let i=0;i<foxes;i++)G.events.push({t:6+i*Math.max(9,G.limit/(foxes+1)),k:'fox'});
 if(n>=3){const packs=Math.min(3,Math.ceil((n-2)/2));for(let i=0;i<packs;i++)G.events.push({t:16+i*Math.max(16,G.limit/(packs+1)),k:'pack',n:Math.min(7,2+Math.floor((n-1)/2)+(sn==='WINTER'?1:0)),alpha:n>=5&&i===packs-1});}
 if(n>=4){const eg=Math.min(3,Math.floor((n-2)/2));for(let i=0;i<eg;i++)G.events.push({t:12+i*Math.max(14,G.limit/(eg+1)),k:'eagle'});}
 if(n%5===0)G.events.push({t:Math.round(G.limit*.3),k:'bear'});
 G.events.sort((a,b)=>a.t-b.t);
 G.msg='NIGHT '+n;G.msgT=2.2;G.dog.crouch=false;
}
function endNight(){
 if(G.state!=='play'||G.mode!=='night')return;
 const alive=G.sheep.filter(s=>!s.carried);
 G.herd=alive.map(s=>({type:s.type==='lamb'?'normal':s.type}));
 const lostN=G.lost;G.score+=Math.round(40*G.day+alive.length*12+(lostN===0?100:0));
 if(!G.herd.length){G.state='lost';G.best=Math.max(G.best,G.day);return;}
 // dawn brings new arrivals
 const kinds=['normal'];if(G.day>=2)kinds.push('ram','panicky');if(G.day>=3)kinds.push('black');if(G.day>=5)kinds.push('goat');
 const born=[{type:'lamb'}];born.push({type:Math.random()<.5?pick(kinds):'normal'});if(season().n==='SPRING')born.push({type:'lamb'});
 for(const b of born)if(G.herd.length<28)G.herd.push(b);
 G.dawnInfo={survivors:alive.length,lost:lostN,born:born.length,day:G.day};G.stars=lostN===0?3:lostN<=2?2:1;
 const pool=PERKS.filter(p=>!(p.max&&perk(p.id)>=p.max));G.offers=[];while(G.offers.length<3&&pool.length)G.offers.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
 G.best=Math.max(G.best,G.day);G.state='dawn';
}
function pickOffer(i){const o=G.offers[i];if(!o)return;G.perks[o.id]=perk(o.id)+1;G.day++;startDay();}

/* ---------------- helpers ---------------- */
function segPush(o,r,x1,y1,x2,y2,bounce){
 const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=l2?((o.x-x1)*dx+(o.y-y1)*dy)/l2:0;t=clamp(t,0,1);
 const px=x1+dx*t,py=y1+dy*t,ex=o.x-px,ey=o.y-py,d=hyp(ex,ey);
 if(d<r){const nx=d>1e-4?ex/d:0,ny=d>1e-4?ey/d:-1;o.x=px+nx*r;o.y=py+ny*r;const vn=o.vx*nx+o.vy*ny;if(vn<0){o.vx-=(1+bounce)*vn*nx;o.vy-=(1+bounce)*vn*ny;}}
}
function collide(o,r,bounce){
 for(const w of G.walls){if(w.broken)continue;segPush(o,r,w[0],w[1],w[2],w[3],bounce);}
 for(const k of G.rocks){const dx=o.x-k.x,dy=o.y-k.y,d=hyp(dx,dy),m=k.r+r;if(d<m){const nx=dx/(d||1),ny=dy/(d||1);o.x=k.x+nx*m;o.y=k.y+ny*m;const vn=o.vx*nx+o.vy*ny;if(vn<0){o.vx-=(1+bounce)*vn*nx;o.vy-=(1+bounce)*vn*ny;}}}
 if(o.x<r){o.x=r;o.vx=Math.abs(o.vx)*bounce;}if(o.x>W-r){o.x=W-r;o.vx=-Math.abs(o.vx)*bounce;}
 if(o.y<r){o.y=r;o.vy=Math.abs(o.vy)*bounce;}if(o.y>H-r){o.y=H-r;o.vy=-Math.abs(o.vy)*bounce;}
}
function segDist(p,w){const dx=w[2]-w[0],dy=w[3]-w[1],l2=dx*dx+dy*dy;let t=l2?((p.x-w[0])*dx+(p.y-w[1])*dy)/l2:0;t=clamp(t,0,1);return {d:hyp(p.x-(w[0]+dx*t),p.y-(w[1]+dy*t)),x:w[0]+dx*t,y:w[1]+dy*t};}
function addText(x,y,s,col){G.texts.push({x,y,s,col,t:1});}
function dust(x,y,n,col='#cbb98a'){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(10,40);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-8,t:rnd(.3,.6),max:.6,col,r:rnd(1.5,3)});}}
const buzzNow=ms=>{try{if(navigator.vibrate)navigator.vibrate(ms);}catch(_){}};

/* ---------------- the dog ---------------- */
const barkR=()=>150*(1+.3*perk('bark')), barkCD=()=>2.4*(1-.2*Math.min(2,perk('bark')));
const dogSpeed=()=>(G.dog.crouch?95:210)*(1+.15*perk('legs'));
const zoneMult=()=>(G.dog.crouch?1.18:1)*(1+.15*perk('nose'));
function bark(){
 const d=G.dog;if(G.barkCd>0||G.state!=='play'||d.stun>0)return;
 G.barkCd=barkCD();const R=barkR();G.rings.push({x:d.x,y:d.y,r:10,max:R,t:.45});
 for(const s of G.sheep){if(s.inPen||s.carried)continue;const dx=s.x-d.x,dy=s.y-d.y,dist=hyp(dx,dy);if(dist<R&&dist>0.1){const f=(1-dist/R),m=s.type==='ram'?.4:1;s.vx+=dx/dist*190*f*m;s.vy+=dy/dist*190*f*m;s.panic=Math.max(s.panic,.9*m);}}
 for(const p of G.preds){const dist=hyp(p.x-d.x,p.y-d.y);if(dist<R*1.35)scarePred(p,2.8,true);}
 dust(d.x,d.y,8);
}
function updateDog(dt){
 const d=G.dog;d.stun=Math.max(0,d.stun-dt);
 let ax=0,ay=0,mag=0;
 if(G.bot){const dx=d.tx-d.x,dy=d.ty-d.y,dist=hyp(dx,dy);if(dist>6){ax=dx/dist;ay=dy/dist;mag=Math.min(1,dist/50);}}
 else{
  let jx=(keys.r?1:0)-(keys.l?1:0),jy=(keys.d?1:0)-(keys.u?1:0);
  if(stick.on){jx=stick.vx;jy=stick.vy;}
  mag=Math.min(1,hyp(jx,jy));if(mag>.02){ax=jx/hyp(jx,jy);ay=jy/hyp(jx,jy);}
  d.walk=stick.on&&mag>0.12&&mag<.58;
  d.crouch=calmHeld||d.walk;
 }
 const speedK=G.bot?mag:(d.crouch?Math.max(.55,mag):(mag<.12?0:.62+.38*Math.min(1,(mag-.12)/.5)));
 const zn0=zoneAt(d),sp=dogSpeed()*(d.stun>0?.3:1)*speedK*(zn0?(zn0.k==='water'?.45:.65):1);
 d.vx+=(ax*sp-d.vx)*Math.min(1,dt*9);d.vy+=(ay*sp-d.vy)*Math.min(1,dt*9);
 d.x+=d.vx*dt;d.y+=d.vy*dt;collide(d,6,0);
 bumpSheep(d,dt);bumpPreds(d);
 const v=hyp(d.vx,d.vy);if(v>20){d.hx=d.vx/v;d.hy=d.vy/v;if(Math.abs(d.vx)>10)d.face=d.vx>0?1:-1;}
 d.run+=dt*(v/22);
 if(v>110&&Math.random()<dt*14)dust(d.x,d.y+5,1);
 G.barkCd=Math.max(0,G.barkCd-dt);G.flareCd=Math.max(0,G.flareCd-dt);
 // at night, standing close to the fence with CALM held repairs it
 if(G.mode==='night'&&d.crouch&&hyp(d.vx,d.vy)<60){for(const w of G.walls){if(!w.pen)continue;const sd=segDist(d,w);if(sd.d<48&&(w.hp<w.max||w.broken)){w.hp=Math.min(w.max,w.hp+16*(1+perk('fence'))*dt);if(w.broken&&w.hp>=22){w.broken=false;addText(sd.x,sd.y-10,'FENCE UP','#9aff9a');}if(Math.random()<dt*6)dust(sd.x,sd.y,1,'#d8b878');}}}
}
/* the dog is solid: you shoulder sheep aside (and slow down). A hard bump startles them; a slow crouching nudge does not. */
function bumpSheep(d,dt){
 for(const s of G.sheep){
  if(s.carried)continue;
  s.bumpT=Math.max(0,(s.bumpT||0)-dt);
  const dx=s.x-d.x,dy=s.y-d.y,dist=hyp(dx,dy),min=6+s.T.r;
  if(dist>=min||dist<.01)continue;
  const nx=dx/dist,ny=dy/dist,pen=min-dist,heavy=s.type==='ram';
  const impact=Math.max(0,d.vx*nx+d.vy*ny);
  const ks=heavy?.15:.7;s.x+=nx*pen*ks;s.y+=ny*pen*ks;d.x-=nx*pen*(1-ks);d.y-=ny*pen*(1-ks);
  if(impact>0){d.vx-=nx*impact*(heavy?.85:.55);d.vy-=ny*impact*(heavy?.85:.55);}
  s.vx+=nx*(impact*(heavy?.15:.55)+18);s.vy+=ny*(impact*(heavy?.15:.55)+18);
  if(impact>115&&!s.inPen&&s.bumpT<=0&&!heavy){s.bumpT=.6;s.panic=Math.max(s.panic,.75);s.flash=.2;dust(s.x,s.y,5,'#fff6c8');addText(s.x,s.y-14,'BUMP!','#ffb84a');buzzNow(18);}
 }
}
function bumpPreds(d){
 for(const p of G.preds){
  if(p.k==='eagle')continue;
  const dx=p.x-d.x,dy=p.y-d.y,dist=hyp(dx,dy),min=6+p.r;if(dist>=min||dist<.01)continue;
  const nx=dx/dist,ny=dy/dist;p.x+=nx*(min-dist)*.8;p.y+=ny*(min-dist)*.8;p.vx+=nx*160;p.vy+=ny*160;
  if((p.k==='wolf'||p.k==='bear')&&d.stun<=0&&p.hes<=0){d.stun=.6;d.vx-=nx*140;d.vy-=ny*140;addText(d.x,d.y-14,'OOF!','#ff8a6a');p.hes=.4;buzzNow(30);}
  if(p.k==='fox'&&p.carry){dropCarry(p);}
 }
}
function updateHelper(dt){
 const h=G.helper;if(!h)return;
 let ax=0,ay=0,sp=140;
 if(G.mode==='night'&&G.preds.length){ // chase the predator closest to the flock, flare the others away
  let best=null,bd=1e9;for(const p of G.preds){const d=hyp(p.x-h.x,p.y-h.y)+(p.carry?-200:0);if(d<bd){bd=d;best=p;}}
  const dx=best.x-h.x,dy=best.y-h.y,l=hyp(dx,dy)||1;ax=dx/l;ay=dy/l;sp=l<24?60:165;
  if(l<95)scarePred(best,.9,false);
 }else{
  const loose=G.sheep.filter(s=>!s.inPen&&!s.carried);if(!loose.length)return;
  const g={x:G.pen.x,y:G.pen.gy};let far=loose[0],fd=-1;for(const s of loose){const d=hyp(s.x-g.x,s.y-g.y);if(d>fd){fd=d;far=s;}}
  const ux=(far.x-g.x)/(fd||1),uy=(far.y-g.y)/(fd||1);const tx=far.x+ux*95,ty=far.y+uy*95;
  const dx=tx-h.x,dy=ty-h.y,dist=hyp(dx,dy);ax=dx/(dist||1);ay=dy/(dist||1);
  for(const s of loose){const sx=s.x-h.x,sy=s.y-h.y,sd=hyp(sx,sy);if(sd<80&&sd>1&&hyp(far.x-h.x,far.y-h.y)>110){ax-=sx/sd*(1-sd/80)*1.6;ay-=sy/sd*(1-sd/80)*1.6;}}
  const l=hyp(ax,ay)||1;ax/=l;ay/=l;sp=dist<20?40:140;
 }
 h.vx+=(ax*sp-h.vx)*Math.min(1,dt*6);h.vy+=(ay*sp-h.vy)*Math.min(1,dt*6);h.x+=h.vx*dt;h.y+=h.vy*dt;collide(h,6,0);
 if(Math.abs(h.vx)>10)h.face=h.vx>0?1:-1;h.run+=dt*hyp(h.vx,h.vy)/22;
}
/* ---------------- the flock ---------------- */
function pressureFrom(s,p,hx,hy,mult,calm,dt,zoneBase){
 const T=s.T,dx=s.x-p.x,dy=s.y-p.y,dist=hyp(dx,dy),Z=(zoneBase||T.zone)*mult;
 if(dist>=Z||dist<0.1)return 0;
 const t=1-dist/Z,ux=dx/dist,uy=dy/dist;

   let cx=0,cy=0,vx=0,vy=0,n=0,sx=0,sy=0;

function update(dt){
 G.t+=dt;G.msgT=Math.max(0,(G.msgT||0)-dt);

 for(const r of G.rings){r.t-=dt;r.r+=(r.max-r.r)*Math.min(1,dt*9);}G.rings=G.rings.filter(r=>r.t>0);
 for(const w of G.warns)w.t-=dt;G.warns=G.warns.filter(w=>w.t>0);
 if(G.flare){G.flare.t-=dt;if(G.flare.t<=0)G.flare=null;}
 if(G.state!=='play')return;
 if(G.bot)(G.mode==='day'?botDay:botNight)(dt);
 updateDog(dt);updateHelper(dt);
 if(G.mode==='night'){
  while(G.events.length&&G.events[0].t<=G.t){const e=G.events.shift();if(e.k==='fox')spawnFox();else if(e.k==='eagle')spawnEagle();else if(e.k==='bear')spawnBear();else spawnPack(e.n,e.alpha);}
  updatePreds(dt);
  G.oil=Math.max(0,G.oil-dt*(1-.3*perk('lantern')*0+.0)*(perk('lantern')?.8:1));
 }
 updateSheep(dt);
 G.time-=dt;
 if(G.mode==='day'){
  if(G.penned>=G.sheep.length&&G.sheep.length)endDay('all');
  else if(G.time<=0){G.time=0;endDay('time');}
 }else{
  if(!G.sheep.length){G.herd=[];G.state='lost';G.best=Math.max(G.best,G.day);}
  else if(G.time<=0){G.time=0;endNight();}
 }
}

 const g={x:G.pen.x+G.pen.w*.6,y:G.pen.gy};

 else if(G.state==='dusk'){startNight();}
}

 c.fillStyle='#8a6a4a';c.beginPath();c.ellipse(21,-2,4.5,3.5,0,0,TAU);c.fill();c.fillStyle='#1c1816';c.fillRect(23,-4,2.5,2.5);c.fillStyle='#ff9a4a';c.fillRect(15,-7,2,2);
 c.restore();
 c.fillStyle='#3a1a1a';c.fillRect(p.x-16,p.y-28,32,4);c.fillStyle=p.scared>0?'#9aff9a':'#ff6a6a';c.fillRect(p.x-16,p.y-28,32*(p.courage/4),4);

function drawWolf(p){

 c.restore();
 if(p.scared>0||p.hes>0){c.fillStyle='#fff';c.font='bold 11px monospace';c.textAlign='center';c.fillText(p.scared>0?'!':'?',p.x,p.y-16*sc);}

function layoutOffers(){const n=G.offers.length,w=250,gap=18,x0=(W-(n*w+(n-1)*gap))/2;return G.offers.map((o,i)=>({x:x0+i*(w+gap),y:200,w,h:200}));}
const dk=document.createElement('canvas');dk.width=2000;dk.height=H;const dc=dk.getContext('2d');

 const dawn=clamp(1-G.time/9,0,1),A=.9*(1-dawn*.85);
 dk.width=W;dc.globalCompositeOperation='source-over';dc.clearRect(0,0,W,H);dc.fillStyle=`rgba(6,10,36,${A})`;dc.fillRect(0,0,W,H);

 const hole=(x,y,r,k=1)=>{const g=dc.createRadialGradient(x,y,r*.12,x,y,r);g.addColorStop(0,`rgba(0,0,0,${k})`);g.addColorStop(.65,`rgba(0,0,0,${.85*k})`);g.addColorStop(1,'rgba(0,0,0,0)');dc.fillStyle=g;dc.beginPath();dc.arc(x,y,r,0,TAU);dc.fill();};
 const fl=1+Math.sin(G.t*11)*.025+Math.sin(G.t*23)*.02;
 hole(G.dog.x,G.dog.y,lightR()*fl);
 if(G.helper)hole(G.helper.x,G.helper.y,60,.7);
 if(G.flare)hole(G.flare.x,G.flare.y,G.flare.r*(.85+.15*Math.min(1,G.flare.t)),1);

 else{const P=G.pen;hole(P.x+P.w/2,P.y+P.h/2,70,.35);}
 c.drawImage(dk,0,0);
}

 drawGrass();drawZones();drawPen();drawRocks();

 if(G.dog&&(G.state==='play')&&G.mode==='day'){const d=G.dog,Z=120*zoneMult();c.strokeStyle=d.crouch?'rgba(160,220,255,.45)':'rgba(255,255,255,.14)';c.lineWidth=1.5;c.setLineDash([5,6]);c.beginPath();c.arc(d.x,d.y,Z,0,TAU);c.stroke();c.setLineDash([]);}
 const list=G.sheep.map(s=>({y:s.y,s})).concat(G.preds.map(p=>({y:p.y,p}))).concat(G.dog&&G.state!=='ready'?[{y:G.dog.y,dog:1}]:[]).concat(G.helper?[{y:G.helper.y,helper:1}]:[]).concat(G.rocks.filter(k=>k.tree).map(k=>({y:k.y+10,tree:k}))).sort((a,b)=>a.y-b.y);
 for(const o of list){if(o.s)drawSheep(o.s);else if(o.p){if(o.p.k==='fox')drawFox(o.p);else if(o.p.k==='eagle')drawEagle(o.p);else if(o.p.k==='bear')drawBear(o.p);else drawWolf(o.p);}else if(o.tree)drawTree(o.tree);else if(o.dog)drawDog(G.dog,'#2a2220',G.dog.crouch);else drawDog(G.helper,'#6a4a2a',false);}
 for(const p of G.parts){c.globalAlpha=clamp(p.t/p.max*1.5,0,1);c.fillStyle=p.col;c.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);}c.globalAlpha=1;
 if(G.mode==='night'&&G.state!=='ready'&&G.dog){

  // howls: red arrows at the edge where a pack is coming in
  for(const w of G.warns){c.globalAlpha=clamp(w.t,0,1)*(.5+.5*Math.sin(G.t*14));c.fillStyle=w.k==='wolf'?'#ff6a6a':'#ffb84a';const ax=clamp(w.x,24,W-24),ay=clamp(w.y,64,H-24);c.beginPath();c.arc(ax,ay,13,0,TAU);c.fill();c.fillStyle='#2a1408';c.font='bold 14px monospace';c.textAlign='center';c.fillText(w.k==='wolf'?'W':w.k==='bear'?'B':w.k==='eagle'?'E':'F',ax,ay+5);c.globalAlpha=1;}
 }
 for(const t of G.texts){c.globalAlpha=clamp(t.t*2,0,1);txt(t.s,t.x,t.y,t.col,13,'center');}c.globalAlpha=1;
 if(G.state==='play'||G.state==='dusk'||G.state==='dawn'||G.state==='lost'){
  c.fillStyle='rgba(20,12,26,.78)';c.fillRect(0,0,W,40);
  if(G.mode==='day'){
   txt('DAY '+G.day+' '+season().n.slice(0,3),14,26,'#ffd24a',16);txt('TIME '+Math.ceil(G.time),130,26,G.time<15?'#ff8a6a':'#fff',17);
   txt(`PEN ${G.penned}/${G.sheep.length}`,260,26,'#9aff9a',17);txt('SCORE '+G.score,W-330,26,'#ffe9a8',15);
   if(G.state==='play'&&G.penned>=Math.ceil(G.sheep.length*.6)){c.fillStyle='rgba(60,30,90,.95)';c.fillRect(BTN_DUSK.x,BTN_DUSK.y,BTN_DUSK.w,BTN_DUSK.h);c.strokeStyle='#c8a0ff';c.lineWidth=2;c.strokeRect(BTN_DUSK.x,BTN_DUSK.y,BTN_DUSK.w,BTN_DUSK.h);txt('CALL DUSK >',BTN_DUSK.x+BTN_DUSK.w/2,BTN_DUSK.y+21,'#e8d8ff',14,'center');}
  }else{
   txt('NIGHT '+G.day,14,26,'#9ab8ff',17);
   const frac=clamp(1-G.time/G.limit,0,1);c.fillStyle='#1a1a40';c.fillRect(120,12,200,14);c.fillStyle='#ffb84a';c.fillRect(120,12,200*frac,14);txt('DAWN',130,24,'#2a1408',11);
   const of=G.oilMax?clamp(G.oil/G.oilMax,0,1):0;c.fillStyle='#3a2a10';c.fillRect(340,12,110,14);c.fillStyle=of<.25?'#ff6a4a':'#ffd24a';c.fillRect(340,12,110*of,14);txt('OIL',346,24,'#2a1408',11);
   txt(`SHEEP ${G.sheep.filter(s=>!s.carried).length}   LOST ${G.lost}`,470,26,'#fff',16);
  }
  const pk=PERKS.filter(p=>perk(p.id));pk.forEach((p,i)=>{c.fillStyle='#ffd24a';c.beginPath();c.arc(W-78-i*26,20,10,0,TAU);c.fill();txt(p.ic,W-78-i*26,25,'#2a1408',13,'center');});
  c.fillStyle='rgba(20,12,26,.7)';c.fillRect(FS.x,FS.y,FS.w,FS.h);c.strokeStyle='#ffb84a';c.lineWidth=2;c.strokeRect(FS.x,FS.y,FS.w,FS.h);txt('FULL',FS.x+FS.w/2,FS.y+19,'#ffe9c0',12,'center');
 }

 }
 if(G.state==='ready'){c.fillStyle='rgba(10,20,10,.62)';c.fillRect(0,0,W,H);txt('SHEEPDOG',W/2,150,'#fff6c8',60,'center');

 if(G.state==='dusk'){const I=G.duskInfo;c.fillStyle='rgba(18,10,50,.82)';c.fillRect(0,0,W,H);

 if(G.state==='dawn'){const I=G.dawnInfo;c.fillStyle='rgba(60,36,20,.8)';c.fillRect(0,0,W,H);

   c.fillStyle='#ffd24a';c.beginPath();c.arc(o.x+o.w/2,o.y+46,26,0,TAU);c.fill();txt(p.ic,o.x+o.w/2,o.y+56,'#2a1408',28,'center');
   txt(p.n,o.x+o.w/2,o.y+104,'#fff',19,'center');
   const words=p.d.split(' ');let line='',yy=o.y+130;for(const w of words){if((line+' '+w).length>27){txt(line,o.x+o.w/2,yy,'#d8c8b0',14,'center');yy+=18;line=w;}else line=(line+' '+w).trim();}txt(line,o.x+o.w/2,yy,'#d8c8b0',14,'center');
   txt(String(i+1),o.x+12,o.y+22,'#9a8a7a',14);});}
 if(G.state==='lost'){c.fillStyle='rgba(30,10,10,.78)';c.fillRect(0,0,W,H);txt('THE FLOCK IS GONE',W/2,200,'#ff8a6a',44,'center');

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;while(acc>=1/60){update(1/60);acc-=1/60;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__sd={W:()=>W,keys,G,step:n=>{for(let i=0;i<n;i++)update(1/60);render();},start:()=>startGame(),cont:()=>advance(),next:i=>pickOffer(i||0),bot:v=>{G.bot=v;},bark,useFlare,render,endDay};
