<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1210">
<title>Ridgeline: a trail running roguelike</title>
<style>
html,body{margin:0;height:100%;background:#0d1210;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#g{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;background:#0d1210;touch-action:none}
</style>
</head>
<body>
<canvas id="g" aria-label="Ridgeline"></canvas>
<script>
/* RIDGELINE: a trail-running roguelike for phones (prototype).
   You control only your EFFORT, one thumb on a fader. The trail does the rest. Effort drives speed, but also heart rate and legs: hills and heat push your
   heart rate up, redlining burns your legs, and an empty tank means a bonk. Eat and drink on the move, make quick calls at trail events (creek, scree, fork...),
   and draft gear at aid stations. Finish every stage of a race inside the cutoff for a bronze medal; beat the par time for silver; beat the gold time without
   bonking for gold. Races unlock in order on the map. Everything here is one self-contained file. */
(()=>{
'use strict';
const W=270,H=480,SC=2,TAU=Math.PI*2;
const cvs=document.getElementById('g'),c=cvs.getContext('2d');cvs.width=W*SC;cvs.height=H*SC;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cvs.style.width=(W*s)+'px';cvs.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
const MONO='ui-monospace,Menlo,Consolas,"Courier New",monospace';
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let audioCtx=null;
function beep(f,d=.08,type='square',v=.04,sl=0){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;if(sl)o.frequency.linearRampToValueAtTime(f+sl,audioCtx.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}

/* ---------- save ---------- */
const KEY='ridgeline-v1';let save={medals:{}};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.medals)save=j;}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}};
const MEDAL_COL={bronze:'#c98a4a',silver:'#cfd6e0',gold:'#ffd24a'};

/* ---------- races ---------- */
const RACES=[
  {id:'pine',name:'Pine Ridge 5K',km:5,stages:2,theme:'dawn',tier:0,blurb:'Cool morning, gentle hills. Learn to pace.'},
  {id:'canyon',name:'Canyon Loop 15K',km:15,stages:3,theme:'noon',tier:1,blurb:'Hot rock and steep sections. Heat bites.'},
  {id:'sky',name:'Skyline 30K',km:30,stages:4,theme:'dusk',tier:2,blurb:'A long climb to the ridge. Ration everything.'},
];
const THEMES={dawn:{sky:['#f2a78c','#6a5a9a'],sun:[200,70,'#ffe0b0'],heat:.1,mt:['#4a4470','#3a3560'],tree:'#1f3a34',gnd:'#3a5a3c'},
              noon:{sky:['#69bff2','#dff2ff'],sun:[70,40,'#fff6c0'],heat:.65,mt:['#7a88a8','#667392'],tree:'#2a5a3a',gnd:'#8a7048'},
              dusk:{sky:['#e06a58','#2a1a4a'],sun:[220,110,'#ff9a5a'],heat:.3,mt:['#5a3a6a','#3a2858'],tree:'#1a2a30',gnd:'#4a4030'}};
const TERRAIN={smooth:{n:'Smooth trail',f:1,col:'#6a5a3a'},rocky:{n:'Rocky',f:.84,col:'#6a6a70'},loose:{n:'Loose scree',f:.74,col:'#8a7a5a'},mud:{n:'Mud',f:.8,col:'#4a3a2c'},creek:{n:'Creek bed',f:.7,col:'#3a6a8a'}};
const ZONES=[{n:'Easy',max:.3,col:'#6a8ab0'},{n:'Steady',max:.55,col:'#6ac07a'},{n:'Tempo',max:.75,col:'#e8d24a'},{n:'Hard',max:.9,col:'#f0903a'},{n:'Redline',max:1.01,col:'#e84a3a'}];
const HRZ=[.55,.7,.8,.9];

/* ---------- gear ---------- */
const GEAR={
  poles:{n:'Trekking poles',t:'Climbs cost 15% less speed and 10% less legs.'},
  shoes:{n:'Trail shoes',t:'Rocky, loose and muddy ground slows you half as much. Fewer falls.'},
  flask:{n:'Soft flasks',t:'+2 drinks in your pack.'},gels:{n:'Gel pack',t:'+2 gels in your pack.'},
  hat:{n:'Sun hat',t:'Heat hurts 60% less.'},sleeves:{n:'Compression sleeves',t:'Legs recover 40% faster.'},
  tape:{n:'Blister tape',t:'You cannot get blisters this race.'},watch:{n:'Pacing watch',t:'Shows the sweet-spot effort on your fader.'},
  buff:{n:'Cooling buff',t:'Heart rate runs 4 beats-per-effort cooler in the heat.'},
};

/* ---------- state ---------- */
let scene='map',race=null,R_=null,S=null,P=null,t=0,sceneT=0,paused=false,shake=0,flash=0,msg='',msgT=0;
const HIT=[],popups=[],parts=[];
const pop=(s,x,y,col='#fff')=>popups.push({s,x,y,t:1.2,col});
const banner=(s,n=1.6)=>{msg=s;msgT=n;};

/* ---------- stage generation ---------- */
function genStage(r,si){
  const L=1000+120*r.tier+60*si,segs=[];let x=0,e=0;const tier=r.tier,amp=.05+.035*tier+.01*si;
  const th=THEMES[r.theme];
  const tw=tier===0?{smooth:5,rocky:2,loose:1,mud:1,creek:1}:tier===1?{smooth:3,rocky:4,loose:3,mud:1,creek:2}:{smooth:2,rocky:4,loose:4,mud:2,creek:2};
  const pickTer=()=>{const k=Object.keys(tw);let q=Math.random()*k.reduce((a,b)=>a+tw[b],0);for(const n of k){q-=tw[n];if(q<=0)return n;}return 'smooth';};
  while(x<L){const len=Math.min(L-x,rint(80,190)),roll=Math.random();let g=roll<.4?rnd(.03,amp*2.1):roll<.72?rnd(-amp*1.7,-.02):rnd(-.01,.02);if(si===0&&x<150)g=rnd(0,.02);
    const ter=pickTer();segs.push({x0:x,len,g,t:ter,e0:e});e+=len*g;x+=len;}
  const evs=[],pool=['creek','climb','scree','fork','oranges','heat','blister'];
  const n=3+(tier>0?1:0),slots=[];for(let i=0;i<n;i++)slots.push(L*(.16+.7*(i+rnd(.2,.8))/n));
  let ps=shuffle(pool);slots.forEach((px,i)=>evs.push({x:px,k:ps[i%ps.length],done:false}));
  return {L,segs,evs,heat:th.heat+rnd(-.1,.15),cut:L/[9.2,8.4,7.6][tier],trees:Array.from({length:60},()=>({x:rnd(0,L+80),h:rnd(14,30)})),elevEnd:e};
}
const segAt=(st,x)=>{const s=st.segs;for(let i=0;i<s.length;i++)if(x<s[i].x0+s[i].len)return s[i];return s[s.length-1];};
const elevAt=(st,x)=>{const s=segAt(st,x);return s.e0+(Math.min(x,s.x0+s.len)-s.x0)*s.g;};

/* ---------- run ---------- */
function startRace(r){
  race=r;R_={si:0,times:[],bonks:0,gear:[],sips:3,gels:2,blister:false,total:0,stageStart:0};
  scene='draft';sceneT=0;R_.draft=shuffle(Object.keys(GEAR)).slice(0,3);R_.draftFor='start';
}
function startStage(){
  S=genStage(race,R_.si);const th=THEMES[race.theme];
  P={x:0,effort:.3,hr:.45,legs:R_.legs!=null?R_.legs:100,water:R_.water!=null?R_.water:100,fuel:R_.fuel!=null?R_.fuel:100,bonk:0,stop:0,slow:null,hike:0,cramp:0,redT:0,ankle:0,cool:0,stumbleT:0,phase:0,t:0,speed:0,face:1,cut:S.cut,elevCam:0,ev:null,drinkT:0,bonked:false,hrAvg:0};
  P.elevCam=0;popups.length=0;parts.length=0;scene='run';sceneT=0;banner(`Stage ${R_.si+1} of ${race.stages}`,1.8);beep(520,.12);
}
const has=g=>R_&&R_.gear.includes(g);
const PS=[19,17,15.5],PG=[23,20,18],avgL=()=>1000+120*race.tier+60*(race.stages-1)/2;
const par=()=>({silver:race.stages*avgL()/PS[race.tier],gold:race.stages*avgL()/PG[race.tier]});
const simTS=()=>(race.km/race.stages)*5.54;
const fmtT=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');};

/* ---------- physics ---------- */
function sweetEffort(g,heat){return clamp((.74-.28-1.1*Math.max(0,g)-heat*.06)/.62,.1,.9);}
function update(dt){
  t+=dt;sceneT+=dt;shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt*2);if(msgT>0)msgT-=dt;
  for(const p of popups)p.t-=dt;for(let i=popups.length-1;i>=0;i--)if(popups[i].t<=0)popups.splice(i,1);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.t-=dt;}for(let i=parts.length-1;i>=0;i--)if(parts[i].t<=0)parts.splice(i,1);
  if(paused)return;
  if(scene==='event'){P.ev.t-=dt;if(P.ev.t<=0)chooseEvent(0);return;}
  if(scene!=='run')return;
  const seg=segAt(S,P.x),g=seg.g,ter=TERRAIN[seg.t];P.t+=dt;
  const heat=S.heat*(has('hat')?.4:1)*(P.cool>0?.3:1);
  let e=P.effort;
  if(P.bonk>0){P.bonk-=dt;e=Math.min(e,.15);if(P.bonk<=0){P.legs=Math.max(P.legs,14);banner('You find your legs again',1.6);}}
  if(P.hike>0){P.hike-=dt;e=Math.min(e,.2);}
  if(P.cramp>0){P.cramp-=dt;e=Math.min(e,.35);}
  // speed
  let v=9+26*Math.pow(e,.9);
  if(g>0)v*=clamp(1-3.0*g*(has('poles')?.85:1),.4,1);else v*=1+Math.min(.35,-g*2.2);
  const terPen=1-ter.f;v*=1-terPen*((has('shoes')&&seg.t!=='smooth')?.5:1);
  if(P.legs<25)v*=.6+.4*P.legs/25;
  if(R_.blister)v*=.92;if(P.ankle>0){P.ankle-=dt;v*=.85;}
  if(P.slow){P.slow.t-=dt;v*=P.slow.v;if(P.slow.t<=0)P.slow=null;}
  if(P.hike>0)v=Math.min(v,11*(has('poles')?1.2:1))*(g>0?1:1);
  if(P.bonk>0)v=Math.min(v,7);
  if(P.drinkT>0){P.drinkT-=dt;v*=.55;}
  if(P.stop>0){P.stop-=dt;v=0;}
  P.speed+=(v-P.speed)*(1-Math.exp(-dt*3));P.x+=P.speed*dt;P.phase+=P.speed*dt*.085;
  // heart rate
  let tgt=.28+.62*e+1.1*Math.max(0,g)+heat*.07+(P.water<20?.08:0)+(has('buff')&&heat>.3?-.03:0);tgt=clamp(tgt,.3,1);
  P.hr+=(tgt-P.hr)*(1-Math.exp(-dt/(tgt>P.hr?5:9)));
  // legs
  let drain=.35+13*Math.pow(Math.max(0,P.hr-.62),1.6);
  if(g<-.06&&e>.55)drain+=Math.max(0,-g-.06)*30*e;
  if(g>0&&has('poles'))drain*=.9;
  if(P.fuel<20)drain*=1.5;if(P.water<20)drain*=1.3;
  if(P.hr<.6){const rec=.8*(.6-P.hr)/.3*(has('sleeves')?1.4:1)*(P.fuel<15?.6:1);P.legs=Math.min(100,P.legs+rec*dt);}
  if(P.hr>.62)P.legs-=drain*dt;else P.legs-=.2*dt;
  if(P.legs<=0&&P.bonk<=0){P.legs=0;P.bonk=12;R_.bonks++;P.bonked=true;banner('BONK! Your legs give out',2);shake=6;beep(160,.4,'sawtooth',.06,-60);flash=.6;}
  // hydration and fuel
  P.water=Math.max(0,P.water-.45*(.5+e+heat*.6)*dt);P.fuel=Math.max(0,P.fuel-.32*(.4+e)*dt);
  // cramp from redlining while dry
  if(P.hr>.92){P.redT+=dt;if(P.redT>6&&P.water<35&&P.cramp<=0){P.cramp=9;P.redT=0;banner('Cramp! Ease off',1.8);beep(200,.2,'sawtooth',.05);}}else P.redT=Math.max(0,P.redT-dt);
  // stumbles on technical ground
  if((seg.t==='rocky'||seg.t==='loose')&&e>.8&&Math.random()<(has('shoes')?.008:.016)*dt*60/60*1){P.stop=Math.max(P.stop,.7);P.legs-=6;pop('stumble',96,P.sy||200,'#ffb08a');shake=3;}
  // particles
  if(P.speed>6&&Math.random()<dt*14){parts.push({x:96-4,y:groundY(P.x)-1,vx:rnd(-16,-5),vy:rnd(-12,-3),g:30,t:.5,col:seg.t==='mud'?'#5a4a3a':'#a89a78',s:1.5});}
  if(P.hr>.85&&Math.random()<dt*8)parts.push({x:96+2,y:groundY(P.x)-26,vx:rnd(-6,6),vy:rnd(-20,-8),g:40,t:.6,col:'#9ad8ff',s:1.5});
  // events and stage end
  for(const ev of S.evs)if(!ev.done&&P.x>=ev.x){ev.done=true;openEvent(ev);return;}
  P.cutLeft=S.cut-P.t;
  if(P.t>S.cut){fail('Missed the cutoff');return;}
  if(P.x>=S.L)finishStage();
}
function groundY(wx){return 192-(elevAt(S,wx)-P.elevCam)*EV;}
const PXU=1.75,EV=PXU*2.2;

/* ---------- events ---------- */
const EVENTS={
  creek:{t:'Creek crossing',d:'Cold water runs over the trail. Wade it or hop the stones?',
    a:{t:'Wade across',h:'Safe and cooling, but slow',fn(){P.slow={t:6,v:.6};P.hr=Math.max(.3,P.hr-.08);P.legs=Math.min(100,P.legs+6);pop('cooled off',96,150,'#9ad8ff');if(!has('tape')&&Math.random()<.2&&!R_.blister){R_.blister=true;pop('blister!',96,140,'#ffb08a');}}},
    b:{t:'Leap the stones',h:'65% you gain ground, 35% you fall',fn(){if(Math.random()<.65){P.x+=28;pop('+ground',96,150,'#9aff9a');}else{P.legs-=16;P.ankle=20;P.stop=.8;shake=5;pop('fell!',96,150,'#ff8a7a');}}}},
  climb:{t:'Steep climb',d:'The trail kicks up. Power-hike it, or run it?',
    a:{t:'Power-hike',h:'Walk for 10 s: heart rate drops, legs recover',fn(){P.hike=10;pop('hiking',96,150,'#9ad8ff');}},
    b:{t:'Run it',h:'Gain ground now, but heart rate spikes',fn(){P.x+=34;P.hr=Math.min(1,P.hr+.15);P.legs-=8;pop('+ground',96,150,'#9aff9a');}}},
  scree:{t:'Loose scree',d:'A slope of shifting stones.',
    a:{t:'Pick your way',h:'Slower, safe',fn(){P.slow={t:7,v:.7};}},
    b:{t:'Send it',h:'55% big gain, 45% you stumble',fn(){if(Math.random()<.55){P.x+=38;pop('+ground',96,150,'#9aff9a');}else{P.stop=1.6;P.legs-=10;shake=5;pop('stumble',96,150,'#ff8a7a');}}}},
  fork:{t:'A fork',d:'A steep shortcut up the ridge, or the long switchbacks.',
    a:{t:'Shortcut',h:'Skip 160 m, but a hard push',fn(){P.x+=160;P.hr=Math.min(1,P.hr+.14);P.legs-=14;pop('shortcut',96,150,'#9aff9a');}},
    b:{t:'Switchbacks',h:'Easy, recover a little',fn(){P.legs=Math.min(100,P.legs+4);P.hr=Math.max(.3,P.hr-.03);}}},
  oranges:{t:'Orange slices',d:'A volunteer at a lonely crossing offers fruit.',
    a:{t:'Take some',h:'Stop 2 s: +25 fuel, +6 legs',fn(){P.stop=2;P.fuel=Math.min(100,P.fuel+25);P.legs=Math.min(100,P.legs+6);beep(880,.1,'triangle');}},
    b:{t:'Wave and run',h:'Keep your rhythm',fn(){}}},
  heat:{t:'Heat wave',d:'The sun comes out and the trail turns to an oven.',
    a:{t:'Douse your head',h:'-15 water, but cooler for 25 s',fn(){P.water=Math.max(0,P.water-15);P.cool=25;P.hr=Math.max(.3,P.hr-.05);}},
    b:{t:'Push on',h:'Save the water',fn(){}}},
  blister:{t:'Hot spot',d:'Your foot is starting to burn.',
    a:{t:'Stop and tape',h:'Stop 4 s, no blister',fn(){P.stop=4;R_.blister=false;}},
    b:{t:'Ignore it',h:'30% chance of a blister',fn(){if(!has('tape')&&!R_.blister&&Math.random()<.3){R_.blister=true;pop('blister!',96,150,'#ffb08a');}}}},
};
function openEvent(ev){P.ev={k:ev.k,t:6,max:6};scene='event';sceneT=0;beep(660,.1,'triangle');}
function chooseEvent(i){if(scene!=='event')return;const d=EVENTS[P.ev.k];(i?d.b:d.a).fn();scene='run';P.ev=null;beep(i?520:440,.08,'triangle');}

/* ---------- actions ---------- */
function drink(){if(scene!=='run'||R_.sips<=0||P.drinkT>0)return;R_.sips--;P.water=Math.min(100,P.water+38);P.drinkT=1.3;beep(700,.1,'sine');pop('+water',96,150,'#9ad8ff');}
function gel(){if(scene!=='run'||R_.gels<=0||P.drinkT>0)return;R_.gels--;P.fuel=Math.min(100,P.fuel+42);P.legs=Math.min(100,P.legs+8);P.drinkT=1.1;beep(800,.1,'sine');pop('+fuel',96,150,'#ffe08a');}
function finishStage(){
  R_.times.push(P.t);R_.total+=P.t;R_.legs=P.legs;R_.water=P.water;R_.fuel=P.fuel;beep(988,.2,'triangle');
  if(R_.si+1>=race.stages)return endRace(true);
  scene='aid';sceneT=0;R_.draftFor='aid';R_.draft=shuffle(Object.keys(GEAR).filter(g=>!R_.gear.includes(g))).slice(0,3);
  // aid station restores
  R_.legs=Math.min(100,P.legs+50);R_.water=100;R_.fuel=Math.min(100,P.fuel+30);R_.sips=Math.max(R_.sips,3+(has('flask')?2:0));R_.gels=Math.max(R_.gels,2+(has('gels')?2:0));
}
function fail(why){scene='dnf';sceneT=0;R_.why=why;beep(150,.5,'sawtooth',.06,-80);}
function endRace(done){
  scene='result';sceneT=0;const pr=par();R_.res={total:R_.total,medal:'bronze'};
  if(R_.total<=pr.silver)R_.res.medal='silver';if(R_.total<=pr.gold&&R_.bonks===0)R_.res.medal='gold';
  const prev=save.medals[race.id],order={bronze:1,silver:2,gold:3};if(!prev||order[R_.res.medal]>order[prev])save.medals[race.id]=R_.res.medal;persist();beep(1046,.4,'triangle');
}
function draftPick(g){
  R_.gear.push(g);if(g==='flask')R_.sips+=2;if(g==='gels')R_.gels+=2;beep(740,.1,'triangle');
  if(R_.draftFor==='start'){R_.legs=100;R_.water=100;R_.fuel=100;R_.si=0;startStage();}else{R_.si++;startStage();}
}

/* ---------- drawing helpers ---------- */
function text(s,x,y,col='#f1e8d4',size=8,align='left',weight=700){c.font=`${weight} ${size}px ${MONO}`;c.textAlign=align;c.fillStyle='rgba(0,0,0,.55)';c.fillText(s,x+.6,y+.6);c.fillStyle=col;c.fillText(s,x,y);}
function wrap(s,n){const w=s.split(' '),L=[];let l='';for(const x of w){if((l+' '+x).trim().length>n){L.push(l);l=x;}else l=(l+' '+x).trim();}if(l)L.push(l);return L;}
function btn(x,y,w,h,s,main,fn,dis){HIT.push({x,y,w,h,fn:dis?()=>{}:fn});c.fillStyle=dis?'#2c3430':main?'#e8a23a':'#1b2420';c.fillRect(x,y,w,h);c.strokeStyle=dis?'#3a443e':main?'#ffd27a':'#4a5a50';c.lineWidth=1;c.strokeRect(x+.5,y+.5,w-1,h-1);text(s,x+w/2,y+h/2+3,dis?'#6a746e':main?'#1a1208':'#e8eee8',main?10:8,'center');}
function glow(x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.globalAlpha=1;}
function bar(x,y,w,h,v,col,label,val){c.fillStyle='#10160f';c.fillRect(x,y,w,h);c.fillStyle=col;c.fillRect(x,y,w*clamp(v,0,1),h);c.strokeStyle='#3a4a3e';c.strokeRect(x+.5,y+.5,w-1,h-1);text(label,x-4,y+h-1.5,'#9fb0a4',7,'right');if(val!=null)text(val,x+w+3,y+h-1.5,'#cfdad2',7,'left');}

/* ---------- the trail scene ---------- */
function drawRunner(x,y,ph,lean,state){
  c.save();c.translate(x,y);c.rotate(lean);
  const bob=Math.abs(Math.sin(ph*Math.PI))*1.6*(P.speed>5?1:0);
  const swing=P.speed>2?Math.sin(ph*Math.PI*2):0,amp=P.speed>14?1:P.speed>6?.7:.35;
  const limb=(x0,y0,a1,l1,a2,l2,col,w)=>{const x1=x0+Math.sin(a1)*l1,y1=y0+Math.cos(a1)*l1,x2=x1+Math.sin(a2)*l2,y2=y1+Math.cos(a2)*l2;c.strokeStyle=col;c.lineWidth=w;c.lineCap='square';c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.lineTo(x2,y2);c.stroke();return [x2,y2];};

  text(ev.t,W/2,120,'#e8a23a',16,'center');wrap(ev.d,32).forEach((q,i)=>text(q,W/2,142+i*12,'#e8eee8',9,'center',500));
  [ev.a,ev.b].forEach((o,i)=>{const y=190+i*86;HIT.push({x:20,y,w:230,h:76,fn:()=>chooseEvent(i)});c.fillStyle=i?'#2a1e16':'#16241e';c.fillRect(20,y,230,76);c.strokeStyle=i?'#e8803a':'#6ac07a';c.lineWidth=1.5;c.strokeRect(20.5,y+.5,229,75);text(o.t,34,y+26,'#fff',12);wrap(o.h,32).forEach((q,j)=>text(q,34,y+44+j*11,'#b8c4bc',9,'left',500));});
  c.fillStyle='#10160f';c.fillRect(20,366,230,6);c.fillStyle='#e8a23a';c.fillRect(20,366,230*P.ev.t/P.ev.max,6);text('Decide (the first option is picked if time runs out)',W/2,388,'#6a7a70',7,'center',500);
}
function pauseLayer(){panelBg(.85);HIT.length=0;text('Paused',W/2,190,'#e8a23a',16,'center');btn(60,210,150,30,'Resume',true,()=>{paused=false;});btn(60,250,150,26,'Quit race',false,()=>{paused=false;scene='map';});}
function render(){
  HIT.length=0;c.setTransform(SC,0,0,SC,0,0);c.imageSmoothingEnabled=false;
  if(scene==='map')mapScene();
  else if(scene==='brief')briefScene();
  else if(scene==='draft'||scene==='aid')draftScene();
  else if(scene==='result')resultScene();
  else if(scene==='dnf')dnfScene();
  else if(scene==='event')eventScene();
  else if(scene==='run'){drawScene();drawHud();}
  if(paused)pauseLayer();
}

/* ---------- input ---------- */
let dragging=false;
const pt=e=>{const r=cvs.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};};
cvs.addEventListener('pointerdown',e=>{try{cvs.setPointerCapture(e.pointerId);}catch(_){}const p=pt(e);
  for(let i=HIT.length-1;i>=0;i--){const b=HIT[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}}
  if(scene==='run'&&!paused&&p.x>=FX-10&&p.y>=FY0-10){dragging=true;setEffortFromY(p.y);}});
cvs.addEventListener('pointermove',e=>{if(!dragging)return;setEffortFromY(pt(e).y);});
const up=()=>{dragging=false;};cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);cvs.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(scene==='run'){if(e.key==='ArrowUp')P.effort=clamp(P.effort+.06,0,1);if(e.key==='ArrowDown')P.effort=clamp(P.effort-.06,0,1);if(e.key==='d')drink();if(e.key==='g')gel();if(e.key==='Escape')paused=!paused;}
  if(scene==='event'){if(e.key==='1')chooseEvent(0);if(e.key==='2')chooseEvent(1);}});

/* ---------- loop and test hooks ---------- */
let last=0;function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);render();requestAnimationFrame(frame);}requestAnimationFrame(n=>{last=n;frame(n);});
window.__trail={state:()=>({scene,race,R_,P,S,save}),startRace:i=>startRace(RACES[i]),setEffort:e=>{if(P)P.effort=clamp(e,0,1);},drink,gel,choose:chooseEvent,draft:i=>draftPick(R_.draft[i]),step:dt=>update(dt),sweet:sweetEffort,par,render,races:RACES,seg:()=>segAt(S,P.x),open:i=>{race=RACES[i];scene='brief';},reset:()=>{save={medals:{}};persist();}};
})();
</script>
