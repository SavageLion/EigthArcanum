<script>

/* RIDGELINE: a trail-running management roguelike for phones (prototype).
   You run a trail runner's season. At HOME BASE you buy gear, rest, and visit the physio tent. On the MAP you pick training trails (they build four stats)
   and races (they pay coins and medals). In a run you control only your EFFORT with one thumb: effort sets speed, but also heart rate and legs. Hills and
   heat push your heart rate up, redlining burns your legs, an empty tank means a bonk. Hard running leaves INJURIES that follow you into the next run
   until you treat them in the physio mini-game (at base, or in the medical tent at a race aid station, at the cost of race time). Fatigue builds as you
   run and only rest clears it. Everything here is one self-contained file. */
(()=>{
'use strict';
const W=270,H=480,SC=2,TAU=Math.PI*2;
const cvs=document.getElementById('g'),c=cvs.getContext('2d');cvs.width=W*SC;cvs.height=H*SC;
let ROT=false;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cvs.style.width=(W*s)+'px';cvs.style.height=(H*s)+'px';}
addEventListener('resize',fit);document.addEventListener('fullscreenchange',fit);fit();
const MONO='ui-monospace,Menlo,Consolas,"Courier New",monospace';
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let audioCtx=null;
function beep(f,d=.08,type='square',v=.04,sl=0){try{if(MUTED)return;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;if(sl)o.frequency.linearRampToValueAtTime(f+sl,audioCtx.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}

/* ---------- save ---------- */
const KEY='ridgeline-v2';
const DEF=()=>({medals:{},coins:80,day:1,fatigue:0,stats:{end:{l:0,x:0},clm:{l:0,x:0},heat:{l:0,x:0},rec:{l:0,x:0}},inj:[],owned:['hat'],cap:2,load:['hat'],loose:false,bear:{w:0,l:0},season:null,run:null,runs:{n:0,wins:0,best:0}});
let save=DEF();
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.medals){save=Object.assign(DEF(),j);save.stats=Object.assign(DEF().stats,j.stats||{});}
  else{const o=JSON.parse(localStorage.getItem('ridgeline-v1')||'null');if(o&&o.medals)save.medals=o.medals;}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}};
const MEDAL_COL={bronze:'#c98a4a',silver:'#cfd6e0',gold:'#ffd24a'};

/* ---------- races and training trails ---------- */
const RACES=[
  {id:'pine',name:'Pine Ridge 5K',km:5,stages:2,theme:'dawn',tier:0,seed:11,climate:['clear','clear','fog','rain'],world:{peak:75,noise:42,edge:true,shadows:true,decor:1200,tufts:5000,tuftsNear:90,trailW:0,lake:true,lakeR:7,river:true,biome:{rock:75,loose:58,mud:.64,brush:.6}},bear:[],blurb:'Cool morning, gentle hills and a quiet lake. A friendly first race to learn pacing.'},
  {id:'lake',name:'Lakeside 10K',km:10,stages:3,theme:'noon',tier:0,seed:23,climate:['clear','wind','clear','rain'],world:{peak:34,noise:22,lake:true,lakeR:15,river:false,biome:{rock:80,loose:62,mud:.55,brush:.62}},bear:[],blurb:'A huge flat lake, fast meadows and open ground. The wind decides your day.'},
  {id:'canyon',name:'Canyon Loop 15K',km:15,stages:3,theme:'noon',tier:1,seed:37,climate:['hot','hot','clear','wind'],world:{peak:80,noise:60,lake:false,river:true,trees:.25,biome:{rock:34,loose:26,mud:.72,brush:.7}},bear:[1],blurb:'Red rock and scree, almost no shade. Heat bites and there may be a bear in the rocks.'},
  {id:'fog',name:'Fogbank 21K',km:21,stages:4,theme:'dawn',tier:1,seed:41,climate:['fog','fog','rain','cold'],world:{peak:50,noise:46,lake:true,lakeR:9,river:true,trees:1.5,biome:{rock:72,loose:58,mud:.44,brush:.44}},bear:[2],blurb:'Mud, thick forest and mist. Hard to see the way, so trust your map.'},
  {id:'sky',name:'Skyline 30K',km:30,stages:4,theme:'dusk',tier:2,seed:53,climate:['wind','clear','cold','storm'],world:{peak:135,noise:55,lake:true,lakeR:8,river:false,biome:{rock:52,loose:40,mud:.66,brush:.6}},bear:[0,3],blurb:'A huge climb to the ridge at sunset. Ration everything.'},
  {id:'glacier',name:'Glacier Gap 42K',km:42,stages:5,theme:'frost',tier:3,seed:67,climate:['cold','cold','wind','storm','fog'],world:{peak:120,noise:50,lake:true,lakeR:9,river:true,trees:.4,biome:{rock:46,loose:34,mud:.76,brush:.7}},bear:[2],blurb:'Icy passes and thin air. A real marathon in the cold.'},
  {id:'summit',name:'Summit Ultra 50K',km:50,stages:6,theme:'night',tier:3,seed:79,climate:['clear','fog','storm','cold','wind'],world:{peak:150,noise:62,lake:true,lakeR:8,river:true,biome:{rock:44,loose:32,mud:.6,brush:.55}},bear:[1,4],blurb:'Six stages through the night. Bring a medic.'},
];
// entries have to be earned: medals and stat levels open the harder races
const MORD={bronze:1,silver:2,gold:3};
const medalOf=id=>MORD[save.medals[id]]||0;
const statTotal=()=>Object.values(save.stats).reduce((a,s)=>a+s.l,0);
const ENTRY={
  lake:{t:'Finish Pine Ridge 5K with any medal.',s:'Any medal at Pine Ridge',ok:()=>medalOf('pine')>=1},
  canyon:{t:'Earn silver or better at Pine Ridge 5K.',s:'Silver at Pine Ridge',ok:()=>medalOf('pine')>=2},
  fog:{t:'Earn silver or better at Lakeside 10K.',s:'Silver at Lakeside',ok:()=>medalOf('lake')>=2},
  sky:{t:'Earn silver or better at Canyon Loop 15K.',s:'Silver at Canyon Loop',ok:()=>medalOf('canyon')>=2},
  glacier:{t:'Silver or better at Fogbank 21K, and 6 total stat levels.',s:'Silver at Fogbank + 6 stat levels',ok:()=>medalOf('fog')>=2&&statTotal()>=6},
  summit:{t:'Silver or better at Skyline 30K and at Glacier Gap 42K.',s:'Silver at Skyline + Glacier Gap',ok:()=>medalOf('sky')>=2&&medalOf('glacier')>=2},
};
const entry=r=>({ok:true});
// weather: forecast per race and day (re-rolls every day you spend), the same weather for the whole race
const WX={
  clear:{n:'Clear',d:'Perfect running weather.',vis:1},
  hot:{n:'Heat wave',d:'Much hotter: your heart rate climbs and you drink 35% faster.',heat:.32,water:1.35,vis:1},
  rain:{n:'Rain',d:'Mud, rock and scree turn slick and legs tire a little faster. Visibility drops.',heat:-.05,ter:{mud:.82,rocky:.88,loose:.9,smooth:.95,grass:.95,brush:.95},drain:1.06,vis:.75,tintMul:.88},
  fog:{n:'Fog',d:'You can only see a short way ahead. Trust the compass and the map.',heat:-.03,vis:.4},
  wind:{n:'Windy',d:'Tailwind helps you, headwind slows you. Pick your line.',wind:.08,vis:1},
  cold:{n:'Cold snap',d:'Cool air keeps your heart rate down, but you use less water and your legs stiffen.',heat:-.2,hr:-.03,drain:1.03,water:.8,vis:1},
  storm:{n:'Storm',d:'Rain, gusts and poor visibility. The ground is treacherous.',heat:-.05,ter:{mud:.78,rocky:.85,loose:.88,smooth:.93,grass:.93,brush:.93},drain:1.1,wind:.1,vis:.5,tintMul:.8},
};
const WXSKY={rain:[[110,118,128],.55],storm:[[70,76,92],.7],fog:[[190,196,200],.7],cold:[[200,220,240],.25],hot:[[255,226,170],.2]};
const WXC=()=>WX[(R_&&R_.wx)||'clear']||WX.clear;
const hash2=(a,b)=>{let h=(Math.imul(a|0,2654435761)^Math.imul(b|0,40503))>>>0;h=Math.imul(h^(h>>>15),2246822519)>>>0;return (h^(h>>>13))>>>0;};
function forecast(r,day){if(r.train)return r.wx||'clear';let a=hash2(day==null?save.day:day,r.seed)+0x6D2B79F5|0;a=Math.imul(a^a>>>15,1|a);const v=((a^a>>>14)>>>0)/4294967296;return r.climate[Math.floor(v*r.climate.length)];}
const TRAIN=[
  {id:'t_hill',seed:101,name:'Hill Repeats',short:'Hills',stat:'clm',km:3,stages:1,theme:'dawn',tier:0,train:{amp:1.7,bias:.62,fat:16,world:{peak:140,noise:55}},blurb:'Steep climbs and steep descents. Builds CLIMBING.'},
  {id:'t_long',seed:102,name:'Long Run',short:'Long run',stat:'end',km:3,stages:1,theme:'dawn',tier:0,train:{len:1.5,fat:24},blurb:'A long steady grind. Builds ENDURANCE.'},
  {id:'t_heat',seed:103,wx:'hot',name:'Heat Lab',short:'Heat',stat:'heat',km:3,stages:1,theme:'noon',tier:0,train:{heat:.95,fat:18},blurb:'Run through the hottest hour. Builds HEAT TOLERANCE.'},
  {id:'t_rec',seed:104,name:'Recovery Jog',short:'Recovery',stat:'rec',km:3,stages:1,theme:'dawn',tier:0,train:{amp:.4,fat:-8,world:{peak:25,noise:14}},blurb:'Stay easy, heart rate low. Builds RECOVERY and shakes out fatigue.'},
];
const STATN={end:'Endurance',clm:'Climbing',heat:'Heat tolerance',rec:'Recovery'};
const STATT={end:'Legs drain 5% slower per level',clm:'Hills slow you 7% less per level',heat:'Heat hurts 8% less per level',rec:'Legs recover 12% faster, wider physio zones'};
const THEMES={dawn:{sky:['#f2a78c','#6a5a9a'],sun:[200,70,'#ffe0b0'],heat:.1,mt:['#4a4470','#3a3560'],tree:'#1f3a34',gnd:'#3a5a3c'},
              noon:{sky:['#69bff2','#dff2ff'],sun:[70,40,'#fff6c0'],heat:.65,mt:['#7a88a8','#667392'],tree:'#2a5a3a',gnd:'#8a7048'},
              dusk:{sky:['#e06a58','#2a1a4a'],sun:[220,110,'#ff9a5a'],heat:.3,mt:['#5a3a6a','#3a2858'],tree:'#1a2a30',gnd:'#4a4030'},
              night:{sky:['#2a3a6a','#070a1c'],sun:[210,60,'#dfe8ff'],heat:0,mt:['#1e2650','#161c40'],tree:'#0c1a1c',gnd:'#1a2a24'},
              frost:{sky:['#c8dcf0','#8aa8d0'],sun:[200,60,'#ffffff'],heat:0,mt:['#aab8d0','#8a9ab8'],tree:'#4a6a6a',gnd:'#c8d8e8'}};
const TERRAIN={smooth:{n:'Smooth trail',f:1,col:'#6a5a3a'},rocky:{n:'Rocky',f:.84,col:'#6a6a70'},loose:{n:'Loose scree',f:.74,col:'#8a7a5a'},mud:{n:'Mud',f:.8,col:'#4a3a2c'},creek:{n:'Creek bed',f:.7,col:'#3a6a8a'},grass:{n:'Meadow',f:.93,col:'#6a9a4a'},brush:{n:'Thick brush',f:.66,col:'#2e5a30'}};
const ZONES=[{n:'Easy',max:.3,col:'#6a8ab0'},{n:'Steady',max:.55,col:'#6ac07a'},{n:'Tempo',max:.75,col:'#e8d24a'},{n:'Hard',max:.9,col:'#f0903a'},{n:'Redline',max:1.01,col:'#e84a3a'}];

/* ---------- gear (bought at base, carried in your loadout) ---------- */
const GEAR={
  poles:{n:'Trekking poles',p:80,t:'Climbs cost 15% less speed and 10% less legs.'},
  shoes:{n:'Trail shoes',p:60,t:'Rocky, loose and muddy ground slows you half as much. Fewer falls.'},
  flask:{n:'Soft flasks',p:30,t:'+2 drinks in your pack.'},gels:{n:'Gel pack',p:30,t:'+2 gels in your pack.'},
  hat:{n:'Sun hat',p:30,t:'Heat hurts 60% less.'},sleeves:{n:'Compression sleeves',p:60,t:'Legs recover 40% faster.'},
  tape:{n:'Blister tape',p:25,t:'You cannot get blisters this race.'},watch:{n:'Pacing watch',p:70,t:'Shows the sweet-spot effort on your fader.'},
  buff:{n:'Cooling buff',p:45,t:'Heart rate runs cooler in the heat.'},
  roller:{n:'Massage gun',p:55,t:'Physio zones 35% wider. Tent treatments cost 20 s less.'},
};
const SHOPIDS=['hat','flask','gels','tape','shoes','sleeves','poles','buff','watch','roller'];
const CAPCOST=[60,110,180];

/* ---------- injuries ---------- */
const INJ={
  blister:{n:'Blister',loc:'foot',t:'Every step is slower'},
  shin:{n:'Shin splints',loc:'shin',t:'Legs drain faster on flat and downhill'},
  calf:{n:'Tight calf',loc:'calf',t:'Climbs hurt more, cramps come sooner'},
  knee:{n:'Sore knee',loc:'knee',t:'Descents drain your legs'},
  ach:{n:'Achilles pain',loc:'ankle',t:'Hard efforts drain your legs'},
};
const SEVCOL=['#e8d24a','#f0903a','#e84a3a'];
const sev=k=>{const q=save.inj.find(i=>i.k===k);return q?q.s:0;};
const lv=k=>save.stats[k].l;
const need=l=>70+45*l;
function addInj(k){const q=save.inj.find(i=>i.k===k);if(q){q.s=Math.min(3,q.s+1);return INJ[k].n+' worse';}save.inj.push({k,s:1});return INJ[k].n;}
function addXp(k,n,lines){const s=save.stats[k];if(s.l>=5)return;s.x+=n;lines.push({s:`${STATN[k]} +${Math.round(n)} xp`,c:'#9fd8a0'});while(s.l<5&&s.x>=need(s.l)){s.x-=need(s.l);s.l++;lines.push({s:`${STATN[k]} is now level ${s.l}!`,c:'#ffd24a'});}if(s.l>=5)s.x=0;}
function advanceDay(rest,lines){save.day++;save.fatigue=Math.max(0,save.fatigue-(rest?45:12));
  const ch=(rest?.5:.12)*(save.fatigue<50?1:.5);save.inj.forEach(i=>{if(Math.random()<ch){i.s--;lines.push({s:INJ[i.k].n+(i.s>0?' eases':' has healed'),c:'#9fd8a0'});}});save.inj=save.inj.filter(i=>i.s>0);}

/* ---------- state ---------- */
let RUN=null,scene='home',race=null,R_=null,S=null,P=null,PH=null,t=0,sceneT=0,paused=false,shake=0,flash=0,msg='',msgT=0,note='',noteT=0;
const HIT=[],popups=[],parts=[];
const pop=(s,x,y,col='#fff')=>popups.push({s,x,y,t:1.2,col});
const banner=(s,n=1.6)=>{msg=s;msgT=n;};
const toast=s=>{note=s;noteT=2;};

/* ---------- stage generation ---------- */
function genStage(r,si){
  const tr=r.train||{},L=(1000+120*r.tier+60*si)*(tr.len||1),segs=[];let x=0,e=0;const tier=r.tier,amp=(.05+.035*Math.min(tier,2)+.01*si)*(tr.amp||1);
  const th=THEMES[r.theme];
  const tw=tier===0?{smooth:5,rocky:2,loose:1,mud:1,creek:1}:tier===1?{smooth:3,rocky:4,loose:3,mud:1,creek:2}:{smooth:2,rocky:4,loose:4,mud:2,creek:2};
  const pickTer=()=>{const k=Object.keys(tw);let q=Math.random()*k.reduce((a,b)=>a+tw[b],0);for(const n of k){q-=tw[n];if(q<=0)return n;}return 'smooth';};
  const b1=tr.bias||.4;
  while(x<L){const len=Math.min(L-x,rint(80,190)),roll=Math.random();let g=roll<b1?rnd(.03,amp*2.1):roll<b1+.32?rnd(-amp*1.7,-.02):rnd(-.01,.02);if(si===0&&x<150)g=rnd(0,.02);
    const ter=pickTer();segs.push({x0:x,len,g,t:ter,e0:e});e+=len*g;x+=len;}
  const evs=[],pool=['creek','climb','scree','fork','oranges','heat','blister'];
  const n=tr.fat!=null?2:3+(tier>0?1:0),slots=[];for(let i=0;i<n;i++)slots.push(L*(.16+.7*(i+rnd(.2,.8))/n));
  let ps=shuffle(pool);slots.forEach((px,i)=>evs.push({x:px,k:ps[i%ps.length],done:false}));
  if(!r.train&&r.tier>=1&&Math.random()<.35)evs.push({x:L*rnd(.35,.8),k:'bear',done:false});
  const heat=tr.heat!=null?tr.heat:th.heat+rnd(-.1,.15);
  return {L,segs,evs,heat,cut:L/(tr.fat!=null?7.5:[9.2,8.4,7.0,7.7][tier]),trees:Array.from({length:60},()=>({x:rnd(0,L+80),h:rnd(14,30)})),elevEnd:e};
}
const segAt=(st,x)=>{const s=st.segs;for(let i=0;i<s.length;i++)if(x<s[i].x0+s[i].len)return s[i];return s[s.length-1];};
const elevAt=(st,x)=>{const s=segAt(st,x);return s.e0+(Math.min(x,s.x0+s.len)-s.x0)*s.g;};

/* ---------- running ---------- */
function beginRace(r){
  RUN=null;race=r;R_={si:0,times:[],bonks:0,gear:save.load.filter(g=>save.owned.includes(g)),sips:3,gels:2,blister:false,fell:false,total:0,newInj:[],stageInj:[],tentUsed:false,report:[],climbXp:0,heatXp:0,easyXp:0,res:null,settled:false,parS:0,parG:0,wx:r.train?(r.wx||'clear'):forecast(r)};
  R_.sips=3+(has('flask')?2:0);R_.gels=2+(has('gels')?2:0);
  R_.calendar=!r.train&&r===curRace();if(!r.train)R_.field=SEA().field.map(q=>({id:q.id,m:q.m,rv:RIVALS[q.id],T:[],aid:[],start:[]}));
  R_.legs=clamp(100-save.fatigue*.25+(save.loose?10:0),40,100);R_.water=100;R_.fuel=100;if(save.loose){R_.report.push({s:'Loosened up by physio: +10 legs',c:'#9fd8a0'});}save.loose=false;
  if(r.nav)startNav();else startStage();
}
function startStage(){startNav();}
const has=g=>R_&&R_.gear.includes(g);
const PS=[19,17,15.5,15],PG=[23,20,18,17.4],avgL=()=>1000+120*race.tier+60*(race.stages-1)/2;
const par=()=>({silver:R_.parS,gold:R_.parG});
const simTS=()=>RUN?1:(race.km/race.stages)*5.54;
const fmtT=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');};

function sweetEffort(g,heat){return clamp((.74-.28-1.1*Math.max(0,g)-heat*.06)/.62,.1,.9);}
function update(dt){
  t+=dt;sceneT+=dt;shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt*2);if(msgT>0)msgT-=dt;if(noteT>0)noteT-=dt;
  for(const p of popups)p.t-=dt;for(let i=popups.length-1;i>=0;i--)if(popups[i].t<=0)popups.splice(i,1);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.t-=dt;}for(let i=parts.length-1;i>=0;i--)if(parts[i].t<=0)parts.splice(i,1);
  if(paused)return;
  if(scene==='physio'){if(PH&&PH.mode==='play'){PH.t+=dt;if(PH.fbT>0)PH.fbT-=dt;}return;}
  if(scene==='bear'){bearStep(dt);return;}
  if(scene==='event'){P.ev.t-=dt;if(P.ev.t<=0)chooseEvent(0);return;}
  if(scene!=='run'&&scene!=='nav')return;
  if(scene==='nav'&&NAV.brief)return;
  if(scene==='nav'&&NAV.tb)tuftStep(dt);
  const seg=scene==='nav'?navSeg(dt):segAt(S,P.x),g=seg.g,ter=TERRAIN[seg.t];P.t+=dt;
  const heat=S.heat*(has('hat')?.4:1)*(P.cool>0?.3:1)*(1-.08*lv('heat'));
  let e=P.effort;
  if(P.bonk>0){P.bonk-=dt;e=Math.min(e,.15);if(P.bonk<=0){P.legs=Math.max(P.legs,14);banner('You find your legs again',1.6);}}
  if(P.hike>0){P.hike-=dt;e=Math.min(e,.2);}
  if(P.cramp>0){P.cramp-=dt;e=Math.min(e,.35);}
  // speed
  let v=9+26*Math.pow(e,.9);
  if(g>0)v*=clamp(1-3.0*(1-.07*lv('clm'))*g*(has('poles')?.85:1)*(has('goat')?.7:1)*(1+.1*sev('calf')),.4,1);else v*=1+Math.min(.35,-g*2.2);
  const terPen=1-ter.f;v*=1-terPen*((has('shoes')&&seg.t!=='smooth')?.5:1);v*=wxTer(seg.t);if(scene==='nav'&&WXC().wind)v*=1+WXC().wind*Math.cos(NAV.hd-NAV.windAng)*(1+.3*Math.sin(t*.4));
  if(P.legs<25)v*=.6+.4*P.legs/25;
  if(R_.blister)v*=.92;v*=1-.045*sev('blister');if(P.ankle>0){P.ankle-=dt;v*=.85;}
  if(P.slow){P.slow.t-=dt;v*=P.slow.v;if(P.slow.t<=0)P.slow=null;}
  if(P.hike>0)v=Math.min(v,11*(has('poles')?1.2:1));
  if(P.bonk>0)v=Math.min(v,7);
  if(P.drinkT>0){P.drinkT-=dt;v*=.55;}if(P.boost>0){P.boost-=dt;v*=1.1;}if(has('kick')&&NAV&&NAV.len&&NAV.dist>NAV.len*.75)v*=1.12;
  if(P.stop>0){P.stop-=dt;v=0;}
  P.speed+=(v-P.speed)*(1-Math.exp(-dt*3));if(scene==='nav'){navMove(P.speed*dt);if(scene!=='nav')return;}else P.x+=P.speed*dt;P.phase+=P.speed*dt*.085;
  // heart rate

const SEA=()=>save.season,freeDays=()=>Math.max(0,SEA().raceDay-save.day),curRace=()=>RACES[Math.min(SEA().idx,RACES.length-1)];

function newSeason(n){
  const rg=mulberry(n*7919+13),pool=RIVALS.map(r=>r.id);for(let i=pool.length-1;i>0;i--){const j=Math.floor(rg()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const sk=[.7,.58,.46,.34,.22,.1,0];for(let i=sk.length-1;i>0;i--){const j=Math.floor(rg()*(i+1));[sk[i],sk[j]]=[sk[j],sk[i]];}
  const lvl=1+.025*(n-1)-(n===1?.015:0);
  save.season={n,idx:0,raceDay:save.day+3,field:pool.slice(0,7).map((id,k)=>({id,m:(.9+.34*Math.max(0,sk[k]+(rg()-.5)*.1))*lvl})),results:[],pts:{},paid:false};
  persist();
}

// one rival's time for one stage: the par pace, their rating and style, the weather and some luck. Fully independent of how you run.
function rivalStage(si,len,asc){
  if(RUN){for(const f of R_.field){const rg=mulberry((f.id*977+RUN.seed+si*31)|0);f.T[si]=len/(runVpar(asc/len)*f.m)*(1+(rg()-.5)*.04);f.aid[si]=0;f.start[si]=R_.total;}return;}

function perkDraft(rare){

// ----- the map: nine stops from the trailhead to the summit
function genRunMap(seed){
  const rg=mulberry(seed),widths=[3,3,3,3,3,3,3,2,1],map=[],legs=['flat','climb','tech'],wxs=['clear','clear','clear','hot','rain','fog','wind','cold'];
  const kinds=(L)=>{const r=rg();return r<.5?legs[Math.floor(rg()*3)]:r<.64?'event':r<.74?'aid':r<.82?'shop':r<.9?'tent':'tech';};
  const l0=shuffle(legs);
  for(let L=0;L<NLAY;L++){const row=[];for(let i=0;i<widths[L];i++){
    let k=L===NLAY-1?'boss':L===NLAY-2?(i?'tent':'aid'):L===0?l0[i]:kinds(L);
    if(L===1&&!LEGK[k])k=legs[Math.floor(rg()*3)];
    row.push({L,i,k,wx:'clear',seed:((seed*31+L*17+i*7)|0)||1,e:[],done:false,jx:(rg()-.5)*16,jy:(rg()-.5)*8,rv:Math.floor(rg()*RIVALS.length)});}
    map.push(row);}
  [[2,'event'],[3,'bear'],[4,'aid'],[5,'duel'],[6,'shop']].forEach(([L,k])=>{map[L][Math.floor(rg()*3)].k=k;});
  for(const row of map)for(const n of row){if(LEGK[n.k]){n.wx=n.k==='boss'?['fog','storm','wind'][Math.floor(rg()*3)]:(n.L>=4&&rg()<.12?'storm':wxs[Math.floor(rg()*wxs.length)]);}}
  for(let L=0;L<NLAY-1;L++){const a=map[L],b=map[L+1];
    a.forEach((n,i)=>{const p=(i+.5)/a.length,cd=[];b.forEach((m,j)=>{const q=(j+.5)/b.length;if(Math.abs(p-q)<.4)cd.push([Math.abs(p-q),j]);});cd.sort((x,y)=>x[0]-y[0]);n.e=[cd[0][1]];for(let z=1;z<cd.length;z++)if(rg()<.55)n.e.push(cd[z][1]);});
    b.forEach((m,j)=>{if(!a.some(n=>n.e.includes(j))){let bi=0,bd=9;a.forEach((n,i)=>{const d=Math.abs((i+.5)/a.length-(j+.5)/b.length);if(d<bd){bd=d;bi=i;}});a[bi].e.push(j);}});}
  return map;
}

function runVpar(cr){const K=LEGK[nodeAt(RUN.cur).k],ln=RUN.legNo,wf={rain:.96,storm:.9,hot:.98}[R_.wx]||1;return Math.max(9,25-130*Math.min(.17,cr))*(.86+.045*ln)*K.par*wf;}

function nodeGlyph(k,x,y,col){
  c.save();c.translate(x,y);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=1.8;c.lineCap='round';c.lineJoin='round';
  if(k==='flat'){c.beginPath();c.moveTo(-6,2);c.quadraticCurveTo(-3,-4,0,0);c.quadraticCurveTo(3,4,6,-2);c.stroke();}
  else if(k==='climb'){c.beginPath();c.moveTo(-7,5);c.lineTo(-1,-6);c.lineTo(3,0);c.lineTo(5,-3);c.lineTo(8,5);c.closePath();c.fill();}
  else if(k==='tech'){c.beginPath();c.moveTo(-6,5);c.lineTo(-5,-1);c.lineTo(-1,-5);c.lineTo(3,-3);c.lineTo(6,2);c.lineTo(5,5);c.closePath();c.fill();}
  else if(k==='bear'){c.beginPath();c.arc(0,2,4.2,0,TAU);c.fill();for(const dx of [-5,-1.7,1.7,5]){c.beginPath();c.arc(dx,-3.6+Math.abs(dx)*.4,1.7,0,TAU);c.fill();}}
  else if(k==='duel'){text('VS',0,3,col,8.5,'center');}
  else if(k==='boss'){c.beginPath();c.moveTo(-7,6);c.lineTo(0,-5);c.lineTo(7,6);c.closePath();c.fill();c.fillRect(-.5,-9,1.2,6);c.fillStyle='#fff';c.fillRect(.7,-9,5,3.4);}
  else if(k==='aid'){c.beginPath();c.moveTo(0,-6);c.quadraticCurveTo(7,2,0,6);c.quadraticCurveTo(-7,2,0,-6);c.fill();}
  else if(k==='tent'){c.beginPath();c.moveTo(-7,6);c.lineTo(0,-6);c.lineTo(7,6);c.closePath();c.fill();c.fillStyle='#1a1020';c.fillRect(-1.6,0,3.2,6);}
  else if(k==='event'){text('?',0,4,col,12,'center');}

  c.restore();
}

  if(scene==='map')mapDrag={id:e.pointerId,y:p.y,off:mapOff,moved:false};
  for(let i=HIT.length-1;i>=0;i--){const b=HIT[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){if(b.tap){tapPend={b,id:e.pointerId};}else b.fn();return;}}
  if((scene==='run'||scene==='nav')&&!paused&&p.x>=FX-8&&p.y>=FY0-4&&p.y<=FY1+6){drags.set(e.pointerId,'f');setEffortFromY(p.y);}
  else if(scene==='nav'&&!paused&&!NAV.map&&p.x<=STP.x+STP.w+8&&p.y>=STP.y-10){drags.set(e.pointerId,'s');NAV.steer=steerFromX(p.x);}});
cvs.addEventListener('pointermove',e=>{if(mapDrag&&e.pointerId===mapDrag.id){const dy=pt(e).y-mapDrag.y;if(Math.abs(dy)>6)mapDrag.moved=true;if(mapDrag.moved)mapOff=clamp(mapDrag.off-dy,0,MAPH-H);return;}const k=drags.get(e.pointerId);if(!k)return;const p=pt(e);if(k==='f')setEffortFromY(p.y);else if(NAV)NAV.steer=steerFromX(p.x);});
const up=e=>{if(tapPend&&tapPend.id===e.pointerId&&!(mapDrag&&mapDrag.moved))tapPend.b.fn();tapPend=null;mapDrag=null;const k=drags.get(e.pointerId);if(k==='s'&&NAV)NAV.steer=0;drags.delete(e.pointerId);if(fsReq){fsReq=false;toggleFS();}};cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);cvs.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{wakeAudio();if(e.key==='m'&&scene!=='nav'){MUTED=!MUTED;try{localStorage.setItem('ridgeline-mute',MUTED?'1':'0');}catch(_){}}if(scene==='run'||scene==='nav'){if(e.key==='ArrowUp')P.effort=clamp(P.effort+.06,0,1);if(e.key==='ArrowDown')P.effort=clamp(P.effort-.06,0,1);if(e.key==='d'&&scene==='run')drink();if(e.key==='g')gel();if(e.key==='Escape')paused=!paused;}
  if(scene==='nav'){if(e.key==='ArrowLeft'||e.key==='a')KEYS.l=1;if(e.key==='ArrowRight'||e.key==='d')KEYS.r=1;if((e.key==='m'||e.key==='Tab')&&!NAV.brief){NAV.map=!NAV.map;e.preventDefault();}if((e.key==='Enter'||e.key===' ')&&NAV.brief)beginNav();if(e.key==='q')drink();}
  if(scene==='event'){if(e.key==='1')chooseEvent(0);if(e.key==='2')chooseEvent(1);}
  if(scene==='physio'&&(e.key===' '))press();
  if(scene==='bear'){if(e.key==='ArrowLeft'||e.key==='a')bearDodge(-1);if(e.key==='ArrowRight'||e.key==='d')bearDodge(1);if(e.key===' '||e.key==='j'||e.key==='ArrowUp')bearPunch();}
  if(e.key==='f')toggleFS();});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')KEYS.l=0;if(e.key==='ArrowRight'||e.key==='d')KEYS.r=0;});
