<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1210">
<link rel="icon" href="data:,">
<title>Ridgeline: a trail running roguelike</title>
<style>
html,body{margin:0;height:100%;background:#0d1210;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#g{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;image-rendering:pixelated;background:#0d1210;touch-action:none}
</style>
</head>
<body>
<canvas id="g" aria-label="Ridgeline"></canvas>
<script>
/* RIDGELINE: a trail-running management roguelike for phones (prototype).
   You run a trail runner's season. At HOME BASE you buy gear, rest, and visit the physio tent. On the MAP you pick training trails (they build four stats)
   and races (they pay coins and medals). In a run you control only your EFFORT with one thumb: effort sets speed, but also heart rate and legs. Hills and
   heat push your heart rate up, redlining burns your legs, an empty tank means a bonk. Hard running leaves INJURIES that follow you into the next run
   until you treat them in the physio mini-game (at base, or in the medical tent at a race aid station, at the cost of race time). Fatigue builds as you
   run and only rest clears it. Everything here is one self-contained file. */
(()=>{
'use strict';
let W=480,H=270;const SC=2,TAU=Math.PI*2;
const cvs=document.getElementById('g'),c=cvs.getContext('2d');cvs.width=W*SC;cvs.height=H*SC;
// forced landscape: when the phone is upright the whole canvas is rotated 90 degrees
let ROT=false,PORT=false;
function fit(){ROT=innerHeight>innerWidth&&!PORT;const s=ROT?Math.min(innerHeight/W,innerWidth/H):Math.min(innerWidth/W,innerHeight/H);cvs.style.width=(W*s)+'px';cvs.style.height=(H*s)+'px';cvs.style.transform=ROT?'translate(-50%,-50%) rotate(90deg)':'translate(-50%,-50%)';}
addEventListener('resize',fit);addEventListener('orientationchange',fit);document.addEventListener('fullscreenchange',fit);fit();
const MONO='ui-monospace,Menlo,Consolas,"Courier New",monospace';
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let audioCtx=null;
function beep(f,d=.08,type='square',v=.04,sl=0){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;if(sl)o.frequency.linearRampToValueAtTime(f+sl,audioCtx.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}

/* ---------- save ---------- */
const KEY='ridgeline-v2';
const DEF=()=>({medals:{},coins:80,day:1,fatigue:0,stats:{end:{l:0,x:0},clm:{l:0,x:0},heat:{l:0,x:0},rec:{l:0,x:0}},inj:[],owned:['hat'],cap:2,load:['hat'],loose:false,bear:{w:0,l:0}});
let save=DEF();
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.medals){save=Object.assign(DEF(),j);save.stats=Object.assign(DEF().stats,j.stats||{});}
  else{const o=JSON.parse(localStorage.getItem('ridgeline-v1')||'null');if(o&&o.medals)save.medals=o.medals;}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}};
const MEDAL_COL={bronze:'#c98a4a',silver:'#cfd6e0',gold:'#ffd24a'};

/* ---------- races and training trails ---------- */
const RACES=[
  {id:'pine',name:'Pine Ridge 5K',km:5,stages:2,theme:'dawn',tier:0,blurb:'Cool morning, gentle hills. Learn to pace.'},
  {id:'canyon',name:'Canyon Loop 15K',km:15,stages:3,theme:'noon',tier:1,blurb:'Hot rock and steep sections. Heat bites.'},
  {id:'sky',name:'Skyline 30K',km:30,stages:4,theme:'dusk',tier:2,blurb:'A long climb to the ridge. Ration everything.'},
  {id:'summit',name:'Summit Ultra 50K',km:50,stages:5,theme:'night',tier:3,blurb:'Five stages through the night. Bring a medic.'},
];
const TRAIN=[
  {id:'t_hill',name:'Hill Repeats',short:'Hills',stat:'clm',km:3,stages:1,theme:'dawn',tier:0,train:{amp:1.7,bias:.62,fat:16},blurb:'Steep climbs and steep descents. Builds CLIMBING.'},
  {id:'t_long',name:'Long Run',short:'Long run',stat:'end',km:3,stages:1,theme:'dawn',tier:0,train:{len:1.5,fat:24},blurb:'A long steady grind. Builds ENDURANCE.'},
  {id:'t_heat',name:'Heat Lab',short:'Heat',stat:'heat',km:3,stages:1,theme:'noon',tier:0,train:{heat:.95,fat:18},blurb:'Run through the hottest hour. Builds HEAT TOLERANCE.'},
  {id:'t_rec',name:'Recovery Jog',short:'Recovery',stat:'rec',km:3,stages:1,theme:'dawn',tier:0,train:{amp:.4,fat:-8},blurb:'Stay easy, heart rate low. Builds RECOVERY and shakes out fatigue.'},
];
const STATN={end:'Endurance',clm:'Climbing',heat:'Heat tolerance',rec:'Recovery'};
const STATT={end:'Legs drain 5% slower per level',clm:'Hills slow you 7% less per level',heat:'Heat hurts 8% less per level',rec:'Legs recover 12% faster, wider physio zones'};
const THEMES={dawn:{sky:['#f2a78c','#6a5a9a'],sun:[200,70,'#ffe0b0'],heat:.1,mt:['#4a4470','#3a3560'],tree:'#1f3a34',gnd:'#3a5a3c'},
              noon:{sky:['#69bff2','#dff2ff'],sun:[70,40,'#fff6c0'],heat:.65,mt:['#7a88a8','#667392'],tree:'#2a5a3a',gnd:'#8a7048'},
              dusk:{sky:['#e06a58','#2a1a4a'],sun:[220,110,'#ff9a5a'],heat:.3,mt:['#5a3a6a','#3a2858'],tree:'#1a2a30',gnd:'#4a4030'},
              night:{sky:['#2a3a6a','#070a1c'],sun:[210,60,'#dfe8ff'],heat:0,mt:['#1e2650','#161c40'],tree:'#0c1a1c',gnd:'#1a2a24'}};
const TERRAIN={smooth:{n:'Smooth trail',f:1,col:'#6a5a3a'},rocky:{n:'Rocky',f:.84,col:'#6a6a70'},loose:{n:'Loose scree',f:.74,col:'#8a7a5a'},mud:{n:'Mud',f:.8,col:'#4a3a2c'},creek:{n:'Creek bed',f:.7,col:'#3a6a8a'},grass:{n:'Meadow',f:.93,col:'#6a9a4a'},brush:{n:'Thick brush',f:.66,col:'#2e5a30'}};
const ZONES=[{n:'Easy',max:.3,col:'#6a8ab0'},{n:'Steady',max:.55,col:'#6ac07a'},{n:'Tempo',max:.75,col:'#e8d24a'},{n:'Hard',max:.9,col:'#f0903a'},{n:'Redline',max:1.01,col:'#e84a3a'}];

/* ---------- gear (bought at base, carried in your loadout) ---------- */
const GEAR={
  poles:{n:'Trekking poles',p:80,t:'Climbs cost 15% less speed and 10% less legs.'},
  shoes:{n:'Trail shoes',p:60,t:'Rocky, loose and muddy ground slows you half as much. Fewer falls.'},
  flask:{n:'Soft flasks',p:30,t:'+2 drinks in your pack.'},gels:{n:'Gel pack',p:30,t:'+2 gels in your pack.'},
  hat:{n:'Sun hat',p:30,t:'Heat hurts 60% less.'},sleeves:{n:'Compression sleeves',p:60,t:'Legs recover 40% faster.'},
  tape:{n:'Blister tape',p:25,t:'You cannot get blisters this race.'},watch:{n:'Pacing watch',p:70,t:'Shows the sweet-spot effort on your fader.'},
  buff:{n:'Cooling buff',p:45,t:'Heart rate runs cooler in the heat.'},
  roller:{n:'Massage gun',p:55,t:'Physio zones 35% wider. Tent treatments cost 20 s less.'},
};
const SHOPIDS=['hat','flask','gels','tape','shoes','sleeves','poles','buff','watch','roller'];
const CAPCOST=[60,110,180];

/* ---------- injuries ---------- */
const INJ={
  blister:{n:'Blister',loc:'foot',t:'Every step is slower'},
  shin:{n:'Shin splints',loc:'shin',t:'Legs drain faster on flat and downhill'},
  calf:{n:'Tight calf',loc:'calf',t:'Climbs hurt more, cramps come sooner'},
  knee:{n:'Sore knee',loc:'knee',t:'Descents drain your legs'},
  ach:{n:'Achilles pain',loc:'ankle',t:'Hard efforts drain your legs'},
};
const SEVCOL=['#e8d24a','#f0903a','#e84a3a'];
const sev=k=>{const q=save.inj.find(i=>i.k===k);return q?q.s:0;};
const lv=k=>save.stats[k].l;
const need=l=>70+45*l;
function addInj(k){const q=save.inj.find(i=>i.k===k);if(q){q.s=Math.min(3,q.s+1);return INJ[k].n+' worse';}save.inj.push({k,s:1});return INJ[k].n;}
function addXp(k,n,lines){const s=save.stats[k];if(s.l>=5)return;s.x+=n;lines.push({s:`${STATN[k]} +${Math.round(n)} xp`,c:'#9fd8a0'});while(s.l<5&&s.x>=need(s.l)){s.x-=need(s.l);s.l++;lines.push({s:`${STATN[k]} is now level ${s.l}!`,c:'#ffd24a'});}if(s.l>=5)s.x=0;}
function advanceDay(rest,lines){save.day++;save.fatigue=Math.max(0,save.fatigue-(rest?45:12));
  const ch=(rest?.5:.12)*(save.fatigue<50?1:.5);save.inj.forEach(i=>{if(Math.random()<ch){i.s--;lines.push({s:INJ[i.k].n+(i.s>0?' eases':' has healed'),c:'#9fd8a0'});}});save.inj=save.inj.filter(i=>i.s>0);}

/* ---------- state ---------- */
let scene='map',race=null,R_=null,S=null,P=null,PH=null,t=0,sceneT=0,paused=false,shake=0,flash=0,msg='',msgT=0,note='',noteT=0;
const HIT=[],popups=[],parts=[];
const pop=(s,x,y,col='#fff')=>popups.push({s,x,y,t:1.2,col});
const banner=(s,n=1.6)=>{msg=s;msgT=n;};
const toast=s=>{note=s;noteT=2;};

/* ---------- stage generation ---------- */
function genStage(r,si){
  const tr=r.train||{},L=(1000+120*r.tier+60*si)*(tr.len||1),segs=[];let x=0,e=0;const tier=r.tier,amp=(.05+.035*Math.min(tier,2)+.01*si)*(tr.amp||1);
  const th=THEMES[r.theme];
  const tw=tier===0?{smooth:5,rocky:2,loose:1,mud:1,creek:1}:tier===1?{smooth:3,rocky:4,loose:3,mud:1,creek:2}:{smooth:2,rocky:4,loose:4,mud:2,creek:2};
  const pickTer=()=>{const k=Object.keys(tw);let q=Math.random()*k.reduce((a,b)=>a+tw[b],0);for(const n of k){q-=tw[n];if(q<=0)return n;}return 'smooth';};
  const b1=tr.bias||.4;
  while(x<L){const len=Math.min(L-x,rint(80,190)),roll=Math.random();let g=roll<b1?rnd(.03,amp*2.1):roll<b1+.32?rnd(-amp*1.7,-.02):rnd(-.01,.02);if(si===0&&x<150)g=rnd(0,.02);
    const ter=pickTer();segs.push({x0:x,len,g,t:ter,e0:e});e+=len*g;x+=len;}
  const evs=[],pool=['creek','climb','scree','fork','oranges','heat','blister'];
  const n=tr.fat!=null?2:3+(tier>0?1:0),slots=[];for(let i=0;i<n;i++)slots.push(L*(.16+.7*(i+rnd(.2,.8))/n));
  let ps=shuffle(pool);slots.forEach((px,i)=>evs.push({x:px,k:ps[i%ps.length],done:false}));
  if(!r.train&&r.tier>=1&&Math.random()<.35)evs.push({x:L*rnd(.35,.8),k:'bear',done:false});
  const heat=tr.heat!=null?tr.heat:th.heat+rnd(-.1,.15);
  return {L,segs,evs,heat,cut:L/(tr.fat!=null?7.5:[9.2,8.4,7.0,7.7][tier]),trees:Array.from({length:60},()=>({x:rnd(0,L+80),h:rnd(14,30)})),elevEnd:e};
}
const segAt=(st,x)=>{const s=st.segs;for(let i=0;i<s.length;i++)if(x<s[i].x0+s[i].len)return s[i];return s[s.length-1];};
const elevAt=(st,x)=>{const s=segAt(st,x);return s.e0+(Math.min(x,s.x0+s.len)-s.x0)*s.g;};

/* ---------- running ---------- */
function beginRace(r){
  race=r;R_={si:0,times:[],bonks:0,gear:save.load.filter(g=>save.owned.includes(g)),sips:3,gels:2,blister:false,fell:false,total:0,newInj:[],stageInj:[],tentUsed:false,report:[],climbXp:0,heatXp:0,easyXp:0,res:null,settled:false};
  R_.sips=3+(has('flask')?2:0);R_.gels=2+(has('gels')?2:0);
  R_.legs=clamp(100-save.fatigue*.25+(save.loose?10:0),40,100);R_.water=100;R_.fuel=100;if(save.loose){R_.report.push({s:'Loosened up by physio: +10 legs',c:'#9fd8a0'});}save.loose=false;
  if(r.nav)startNav();else startStage();
}
function startStage(){
  S=genStage(race,R_.si);
  P={x:0,effort:.3,hr:.45,legs:R_.legs,water:R_.water,fuel:R_.fuel,bonk:0,stop:0,slow:null,hike:0,cramp:0,redT:0,ankle:0,cool:0,phase:0,t:0,speed:0,cut:S.cut,elevCam:0,ev:null,drinkT:0,bonked:false,sDown:0,sRed:0,sHard:0,sClimb:0,tEasy:0};
  popups.length=0;parts.length=0;scene='run';sceneT=0;R_.stageInj=[];banner(`Stage ${R_.si+1} of ${race.stages}`,1.8);beep(520,.12);
}
const has=g=>R_&&R_.gear.includes(g);
const PS=[19,17,15.5,15],PG=[23,20,18,17.4],avgL=()=>1000+120*race.tier+60*(race.stages-1)/2;
const par=()=>race.parT?race.parT:({silver:race.stages*avgL()/PS[race.tier],gold:race.stages*avgL()/PG[race.tier]});
const simTS=()=>(race.km/race.stages)*5.54;
const fmtT=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');};

function sweetEffort(g,heat){return clamp((.74-.28-1.1*Math.max(0,g)-heat*.06)/.62,.1,.9);}
function update(dt){
  t+=dt;sceneT+=dt;shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt*2);if(msgT>0)msgT-=dt;if(noteT>0)noteT-=dt;
  for(const p of popups)p.t-=dt;for(let i=popups.length-1;i>=0;i--)if(popups[i].t<=0)popups.splice(i,1);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.t-=dt;}for(let i=parts.length-1;i>=0;i--)if(parts[i].t<=0)parts.splice(i,1);
  if(paused)return;
  if(scene==='physio'){if(PH&&PH.mode==='play'){PH.t+=dt;if(PH.fbT>0)PH.fbT-=dt;}return;}
  if(scene==='bear'){bearStep(dt);return;}
  if(scene==='event'){P.ev.t-=dt;if(P.ev.t<=0)chooseEvent(0);return;}
  if(scene!=='run'&&scene!=='nav')return;
  const seg=scene==='nav'?navSeg(dt):segAt(S,P.x),g=seg.g,ter=TERRAIN[seg.t];P.t+=dt;
  const heat=S.heat*(has('hat')?.4:1)*(P.cool>0?.3:1)*(1-.08*lv('heat'));
  let e=P.effort;
  if(P.bonk>0){P.bonk-=dt;e=Math.min(e,.15);if(P.bonk<=0){P.legs=Math.max(P.legs,14);banner('You find your legs again',1.6);}}
  if(P.hike>0){P.hike-=dt;e=Math.min(e,.2);}
  if(P.cramp>0){P.cramp-=dt;e=Math.min(e,.35);}
  // speed
  let v=9+26*Math.pow(e,.9);
  if(g>0)v*=clamp(1-3.0*(1-.07*lv('clm'))*g*(has('poles')?.85:1)*(1+.1*sev('calf')),.4,1);else v*=1+Math.min(.35,-g*2.2);
  const terPen=1-ter.f;v*=1-terPen*((has('shoes')&&seg.t!=='smooth')?.5:1);
  if(P.legs<25)v*=.6+.4*P.legs/25;
  if(R_.blister)v*=.92;v*=1-.045*sev('blister');if(P.ankle>0){P.ankle-=dt;v*=.85;}
  if(P.slow){P.slow.t-=dt;v*=P.slow.v;if(P.slow.t<=0)P.slow=null;}
  if(P.hike>0)v=Math.min(v,11*(has('poles')?1.2:1));
  if(P.bonk>0)v=Math.min(v,7);
  if(P.drinkT>0){P.drinkT-=dt;v*=.55;}
  if(P.stop>0){P.stop-=dt;v=0;}
  P.speed+=(v-P.speed)*(1-Math.exp(-dt*3));if(scene==='nav'){navMove(P.speed*dt);if(scene!=='nav')return;}else P.x+=P.speed*dt;P.phase+=P.speed*dt*.085;
  // heart rate
  let tgt=.28+.62*e+1.1*Math.max(0,g)+heat*.07+(P.water<20?.08:0)+(has('buff')&&heat>.3?-.03:0);tgt=clamp(tgt,.3,1);
  P.hr+=(tgt-P.hr)*(1-Math.exp(-dt/(tgt>P.hr?5:9)));
  // legs
  let drain=.35+13*Math.pow(Math.max(0,P.hr-.62),1.6);
  if(g<-.06&&e>.55)drain+=Math.max(0,-g-.06)*30*e*(1+.6*sev('knee'));
  if(g>0&&has('poles'))drain*=.9;
  if(g<.02)drain*=1+.08*sev('shin');if(e>.75)drain*=1+.2*sev('ach');
  drain*=1-.05*lv('end');
  if(P.fuel<20)drain*=1.5;if(P.water<20)drain*=1.3;
  if(P.hr<.6){const rec=.8*(.6-P.hr)/.3*(has('sleeves')?1.4:1)*(1+.12*lv('rec'))*(P.fuel<15?.6:1);P.legs=Math.min(100,P.legs+rec*dt);}
  if(P.hr>.62)P.legs-=drain*dt;else P.legs-=.2*dt;
  if(P.legs<=0&&P.bonk<=0){P.legs=0;P.bonk=12;R_.bonks++;P.bonked=true;banner('BONK! Your legs give out',2);shake=6;beep(160,.4,'sawtooth',.06,-60);flash=.6;}
  // stress tracking for injuries and training
  if(g<-.05&&e>.55)P.sDown+=dt;if(P.hr>.9)P.sRed+=dt;if(e>.7)P.sHard+=dt;if(g>.04&&P.hr>.8)P.sClimb+=dt;if(P.hr<.62)P.tEasy+=dt;
  if(g>.03)R_.climbXp+=dt;
  // hydration and fuel
  P.water=Math.max(0,P.water-.45*(.5+e+heat*.6)*dt);P.fuel=Math.max(0,P.fuel-.32*(.4+e)*dt);
  // cramp from redlining while dry
  if(P.hr>.92){P.redT+=dt;if(P.redT>6-sev('calf')&&P.water<35&&P.cramp<=0){P.cramp=9;P.redT=0;banner('Cramp! Ease off',1.8);beep(200,.2,'sawtooth',.05);}}else P.redT=Math.max(0,P.redT-dt);
  // stumbles on technical ground
  if((seg.t==='rocky'||seg.t==='loose')&&e>.8&&Math.random()<(has('shoes')?.008:.016)*dt){P.stop=Math.max(P.stop,.7);P.legs-=6;pop('stumble',RX,110,'#ffb08a');shake=3;}
  // particles
  if(P.speed>6&&Math.random()<dt*14){parts.push({x:(scene==='nav'?W/2:RX)-4,y:(scene==='nav'?runY():groundY(P.x)-1),vx:rnd(-16,-5),vy:rnd(-12,-3),g:30,t:.5,col:seg.t==='mud'?'#5a4a3a':'#a89a78',s:1.5});}
  if(P.hr>.85&&Math.random()<dt*8)parts.push({x:(scene==='nav'?W/2:RX)+2,y:(scene==='nav'?runY()-36:groundY(P.x)-26),vx:rnd(-6,6),vy:rnd(-20,-8),g:40,t:.6,col:'#9ad8ff',s:1.5});
  // events and stage end
  for(const ev of S.evs)if(!ev.done&&P.x>=ev.x){ev.done=true;openEvent(ev);return;}
  P.cutLeft=S.cut-P.t;
  if(P.t>S.cut){fail('Missed the cutoff');return;}
  if(P.x>=S.L)finishStage();
}
const PXU=1.75,EV=PXU*2.2,RX=140,GY0=150;
function groundY(wx){return GY0-(elevAt(S,wx)-P.elevCam)*EV;}

/* ---------- trail events ---------- */
const EVENTS={
  creek:{t:'Creek crossing',d:'Cold water runs over the trail. Wade it or hop the stones?',
    a:{t:'Wade across',h:'Safe and cooling, but slow',fn(){P.slow={t:6,v:.6};P.hr=Math.max(.3,P.hr-.08);P.legs=Math.min(100,P.legs+6);pop('cooled off',RX,110,'#9ad8ff');if(!has('tape')&&Math.random()<.2&&!R_.blister){R_.blister=true;pop('blister!',RX,100,'#ffb08a');}}},
    b:{t:'Leap the stones',h:'65% you gain ground, 35% you fall',fn(){if(Math.random()<.65){P.x+=28;pop('+ground',RX,110,'#9aff9a');}else{P.legs-=16;P.ankle=20;P.stop=.8;shake=5;R_.fell=true;pop('fell!',RX,110,'#ff8a7a');}}}},
  climb:{t:'Steep climb',d:'The trail kicks up. Power-hike it, or run it?',
    a:{t:'Power-hike',h:'Walk for 10 s: heart rate drops, legs recover',fn(){P.hike=10;pop('hiking',RX,110,'#9ad8ff');}},
    b:{t:'Run it',h:'Gain ground now, but heart rate spikes',fn(){P.x+=34;P.hr=Math.min(1,P.hr+.15);P.legs-=8;pop('+ground',RX,110,'#9aff9a');}}},
  scree:{t:'Loose scree',d:'A slope of shifting stones.',
    a:{t:'Pick your way',h:'Slower, safe',fn(){P.slow={t:7,v:.7};}},
    b:{t:'Send it',h:'55% big gain, 45% you stumble',fn(){if(Math.random()<.55){P.x+=38;pop('+ground',RX,110,'#9aff9a');}else{P.stop=1.6;P.legs-=10;shake=5;R_.fell=true;pop('stumble',RX,110,'#ff8a7a');}}}},
  fork:{t:'A fork',d:'A steep shortcut up the ridge, or the long switchbacks.',

function drink(){if(scene!=='run'||R_.sips<=0||P.drinkT>0)return;R_.sips--;P.water=Math.min(100,P.water+38);P.drinkT=1.3;beep(700,.1,'sine');pop('+water',RX,110,'#9ad8ff');}

// injuries are rolled at the end of every stage from how hard you ran it
function rollInjuries(){
  const fr=n=>P.t>0?n/P.t:0,f=save.fatigue*.0012,tr=race.train?.6:1,out=[];
  const tryInj=(k,p)=>{if(Math.random()<clamp(p,0,.55)*tr)out.push(addInj(k));};
  tryInj('knee',.025+fr(P.sDown)*.9+f+(R_.fell?.25:0));
  tryInj('shin',.025+fr(P.sHard)*.3+f);
  tryInj('calf',.025+fr(P.sClimb)*.9+f+(P.water<20?.08:0));
  tryInj('ach',.02+fr(P.sRed)*1.0+f+(P.bonked?.1:0));
  if(R_.blister){out.push(addInj('blister'));R_.blister=false;}
  R_.fell=false;P.bonked=false;R_.stageInj=out;R_.newInj.push(...out);
  R_.heatXp+=S.heat>.3?14:5;R_.easyXp+=fr(P.tEasy);R_.climbFrac=(R_.climbFrac||0)+fr(R_.climbXp);R_.climbXp=0;
}
function finishStage(){
  R_.times.push(P.t);R_.total+=P.t;R_.legs=P.legs;R_.water=P.water;R_.fuel=P.fuel;beep(988,.2,'triangle');rollInjuries();
  if(R_.si+1>=race.stages)return endRace(true);
  scene='aid';sceneT=0;R_.tentUsed=false;R_.draft=shuffle(Object.keys(GEAR).filter(g=>!R_.gear.includes(g))).slice(0,3);
  R_.legs=Math.min(100,P.legs+50);R_.water=100;R_.fuel=Math.min(100,P.fuel+30);R_.sips=Math.max(R_.sips,3+(has('flask')?2:0));R_.gels=Math.max(R_.gels,2+(has('gels')?2:0));
}
function aidNext(){R_.si++;startStage();}
function draftPick(g){R_.gear.push(g);if(g==='flask')R_.sips+=2;if(g==='gels')R_.gels+=2;beep(740,.1,'triangle');aidNext();}
const COIN={bronze:50,silver:80,gold:120};
function settle(done,medal){
  if(R_.settled)return;R_.settled=true;const tr=!!race.train,L=R_.report,st=race.stages;let coins=0,fat;
  if(!done)coins=8;else if(tr)coins=18;else coins=Math.round(COIN[medal]*(1+.6*race.tier));
  if(tr)fat=race.train.fat;else fat=11*st;
  if(done){
    if(tr){const k=race.stat;let xp=45+(R_.bonks?0:15);if(k==='rec')xp=20+55*clamp(R_.easyXp,0,1);if(k==='clm')xp+=10*R_.climbFrac*3;addXp(k,xp,L);if(k!=='end')addXp('end',8,L);}
    else{addXp('end',10*st,L);addXp('clm',clamp(R_.climbFrac/st,0,1)*22*st,L);addXp('heat',R_.heatXp,L);addXp('rec',6*st,L);}
  }
  if(R_.bonusCoins){coins+=R_.bonusCoins;L.push({s:`Bear bonus +${R_.bonusCoins} coins`,c:'#ffd24a'});}
  save.coins+=coins;R_.coins=coins;if(coins)L.unshift({s:`+${coins} coins`,c:'#ffd24a'});
  save.fatigue=clamp(save.fatigue+fat,0,100);
  R_.newInj.forEach(s=>L.push({s:'Injury: '+s,c:'#ff8a7a'}));
  advanceDay(false,L);if(save.fatigue>=70)L.push({s:'You are overreached: rest soon!',c:'#ffb08a'});
  persist();
}
function fail(why){scene='dnf';sceneT=0;R_.why=why;rollInjuries();beep(150,.5,'sawtooth',.06,-80);settle(false);}
function endRace(done){
  scene='result';sceneT=0;R_.res={total:R_.total,medal:null};
  if(!race.train){const pr=par();R_.res.medal='bronze';if(R_.total<=pr.silver)R_.res.medal='silver';if(R_.total<=pr.gold&&R_.bonks===0)R_.res.medal='gold';
    const prev=save.medals[race.id],order={bronze:1,silver:2,gold:3};if(!prev||order[R_.res.medal]>order[prev])save.medals[race.id]=R_.res.medal;}
  settle(done,R_.res.medal);beep(1046,.4,'triangle');
}

/* ---------- physio mini-game ---------- */
const tri=x=>{x=((x%2)+2)%2;return x<1?x:2-x;};
function openTreat(from,k){
  const fee=from==='base'?15:0;if(save.coins<fee){toast('Not enough coins');return;}
  const s=sev(k);if(!s)return;save.coins-=fee;
  const kit=g=>from==='tent'?has(g):save.load.includes(g);
  PH={from,mode:'play',k,s,pulses:4+s,n:0,hits:0,perf:0,miss:0,t:0,zc:rnd(.25,.75),w:clamp(.26+.025*lv('rec')+(kit('roller')?.09:0)-.03*(s-1),.14,.5),speed:.7+.12*s,fb:'',fbT:0,res:null,log:[]};
  scene='physio';sceneT=0;
}
function press(){
  if(!PH||PH.mode!=='play')return;
  const pos=tri(PH.t*PH.speed),d=Math.abs(pos-PH.zc);
  if(d<=PH.w/2){PH.hits++;const pf=d<=PH.w*.18;if(pf)PH.perf++;PH.fb=pf?'PERFECT':'good';PH.log.push(pf?2:1);beep(pf?980:760,.08,'triangle');}
  else{PH.miss++;PH.fb='ouch';PH.log.push(0);beep(200,.12,'sawtooth',.04);}
  PH.fbT=.7;PH.n++;PH.zc=rnd(.18,.82);
  const need_=Math.ceil(PH.pulses*.6);
  if(PH.miss>=3||PH.n>=PH.pulses||PH.hits>=PH.pulses){
    const ok=PH.hits>=need_;PH.mode='done';PH.res={ok};
    if(ok){const q=save.inj.find(i=>i.k===PH.k);if(q){q.s--;if(q.s<=0)save.inj=save.inj.filter(i=>i!==q);}const L=[];addXp('rec',8,L);
      if(PH.perf>=3){if(PH.from==='tent'){R_.legs=Math.min(100,R_.legs+10);}else save.loose=true;PH.res.loose=true;}}
    if(PH.from==='tent'){R_.tentUsed=true;R_.total+=(40-(has('roller')?20:0))/simTS();}
    persist();beep(ok?1046:180,.3,ok?'triangle':'sawtooth');
  }
}
function leaveTreat(){scene=PH&&PH.from==='tent'?'aid':'base';PH=null;}

/* ---------- bear fight (old-school boxing): dodge the swipe, punch while it is open ---------- */
let BR=null;
function startBear(from){
  BR={from,hp:100,php:from==='race'&&P&&P.legs<35?3:4,maxphp:0,state:'idle',st:1,side:0,open:0,combo:0,t:0,fb:'',fbT:0,dodge:0,dodgeSide:0,dcd:0,pcd:0,hand:0,punchT:0,flash:0,hurt:0,over:null,swing:0,feint:false,hits:0,whiffs:0};
  BR.maxphp=BR.php;scene='bear';sceneT=0;banner('A BEAR!',1.4);beep(120,.4,'sawtooth',.06,-30);
}
const bearSpeed=()=>1+(1-BR.hp/100)*.75;
function bearDodge(d){if(scene!=='bear'||!BR||BR.over||BR.dcd>0)return;BR.dodge=.5;BR.dodgeSide=d;BR.dcd=.6;beep(420,.05,'triangle',.03);}
function bearPunch(){
  if(scene!=='bear'||!BR||BR.over||BR.pcd>0)return;BR.pcd=.26;BR.punchT=.16;BR.hand^=1;
  if(BR.state==='open'){const dmg=5+Math.min(5,BR.combo*1.2);BR.hp=Math.max(0,BR.hp-dmg);BR.combo++;BR.flash=.14;BR.fb=BR.combo>2?'COMBO x'+BR.combo:'HIT!';BR.fbT=.5;shake=3;beep(300+BR.combo*40,.07,'square',.05);
    if(BR.hp<=0){BR.state='down';BR.over='win';BR.fb='K.O.!';BR.fbT=2;beep(900,.4,'triangle');}}
  else{BR.fb='blocked';BR.fbT=.4;BR.pcd=.5;BR.combo=0;beep(140,.1,'sawtooth',.03);}
}
function bearStep(dt){
  const B=BR;if(!B)return;B.t+=dt;B.st-=dt;if(B.dodge>0)B.dodge-=dt;if(B.dcd>0)B.dcd-=dt;if(B.pcd>0)B.pcd-=dt;if(B.punchT>0)B.punchT-=dt;if(B.flash>0)B.flash-=dt;if(B.hurt>0)B.hurt-=dt;if(B.fbT>0)B.fbT-=dt;
  if(B.over)return;const sp=bearSpeed();
  if(B.state==='idle'&&B.st<=0){B.side=Math.random()<.5?-1:1;B.state='wind';B.st=.85/sp;B.feint=B.hp<65&&Math.random()<.3;B.swing=0;}
  else if(B.state==='wind'&&B.st<=0){
    if(B.feint){B.feint=false;B.side=-B.side;B.st=.5/sp;beep(260,.05,'square',.03);return;}
    B.state='swing';B.st=.28;
    if(B.dodge>0&&B.dodgeSide===-B.side){B.fb='DODGE!';B.fbT=.6;B.whiffs++;beep(700,.1,'triangle');}
    else{B.php--;B.hits++;B.hurt=.4;B.combo=0;B.fb='OUCH';B.fbT=.6;shake=7;flash=.5;beep(110,.25,'sawtooth',.07,-30);if(B.php<=0){B.over='lose';B.fb='';}}
  }
  else if(B.state==='swing'&&B.st<=0){const dodged=B.fb==='DODGE!'&&B.fbT>0;if(dodged){B.state='open';B.st=1.15;B.fb='OPEN! PUNCH!';B.fbT=.8;}else{B.state='idle';B.st=.7/sp;}}
  else if(B.state==='open'&&B.st<=0){B.state='idle';B.st=.6/sp;B.combo=0;}
}
function endBear(){
  const B=BR,win=B.over==='win';BR=null;
  if(B.from==='race'){scene='run';
    if(win){P.legs=Math.min(100,P.legs+12);R_.bonusCoins=(R_.bonusCoins||0)+25;pop('bear beaten!  +25c',RX,100,'#9aff9a');}
    else{P.legs=Math.max(4,P.legs-25);P.stop=Math.max(P.stop,3);R_.fell=true;pop('mauled!',RX,100,'#ff8a7a');}}
  else{scene='map';save.bear[win?'w':'l']++;if(win){save.coins+=15;toast('The bear runs off. +15 coins');}persist();}
}
function drawBear(cx,base){
  const B=BR,st=B.state,flash=B.flash>0,dark=flash?'#9a6a52':'#4a2e1c',mid=flash?'#b07a60':'#6a4228',lite=flash?'#d8a888':'#a87850';
  c.save();

    else if(sw){c.save();c.translate(cx+side*50,by-112);c.rotate(-side*1.05);c.fillRect(-11,0,22,96);c.fillStyle='#e8e0d0';for(let i=0;i<3;i++)c.fillRect(-9+i*7,92,4,10);c.restore();}
    else{c.fillRect(ax-11,by-110,22,74);c.fillStyle=dark;c.fillRect(ax-11,by-40,22,10);}};
  arm(-1);arm(1);

  const hy=by-176+wob;c.fillStyle=mid;c.fillRect(cx-32,hy,64,56);c.fillStyle=dark;c.fillRect(cx-36,hy-6,16,16);c.fillRect(cx+20,hy-6,16,16);
  c.fillStyle=lite;c.fillRect(cx-16,hy+24,32,28);c.fillStyle='#14100c';c.fillRect(cx-6,hy+26,12,8);
  const rage=st==='wind'||st==='swing';c.fillStyle=rage?'#ff5a3a':'#f0e0c0';c.fillRect(cx-22,hy+12,10,8);c.fillRect(cx+12,hy+12,10,8);c.fillStyle='#14100c';c.fillRect(cx-18,hy+14,4,5);c.fillRect(cx+16,hy+14,4,5);

}

/* ---------- drawing helpers ---------- */
function text(s,x,y,col='#f1e8d4',size=8,align='left',weight=700){c.font=`${weight} ${size}px ${MONO}`;c.textAlign=align;c.fillStyle='rgba(0,0,0,.55)';c.fillText(s,x+.6,y+.6);c.fillStyle=col;c.fillText(s,x,y);}
function wrap(s,n){const w=s.split(' '),L=[];let l='';for(const x of w){if((l+' '+x).trim().length>n){L.push(l);l=x;}else l=(l+' '+x).trim();}if(l)L.push(l);return L;}

/* ---------- input (the canvas is rotated by CSS when the phone is held upright) ---------- */
const drags=new Map();
const pt=e=>{const r=cvs.getBoundingClientRect();
  if(ROT){const s=r.height/W,cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy;return {x:(dy+W*s/2)/s,y:(-dx+H*s/2)/s};}
  return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};};
cvs.addEventListener('pointerdown',e=>{try{cvs.setPointerCapture(e.pointerId);}catch(_){}const p=pt(e);
  for(let i=HIT.length-1;i>=0;i--){const b=HIT[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}}
  if((scene==='run'||scene==='nav')&&!paused&&p.x>=FX-8&&p.y>=FY0-4&&p.y<=FY1+6){drags.set(e.pointerId,'f');setEffortFromY(p.y);}
  else if(scene==='nav'&&!paused&&!NAV.map&&p.x<=STP.x+STP.w+8&&p.y>=STP.y-10){drags.set(e.pointerId,'s');NAV.steer=steerFromX(p.x);}});

const up=e=>{const k=drags.get(e.pointerId);if(k==='s'&&NAV)NAV.steer=0;drags.delete(e.pointerId);if(fsReq){fsReq=false;toggleFS();}};cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);cvs.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(scene==='run'||scene==='nav'){if(e.key==='ArrowUp')P.effort=clamp(P.effort+.06,0,1);if(e.key==='ArrowDown')P.effort=clamp(P.effort-.06,0,1);if(e.key==='d'&&scene==='run')drink();if(e.key==='g')gel();if(e.key==='Escape')paused=!paused;}
