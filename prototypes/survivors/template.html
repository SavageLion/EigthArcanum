<title>Arcanum Survivors</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: one landscape canvas (480x270 logical) letterboxed in the viewport, DOM panels laid over it for choices.
   Palette: night indigo, moon bone, star gold, ember red, frost blue. Type: Pixelify Sans for titles, VT323 for small text. */
:root{--bg:#07040f;--panel:#171027;--panel2:#241838;--line:#5a4a82;--ink:#f1e8d4;--dim:#a79bc0;--gold:#dcb868;--ember:#ff7a6e;--frost:#9ad0ff;--good:#7fe0c0;
  --display:"Pixelify Sans","Courier New",monospace;--small:"VT323","Courier New",monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;place-items:center}
#stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
#box{position:relative;--s:1;width:calc(480px*var(--s));height:calc(270px*var(--s))}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0818}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--s)*7px);background:rgba(7,4,15,.82);font-family:var(--display);text-align:center;padding:calc(var(--s)*6px)}
#panel.on{display:flex}
#panel h2{margin:0;font-size:calc(var(--s)*14px);color:var(--gold);letter-spacing:.06em;font-weight:700;text-wrap:balance}
#panel p{margin:0;font-family:var(--small);font-size:calc(var(--s)*10px);color:var(--dim)}
.row{display:flex;gap:calc(var(--s)*6px);justify-content:center;flex-wrap:nowrap;width:100%}
.card{flex:1 1 0;min-width:0;max-width:calc(var(--s)*140px);background:var(--panel);border:2px solid var(--line);color:var(--ink);font-family:var(--display);padding:calc(var(--s)*5px) calc(var(--s)*5px) calc(var(--s)*6px);display:flex;flex-direction:column;gap:calc(var(--s)*3px);align-items:center;cursor:pointer;min-height:calc(var(--s)*74px)}
.card:active,.card:focus-visible{background:var(--panel2);border-color:var(--gold);outline:none}
.card[disabled]{opacity:.4;cursor:default}
.card b{font-size:calc(var(--s)*10px);line-height:1.1;font-weight:700}
.card span{font-family:var(--small);font-size:calc(var(--s)*9px);line-height:1.05;color:var(--dim)}
.card i{font-style:normal;font-family:var(--small);font-size:calc(var(--s)*8px);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--gold))}
.ico{width:calc(var(--s)*16px);height:calc(var(--s)*16px);display:grid;place-items:center;background:var(--c,#555);color:#0b0818;font-weight:700;font-size:calc(var(--s)*10px);border:1px solid #0006}
.btn{font-family:var(--display);font-weight:700;font-size:calc(var(--s)*11px);color:#0b0818;background:var(--gold);border:0;padding:calc(var(--s)*5px) calc(var(--s)*14px);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:active{filter:brightness(1.2)}
.tag{font-family:var(--small);font-size:calc(var(--s)*9px);color:var(--dim)}
#rotate{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;z-index:9;font-family:var(--display);color:var(--gold);font-size:22px;padding:24px}
@media (orientation:portrait){#rotate{display:grid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div id="stage"><div id="box"><canvas id="cv" width="480" height="270"></canvas><div id="panel"></div></div></div>
<div id="rotate"><div>Turn your phone sideways<div class="tag" style="margin-top:10px;font-size:18px;color:var(--dim)">Arcanum Survivors is played in landscape.</div></div></div>
<script>
(()=>{
const SPR=/*SPR*/{};
const W=480,H=270,cv=document.getElementById('cv'),c=cv.getContext('2d'),box=document.getElementById('box'),panel=document.getElementById('panel');
c.imageSmoothingEnabled=false;
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),TAU=Math.PI*2;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const AR={x0:14,y0:24,x1:466,y1:256};   // playfield
const FONT='"Pixelify Sans","Courier New",monospace',SMALL='"VT323","Courier New",monospace';

/* ---------- art: the Raven's real sprites, everything else drawn ---------- */
const IM={walk:{},idle:{}};
for(const d in SPR.walk) IM.walk[d]=SPR.walk[d].map(s=>{const i=new Image();i.src=s;return i;});
for(const d in SPR.idle){const i=new Image();i.src=SPR.idle[d];IM.idle[d]=i;}

/* ---------- spells and modifiers ---------- */
const SP={
  bolt:{name:'Arcane Bolt',cat:'attack',l:'B',col:'#ffd27a',cd:.5,desc:'Fires at the nearest foe.'},
  nova:{name:'Star Nova',cat:'attack',l:'N',col:'#9ad0ff',cd:2.6,desc:'A ring of light bursts out of you.'},
  chain:{name:'Chain Spark',cat:'attack',l:'C',col:'#cfe0ff',cd:1.7,desc:'Lightning that leaps between foes.'},
  meteor:{name:'Falling Star',cat:'attack',l:'M',col:'#ff9a5a',cd:3,desc:'Stars crash down on foes.'},
  orbit:{name:'Moon Orbit',cat:'attack',l:'O',col:'#e8d8ff',cd:0,desc:'Moons circle you, hurt foes and block shots.'},
  ward:{name:'Ward',cat:'defense',l:'W',col:'#7fe0c0',cd:9,desc:'Blocks one hit, then shoves foes back.'},
  thorns:{name:'Thorn Ring',cat:'defense',l:'T',col:'#8fe06a',cd:0,desc:'A ring of thorns hurts anything close.'},
  blink:{name:'Blink',cat:'move',l:'K',col:'#c9a0ff',cd:5,desc:'Teleports you away when foes crowd in.'},
  gust:{name:'Gale',cat:'move',l:'G',col:'#bfe8ff',cd:7,desc:'Pushes foes away and speeds you up.'},
  familiar:{name:'Familiar',cat:'summon',l:'F',col:'#ffb4d8',cd:0,desc:'A spirit that fights beside you.'},
};
const CATC={attack:'#ffb04a',defense:'#7fe0c0',move:'#c9a0ff',summon:'#ffb4d8'};
const ALLS=Object.keys(SP);
const MODS={
  multi:{name:'Multishot',desc:'+1 projectile, ring or target',tags:['bolt','nova','chain','meteor','orbit','familiar']},
  pierce:{name:'Piercing',desc:'Shots pass through 2 more foes',tags:['bolt','familiar']},
  split:{name:'Splintering',desc:'Hits burst into small shards',tags:['bolt','meteor']},
  bounce:{name:'Ricochet',desc:'Bolts bounce to another foe; sparks leap 2 more',tags:['bolt','chain']},
  haste:{name:'Quickened',desc:'20% faster cooldown',tags:ALLS},
  power:{name:'Empowered',desc:'+35% damage',tags:ALLS},
  size:{name:'Grandeur',desc:'+25% size and reach',tags:['bolt','nova','meteor','orbit','thorns','ward','gust','blink']},
  frost:{name:'Frostbite',desc:'Hits slow foes',tags:['bolt','nova','chain','meteor','orbit','thorns','familiar']},
  burn:{name:'Cinders',desc:'Hits set foes alight',tags:['bolt','nova','chain','meteor','orbit','thorns','familiar']},
  echo:{name:'Echo',desc:'Casts a second time',tags:['bolt','nova','chain','meteor']},
};
const REWARDS={spell:{n:'New spell',d:'Learn one of three'},mod:{n:'Spell upgrade',d:'Add a modifier'},rest:{n:'Rest',d:'Heal or grow stronger'},shop:{n:'Merchant',d:'Spend stardust'},gamble:{n:'Wager',d:'Risk HP for power'}};
const TWISTS={
  calm:{name:'Quiet night',desc:'Fewer foes',mult:1,spawn:.65},
  blood:{name:'Blood moon',desc:'Foes 25% faster',mult:2,spawn:1.1,speed:1.25},
  swarm:{name:'Swarm',desc:'Many weak foes',mult:1.5,spawn:1.7,hp:.7,weak:1},
  brutes:{name:'Brutes',desc:'Few, tough foes',mult:1.6,spawn:.6,hp:1.5,heavy:1},
  haunt:{name:'Haunted',desc:'Many shooters',mult:1.5,spawn:1,seers:1},
  frenzy:{name:'Frenzy',desc:'Your spells 30% faster, foes too',mult:1.8,spawn:1.35,cd:.77},
};
const ENEMIES={
  wisp:{hp:6,spd:36,r:5,dmg:1,cost:1,col:'#8fd0ff',gem:1},
  bat:{hp:4,spd:66,r:4,dmg:1,cost:1.2,col:'#c9a0ff',gem:1},
  husk:{hp:30,spd:22,r:9,dmg:2,cost:3.4,col:'#b88a6a',gem:3},
  seer:{hp:11,spd:26,r:6,dmg:1,cost:3,col:'#ffd27a',gem:2},
  ram:{hp:15,spd:30,r:7,dmg:2,cost:3,col:'#ff7a6e',gem:2},
};
const TOTAL_STAGES=8,BOSS_AT={4:'bell',8:'emperor'};

/* ---------- state ---------- */
let scene='menu',t=0,P,spells=[],stage=1,twist=null,nextTwist=null,enemies=[],shots=[],eshots=[],gems=[],parts=[],texts=[],marks=[],rings=[],zaps=[],later=[],blasts=[],famil=[],spawnQ=[],corners=[],stat={kills:0,dmg:0,gems:0,hurt:0},shake=0,flash=0,hold=0,holdCorner=-1,boss=null,bannerT=0,banner='',clearT=0,waveT=0,waveLen=0,spawnAcc=0,gemsTaken=0,bgc=null;
const keys={},stick={id:null,ox:0,oy:0,x:0,y:0,on:false,t0:0,moved:false};
function mkSpell(id){return {id,cd:SP[id].cd*.4,m:{multi:0,pierce:0,split:0,bounce:0,haste:0,power:0,size:0,frost:0,burn:0,echo:0},ang:0,tick:0,n:0};}
function newRun(){
  P={x:240,y:150,hp:14,max:14,inv:0,face:'south',step:0,moving:false,shield:0,boost:0,dust:0,r:5,aim:0};
  spells=[mkSpell('bolt')];stage=1;twist=null;nextTwist=null;enemies=[];shots=[];eshots=[];gems=[];parts=[];texts=[];marks=[];rings=[];zaps=[];later=[];blasts=[];famil=[];spawnQ=[];corners=[];boss=null;
  stat={kills:0,dmg:0,gems:0,hurt:0};startWave();
}
const hasSpell=id=>spells.find(s=>s.id===id);
const cdMul=()=>twist&&twist.cd||1;
const sCd=s=>SP[s.id].cd*Math.pow(.8,s.m.haste)*cdMul();
const sDmg=(s,b)=>b*(1+.35*s.m.power);
const sArea=s=>1+.25*s.m.size;
function effHP(base){return base*(1+.24*(stage-1))*(twist&&twist.hp||1);}

/* ---------- waves ---------- */
function startWave(){
  twist=nextTwist;nextTwist=null;enemies.length=0;eshots.length=0;marks.length=0;spawnQ.length=0;boss=null;
  waveLen=BOSS_AT[stage]?999:22+Math.min(stage,6)*1.6;waveT=waveLen;spawnAcc=0;scene='wave';
  banner=(BOSS_AT[stage]?'BOSS  ':'')+'STAGE '+stage+(twist?'  -  '+twist.name.toUpperCase():'');bannerT=2.2;
  if(BOSS_AT[stage])spawnBoss(BOSS_AT[stage]);
  for(const s of spells){if(s.id==='ward')s.cd=0;}
}
function typeWeights(){
  const w={wisp:5,bat:stage>=2?3:0,husk:stage>=2?2:0,seer:stage>=3?2:0,ram:stage>=4?2:0};
  if(twist){if(twist.weak){w.wisp*=2;w.bat*=2.5;w.husk=0;w.ram=0;}if(twist.heavy){w.husk*=3;w.ram*=3;w.wisp*=.3;w.bat*=.3;}if(twist.seers){w.seer=Math.max(2,w.seer)*4;}}
  return w;
}
function pickType(){const w=typeWeights();let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k;}return 'wisp';}
function queueSpawn(type){
  let x,y,n=0;do{x=rnd(AR.x0+16,AR.x1-16);y=rnd(AR.y0+16,AR.y1-16);const edge=Math.random();if(edge<.7){if(Math.random()<.5)x=Math.random()<.5?AR.x0+14:AR.x1-14;else y=Math.random()<.5?AR.y0+14:AR.y1-14;}}while(Math.hypot(x-P.x,y-P.y)<95&&n++<30);
  marks.push({x,y,t:.6,type});
}
function makeEnemy(type,x,y,elite){
  const d=ENEMIES[type],hp=effHP(d.hp)*(elite?3.2:1);
  return {type,x,y,vx:0,vy:0,hp,max:hp,r:d.r*(elite?1.35:1),spd:d.spd*(twist&&twist.speed||1)*(twist&&twist.cd?1.3:1),dmg:d.dmg,col:d.col,elite,slow:0,burn:0,flash:0,cd:rnd(1,2.4),st:0,stT:0,ph:rnd(0,6),orbCD:0,gem:d.gem*(elite?3:1),kb:{x:0,y:0}};
}
function spawnBoss(kind){
  const hp=kind==='bell'?400:900;
  boss={kind,x:240,y:70,vx:0,vy:0,hp:effHP(hp)*.65,max:0,r:kind==='bell'?20:22,t:0,cd:2,pat:0,slow:0,burn:0,flash:0,name:kind==='bell'?'The Hollow Bell':'The Emperor',tx:240,ty:70,phase:1,col:kind==='bell'?'#9ad0ff':'#f2a03d',isBoss:true,kb:{x:0,y:0},ph:0,orbCD:0,type:'boss',dmg:2};
  boss.max=boss.hp;enemies.push(boss);
}
function bossAI(b,dt){
  b.t+=dt;b.cd-=dt;const hpf=b.hp/b.max,ph2=hpf<.5;
  if(b.kind==='bell'){
    b.tx=240+Math.sin(b.t*.5)*140;b.ty=64+Math.sin(b.t*.8)*14;
    if(b.cd<=0){b.cd=ph2?2.6:3.6;const m=b.pat++%3;
      if(m===0){const n=ph2?18:12,o=rnd(0,TAU);for(let i=0;i<n;i++){const a=o+i/n*TAU;eshots.push({x:b.x,y:b.y,vx:Math.cos(a)*(58+(ph2?12:0)),vy:Math.sin(a)*(58+(ph2?12:0)),r:3,dmg:1,life:6,col:'#9ad0ff'});}}
      else if(m===1){for(let k=0;k<3;k++)later.push({t:k*.35,fn:()=>{const a=Math.atan2(P.y-b.y,P.x-b.x);for(let i=-2;i<=2;i++)eshots.push({x:b.x,y:b.y,vx:Math.cos(a+i*.17)*85,vy:Math.sin(a+i*.17)*85,r:3,dmg:1,life:6,col:'#cfe0ff'});}});}
      else{for(let i=0;i<(ph2?4:3);i++)queueSpawn('wisp');}
    }
  }else{
    if(b.t%6<.05||dist(b,{x:b.tx,y:b.ty})<6){b.tx=rnd(110,370);b.ty=rnd(54,120);}
    if(b.cd<=0){b.cd=ph2?1.5:2.2;const m=b.pat++%4;
      if(m===0){const a=Math.atan2(P.y-b.y,P.x-b.x),n=ph2?9:7;for(let i=0;i<n;i++){const o=(i-(n-1)/2)*.15;eshots.push({x:b.x,y:b.y,vx:Math.cos(a+o)*110,vy:Math.sin(a+o)*110,r:3.2,dmg:1,life:6,col:'#ffb04a'});}}
      else if(m===1){const n=ph2?20:15,o=b.t;for(let i=0;i<n;i++){const a=o+i/n*TAU;eshots.push({x:b.x,y:b.y,vx:Math.cos(a)*78,vy:Math.sin(a)*78,r:3,dmg:1,life:6,col:'#ff7a6e'});}}
      else if(m===2){const gap=rint(2,10);for(let i=0;i<13;i++)if(Math.abs(i-gap)>1)eshots.push({x:AR.x0+14+i*34,y:AR.y0+4,vx:0,vy:80,r:3.2,dmg:1,life:6,col:'#ffd27a'});}
      else{for(let i=0;i<(ph2?3:2);i++)queueSpawn(ph2?'ram':'bat');}
    }
  }
  const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy)||1,sp=b.kind==='bell'?60:48;b.vx=dx/d*sp*(b.slow>0?.6:1);b.vy=dy/d*sp*(b.slow>0?.6:1);
}

/* ---------- damage ---------- */
function hitEnemy(e,dmg,o={}){
  if(e.dead)return;dmg=Math.max(1,dmg);e.hp-=dmg;e.flash=.1;stat.dmg+=dmg;
  if(o.frost)e.slow=Math.max(e.slow,2);if(o.burn)e.burn=Math.max(e.burn,3);
  if(o.kx!==undefined&&!e.isBoss){e.kb.x+=o.kx;e.kb.y+=o.ky;}
  texts.push({x:e.x+rnd(-4,4),y:e.y-e.r-2,s:String(Math.round(dmg)),t:.6,c:o.crit?'#ffd27a':'#f1e8d4'});
  for(let i=0;i<2;i++)parts.push({x:e.x,y:e.y,vx:rnd(-40,40),vy:rnd(-40,40),t:.25,c:e.col||'#fff',s:1});
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.dead=true;stat.kills++;
  const n=e.isBoss?18:e.gem,mult=twist?twist.mult:1,tot=Math.max(1,Math.round(n*mult));
  for(let i=0;i<tot;i++)gems.push({x:e.x+rnd(-6,6),y:e.y+rnd(-6,6),vx:rnd(-30,30),vy:rnd(-30,30),v:1,t:0});
  for(let i=0;i<(e.isBoss?40:8);i++)parts.push({x:e.x,y:e.y,vx:rnd(-90,90),vy:rnd(-90,90),t:rnd(.3,.7),c:e.col,s:2});
  rings.push({x:e.x,y:e.y,r:3,max:e.isBoss?60:14,t:.3,c:e.col});
  if(e.isBoss){shake=8;clearWave();}
}
function hurtPlayer(d){
  if(P.inv>0||scene!=='wave')return;
  if(P.shield){P.shield=0;P.inv=.7;const w=hasSpell('ward');if(w){w.cd=sCd(w);const a=sArea(w);blasts.push({x:P.x,y:P.y,r:4,max:52*a,spd:170,dmg:sDmg(w,6),hit:new Set(),col:'#7fe0c0',push:1});}shake=3;return;}
  P.hp-=d;P.inv=.9;shake=5;flash=.15;stat.hurt++;
  for(let i=0;i<8;i++)parts.push({x:P.x,y:P.y,vx:rnd(-80,80),vy:rnd(-80,80),t:.4,c:'#ff7a6e',s:1});
  if(P.hp<=0){P.hp=0;scene='dead';showEnd(false);}
}
function nearest(x,y,maxD=240,skip){let b=null,bd=maxD;for(const e of enemies){if(e.dead||(skip&&skip.has(e)))continue;const d=Math.hypot(e.x-x,e.y-y)*(e.isBoss?.5:1);if(d<bd){bd=d;b=e;}}return b;}

/* ---------- spell casting ---------- */
function shotOf(x,y,a,s,o={}){
  const m=s.m;shots.push(Object.assign({x,y,vx:Math.cos(a)*215,vy:Math.sin(a)*215,r:2.3*sArea(s),dmg:sDmg(s,6),pierce:m.pierce*2,bounce:m.bounce,split:m.split,frost:m.frost>0,burn:m.burn>0,hit:new Set(),life:1.3,col:SP[s.id].col},o));
}
function castBolt(s,ox=P.x,oy=P.y,src='p'){
  const tg=nearest(ox,oy,260);if(!tg)return false;const n=1+s.m.multi,a0=Math.atan2(tg.y-oy,tg.x-ox);
  for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.17;shotOf(ox,oy,a,s,src==='f'?{dmg:sDmg(s,3),r:2}:{});}return true;
}
function castNova(s){const n=1+s.m.multi,a=sArea(s);for(let i=0;i<n;i++)later.push({t:i*.28,fn:()=>blasts.push({x:P.x,y:P.y,r:4,max:62*a,spd:150,dmg:sDmg(s,6),hit:new Set(),col:'#9ad0ff',frost:s.m.frost>0,burn:s.m.burn>0,push:.4})});return true;}
function castChain(s){
  const n=1+s.m.multi,used=new Set();let any=false;
  for(let k=0;k<n;k++){let cur=nearest(P.x,P.y,170,used);if(!cur)break;any=true;const pts=[{x:P.x,y:P.y}];let dmg=sDmg(s,6);
    for(let j=0;j<3+s.m.bounce*2&&cur;j++){used.add(cur);pts.push({x:cur.x,y:cur.y});hitEnemy(cur,dmg,{frost:s.m.frost>0,burn:s.m.burn>0});dmg*=.85;cur=nearest(cur.x,cur.y,85,used);}
    zaps.push({pts,t:.18});}
  return any;
}
function castMeteor(s){
  const n=1+s.m.multi;let any=false;
  for(let i=0;i<n;i++){let tg=enemies.filter(e=>!e.dead);tg=tg.length?pick(tg):null;if(!tg)break;any=true;marks.push({x:tg.x+rnd(-8,8),y:tg.y+rnd(-8,8),t:.7,meteor:s,r:24*sArea(s),warn:true});}
  return any;
}
function explodeMeteor(m){
  const s=m.meteor;rings.push({x:m.x,y:m.y,r:3,max:m.r,t:.3,c:'#ff9a5a'});shake=Math.max(shake,2);
  for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-m.x,e.y-m.y)<m.r+e.r)hitEnemy(e,sDmg(s,14),{frost:s.m.frost>0,burn:s.m.burn>0,kx:(e.x-m.x)*.4,ky:(e.y-m.y)*.4});}
  for(let i=0;i<14;i++)parts.push({x:m.x,y:m.y,vx:rnd(-100,100),vy:rnd(-100,100),t:.5,c:'#ffb04a',s:2});

/* ---------- the four corners ---------- */
const CORNERS=[{x:34,y:46,ax:1,ay:1},{x:446,y:46,ax:-1,ay:1},{x:34,y:236,ax:1,ay:-1},{x:446,y:236,ax:-1,ay:-1}];
function beginChoose(){
  scene='choose';hold=0;holdCorner=-1;
  const owned=new Set(spells.map(s=>s.id)),canSpell=ALLS.some(i=>!owned.has(i));
  let kinds=['mod','rest','shop','gamble'].concat(canSpell?['spell','spell']:[]);kinds=shuffle([...new Set(kinds)]);
  const pickK=[];if(canSpell)pickK.push('spell');pickK.push('mod');for(const k of kinds){if(pickK.length>=4)break;if(!pickK.includes(k))pickK.push(k);}
  const ks=shuffle(pickK),tw=shuffle(Object.keys(TWISTS));

  banner='CHOOSE YOUR PATH';bannerT=2;

function updChoose(dt){
  let on=-1;corners.forEach((cn,i)=>{if(Math.hypot(P.x-cn.x,P.y-cn.y)<20)on=i;});
  if(on>=0&&on===holdCorner)hold+=dt;else{hold=0;holdCorner=on;}

/* ---------- reward panels (DOM) ---------- */
const letterIcon=id=>`<div class="ico" style="--c:${SP[id].col}">${SP[id].l}</div>`;
function setPanel(html){panel.innerHTML=html;panel.classList.add('on');}
function closePanel(){panel.classList.remove('on');panel.innerHTML='';}
function compatible(modId){return spells.filter(s=>MODS[modId].tags.includes(s.id));}

  const ok=Object.keys(MODS).filter(k=>compatible(k).length);return shuffle(ok).slice(0,n);
}
function modCard(k,extra=''){const m=MODS[k];return `<button class="card" data-mod="${k}"><i style="--c:var(--frost)">Modifier</i><b>${m.name}</b><span>${m.desc}</span><span style="color:var(--gold)">${compatible(k).map(s=>SP[s.id].name).join(', ')}</span>${extra}</button>`;}
function chooseTarget(modId,done){

  setPanel(`<h2>Apply ${MODS[modId].name}</h2><p>${MODS[modId].desc}. Choose a spell.</p><div class="row">${list.map(s=>`<button class="card" data-sp="${s.id}">${letterIcon(s.id)}<b>${SP[s.id].name}</b><span>${modSummary(s)||'No modifiers yet'}</span></button>`).join('')}</div>`);

}

function openShop(done){

      const body=o.type==='mod'?`<i style="--c:var(--frost)">Modifier</i><b>${MODS[o.k].name}</b><span>${MODS[o.k].desc}</span>`:o.type==='spell'?`${letterIcon(o.id)}<b>${SP[o.id].name}</b><span>${SP[o.id].desc}</span>`:`<i style="--c:var(--good)">Remedy</i><b>Healing draught</b><span>Heal 4 hearts</span>`;
      return `<button class="card" data-i="${i}" ${dis?'disabled':''}>${body}<span style="color:var(--gold)">${o.sold?'SOLD':o.price+' stardust'}</span></button>`;}).join('')}</div><button class="btn ghost" id="leave">Leave</button>`);
    panel.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const o=offers[+b.dataset.i];if(o.sold||P.dust<o.price)return;P.dust-=o.price;o.sold=true;
      if(o.type==='heal'){P.hp=Math.min(P.max,P.hp+4);draw();}else if(o.type==='spell'){addSpell(o.id);draw();}else chooseTarget(o.k,draw);});
    $('leave').onclick=()=>{closePanel();done();};
  };
  draw();
}

/* ---------- sizing and loop ---------- */
function fit(){const sd=getComputedStyle(document.body),pw=innerWidth-parseFloat(sd.paddingLeft)-parseFloat(sd.paddingRight),ph=innerHeight;box.style.setProperty('--s',Math.max(.5,Math.min(pw/480,ph/270)).toFixed(4));}
addEventListener('resize',fit);fit();
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(frame);}
