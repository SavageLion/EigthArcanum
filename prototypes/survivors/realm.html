<title>Arcanum Realm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: one landscape canvas (480x270 logical) letterboxed in the viewport, DOM panels laid over it for choices.
   Palette: night indigo, moon bone, star gold, ember red, frost blue. Type: Pixelify Sans for titles, VT323 for small text. */
:root{--bg:#07040f;--panel:#171027;--panel2:#241838;--line:#5a4a82;--ink:#f1e8d4;--dim:#a79bc0;--gold:#dcb868;--ember:#ff7a6e;--frost:#9ad0ff;--good:#7fe0c0;
  --display:"Pixelify Sans","Courier New",monospace;--small:"VT323","Courier New",monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;place-items:center}
#stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
#box{position:relative;--s:1;width:calc(480px*var(--s));height:calc(270px*var(--s))}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0818}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--s)*7px);background:rgba(7,4,15,.82);font-family:var(--display);text-align:center;padding:calc(var(--s)*6px)}
#panel.on{display:flex}
#panel h2{margin:0;font-size:calc(var(--s)*14px);color:var(--gold);letter-spacing:.06em;font-weight:700;text-wrap:balance}
#panel p{margin:0;font-family:var(--small);font-size:calc(var(--s)*10px);color:var(--dim)}
.row{display:flex;gap:calc(var(--s)*6px);justify-content:center;flex-wrap:nowrap;width:100%}
.card{flex:1 1 0;min-width:0;max-width:calc(var(--s)*140px);background:var(--panel);border:2px solid var(--line);color:var(--ink);font-family:var(--display);padding:calc(var(--s)*5px) calc(var(--s)*5px) calc(var(--s)*6px);display:flex;flex-direction:column;gap:calc(var(--s)*3px);align-items:center;cursor:pointer;min-height:calc(var(--s)*74px)}
.card:active,.card:focus-visible{background:var(--panel2);border-color:var(--gold);outline:none}
.card[disabled]{opacity:.4;cursor:default}
.card b{font-size:calc(var(--s)*10px);line-height:1.1;font-weight:700}
.card span{font-family:var(--small);font-size:calc(var(--s)*9px);line-height:1.05;color:var(--dim)}
.card i{font-style:normal;font-family:var(--small);font-size:calc(var(--s)*8px);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--gold))}
.ico{width:calc(var(--s)*16px);height:calc(var(--s)*16px);display:grid;place-items:center;background:var(--c,#555);color:#0b0818;font-weight:700;font-size:calc(var(--s)*10px);border:1px solid #0006}
.btn{font-family:var(--display);font-weight:700;font-size:calc(var(--s)*11px);color:#0b0818;background:var(--gold);border:0;padding:calc(var(--s)*5px) calc(var(--s)*14px);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:active{filter:brightness(1.2)}
.tag{font-family:var(--small);font-size:calc(var(--s)*9px);color:var(--dim)}
#rotate{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;z-index:9;font-family:var(--display);color:var(--gold);font-size:22px;padding:24px}
@media (orientation:portrait){#rotate{display:grid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div id="stage"><div id="box"><canvas id="cv" width="480" height="270"></canvas><div id="panel"></div></div></div>

const NK={
  fight:{n:'Skirmish',col:'#c9a0ff',g:'x',d:'A wave of foes, then a reward.'},
  elite:{n:'Key guardian',col:'#ffd27a',g:'K',d:'Slay the guardian for a KEY, then choose an upgrade.'},
  market:{n:'Merchant',col:'#7fe0c0',g:'$',d:'Spend stardust. He also sells keys.'},
  rest:{n:'Campfire',col:'#9ad0ff',g:'+',d:'Heal, or grow stronger.'},
  wager:{n:'The Wager',col:'#ff9a9a',g:'?',d:'Risk hearts for two modifiers.'},
  boss:{n:'The Sealed Gate',col:'#ff7a6e',g:'!',d:'The Emperor waits. Needs all three keys.'},
};
const MAPX=[34,446],MAPY=[78,128,178];
function genMap(){
  const nodes=[],layers=[];
  const mk=(layer,row,kind)=>{const n={id:nodes.length,layer,row,kind,next:[],twist:null,reward:null,done:false,x:MAPX[0]+layer*(MAPX[1]-MAPX[0])/LAYERS,y:MAPY[row]};nodes.push(n);return n;};
  layers.push([mk(0,1,'fight')]);
  for(let l=1;l<LAYERS;l++){
    const cnt=l===LAYERS-1?2:3,rows=shuffle([0,1,2]).slice(0,cnt).sort(),kinds=[];
    if(l>=2)kinds.push('elite');
    const pool=l===1?['fight','fight','fight','rest']:['fight','fight','fight','fight','fight','market','market','rest','rest','wager','elite'];
    while(kinds.length<cnt){const k=pick(pool);if(k==='market'&&kinds.includes('market'))continue;kinds.push(k);}
    const ks=shuffle(kinds);layers.push(rows.map((r,i)=>mk(l,r,ks[i])));
  }
  layers.push([mk(LAYERS,1,'boss')]);
  for(let l=0;l<LAYERS;l++){
    const A=layers[l],B=layers[l+1];
    for(const a of A){const near=B.slice().sort((p,q)=>Math.abs(p.row-a.row)-Math.abs(q.row-a.row)||Math.random()-.5);a.next.push(near[0]);if(near[1]&&(B.length>2?Math.random()<.55:true)&&near[1]!==near[0]&&Math.abs(near[1].row-a.row)<=1)a.next.push(near[1]);}
    for(const b of B)if(!A.some(a=>a.next.includes(b))){const a=A.slice().sort((p,q)=>Math.abs(p.row-b.row)-Math.abs(q.row-b.row))[0];a.next.push(b);}
  }
  for(const n of nodes){
    if(n.kind==='fight'){n.twist=n.layer===0?null:pick(Object.keys(TWISTS));n.reward=Math.random()<(n.layer<=2?.55:.35)?'spell':'mod';}
    if(n.kind==='elite'){n.twist=Math.random()<.6?pick(Object.keys(TWISTS)):null;n.reward='mod';}
  }
  return {nodes,layers};
}
function toMap(){scene='map';sel=null;P.x=240;P.y=150;P.inv=1;enemies=[];eshots=[];shots=[];marks=[];guard=null;banner='CHOOSE YOUR ROAD';bannerT=1.6;}
function enterNode(n){

  if(n.kind==='fight'||n.kind==='elite'){nextTwist=n.twist?TWISTS[n.twist]:null;nodeKind=n.kind;P.x=240;P.y=190;P.inv=1;startWave();}

function afterClear(){

function mapTap(x,y){
  if(!cur)return;
  if(sel&&x>AR.x0+6+(AR.x1-AR.x0-12)-64&&x<AR.x0+6+(AR.x1-AR.x0-12)-8&&y>AR.y1-46+9&&y<AR.y1-46+31){enterNode(sel);return;}

const letterIcon=id=>`<div class="ico" style="--c:${SP[id].col}">${SP[id].l}</div>`;
function setPanel(html){panel.innerHTML=html;panel.classList.add('on');}
function closePanel(){panel.classList.remove('on');panel.innerHTML='';}
function compatible(modId){return spells.filter(s=>MODS[modId].tags.includes(s.id));}
function randomMods(n){
  const ok=Object.keys(MODS).filter(k=>compatible(k).length);return shuffle(ok).slice(0,n);
}
function modCard(k,extra=''){const m=MODS[k];return `<button class="card" data-mod="${k}"><i style="--c:var(--frost)">Modifier</i><b>${m.name}</b><span>${m.desc}</span><span style="color:var(--gold)">${compatible(k).map(s=>SP[s.id].name).join(', ')}</span>${extra}</button>`;}
function chooseTarget(modId,done){
  const list=compatible(modId);
  if(list.length===1){applyMod(list[0],modId);done();return;}
  setPanel(`<h2>Apply ${MODS[modId].name}</h2><p>${MODS[modId].desc}. Choose a spell.</p><div class="row">${list.map(s=>`<button class="card" data-sp="${s.id}">${letterIcon(s.id)}<b>${SP[s.id].name}</b><span>${modSummary(s)||'No modifiers yet'}</span></button>`).join('')}</div>`);
  panel.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{applyMod(spells.find(s=>s.id===b.dataset.sp),modId);done();});

function modSummary(s){return Object.entries(s.m).filter(([,v])=>v).map(([k,v])=>MODS[k].name+(v>1?' x'+v:'')).join(', ');}
function applyMod(s,k){s.m[k]++;if(k==='haste')s.cd=Math.min(s.cd,sCd(s));}
function addSpell(id){spells.push(mkSpell(id));}
function openReward(kind,done){
  const fin=()=>{closePanel();done();};
  if(kind==='spell'){
    const owned=new Set(spells.map(s=>s.id)),offer=shuffle(ALLS.filter(i=>!owned.has(i))).slice(0,3);

    setPanel(`<h2>Learn a spell</h2><div class="row">${offer.map(id=>`<button class="card" data-sp="${id}">${letterIcon(id)}<i style="--c:${CATC[SP[id].cat]}">${SP[id].cat}</i><b>${SP[id].name}</b><span>${SP[id].desc}</span></button>`).join('')}</div>`);

  }else if(kind==='rest'){

  }else if(kind==='shop'){openShop(done);}

function openShop(done){

  for(const k of randomMods(2))offers.push({type:'mod',k,price:rint(16,26)});

      const body=o.type==='mod'?`<i style="--c:var(--frost)">Modifier</i><b>${MODS[o.k].name}</b><span>${MODS[o.k].desc}</span>`:o.type==='spell'?`${letterIcon(o.id)}<b>${SP[o.id].name}</b><span>${SP[o.id].desc}</span>`:`<i style="--c:var(--good)">Remedy</i><b>Healing draught</b><span>Heal 4 hearts</span>`;
      return `<button class="card" data-i="${i}" ${dis?'disabled':''}>${body}<span style="color:var(--gold)">${o.sold?'SOLD':o.price+' stardust'}</span></button>`;}).join('')}</div><button class="btn ghost" id="leave">Leave</button>`);

}

  if(e.hp<e.max&&!e.isBoss){c.fillStyle='#0b0818';c.fillRect(x-r,y-r-5,r*2,2);c.fillStyle='#ff7a6e';c.fillRect(x-r,y-r-5,r*2*Math.max(0,e.hp/e.max),2);}
}
function drawBoss(b){
  const x=Math.round(b.x),y=Math.round(b.y),fl=b.flash>0,col=fl?'#fff':b.col;
  glow(x,y,b.r+26,b.col,.35+.1*Math.sin(t*3));
  c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(x,y+b.r,b.r,5,0,0,TAU);c.fill();
  c.lineWidth=1;c.strokeStyle='#0b0818';
  if(b.kind==='bell'){c.fillStyle=col;c.beginPath();c.moveTo(x-b.r,y+b.r*.7);c.quadraticCurveTo(x-b.r,y-b.r,x,y-b.r);c.quadraticCurveTo(x+b.r,y-b.r,x+b.r,y+b.r*.7);c.closePath();c.fill();c.stroke();c.fillStyle='#0b0818';c.fillRect(x-b.r,y+b.r*.55,b.r*2,3);c.fillStyle='#fff6d0';c.beginPath();c.arc(x,y+b.r*.9+Math.sin(t*2)*2,4,0,TAU);c.fill();c.fillStyle='#0b0818';c.fillRect(x-7,y-4,3,4);c.fillRect(x+4,y-4,3,4);}
  else{for(let i=0;i<8;i++){const a=i/8*TAU+t*.4;c.fillStyle=col;c.beginPath();c.moveTo(x+Math.cos(a)*(b.r+9),y+Math.sin(a)*(b.r+9));c.lineTo(x+Math.cos(a+.2)*b.r,y+Math.sin(a+.2)*b.r);c.lineTo(x+Math.cos(a-.2)*b.r,y+Math.sin(a-.2)*b.r);c.fill();}
    c.fillStyle=col;c.beginPath();c.arc(x,y,b.r,0,TAU);c.fill();c.stroke();c.fillStyle='#2a0f08';c.beginPath();c.arc(x,y,b.r*.62,0,TAU);c.fill();c.fillStyle='#ffd27a';c.beginPath();c.arc(x,y,b.r*.32,0,TAU);c.fill();c.fillStyle='#0b0818';c.fillRect(x-1,y-5,2,10);}
}
function drawPlayer(){
  const x=Math.round(P.x),y=Math.round(P.y);
  glow(x,y-6,20,'#b9a8ff',.22);c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(x,y+6,7,2.5,0,0,TAU);c.fill();
  if(P.shield){glow(x,y-2,16,'#7fe0c0',.45);c.strokeStyle='rgba(127,224,192,.9)';c.lineWidth=1;c.beginPath();c.arc(x,y-1,11,0,TAU);c.stroke();}
  if(P.inv>0&&Math.floor(t*20)%2&&scene==='wave')c.globalAlpha=.4;
  const img=P.moving?IM.walk[P.face][Math.floor(P.step*12)%6]:IM.idle[P.face];
  if(img&&img.complete){c.imageSmoothingEnabled=true;c.drawImage(img,x-27,y-37,54,54);c.imageSmoothingEnabled=false;}
  c.globalAlpha=1;
}
function drawSpellFx(){
  const orb=spells.find(s=>s.id==='orbit');
  const th=spells.find(s=>s.id==='thorns');if(th){const R=32*sArea(th);c.strokeStyle='rgba(143,224,106,.25)';c.lineWidth=1;c.setLineDash([2,3]);c.beginPath();c.arc(P.x,P.y,R,0,TAU);c.stroke();c.setLineDash([]);}
  for(const m of marks){if(m.meteor){const k=1-m.t/.7;c.strokeStyle='rgba(255,154,90,.8)';c.lineWidth=1;c.beginPath();c.arc(m.x,m.y,m.r*k,0,TAU);c.stroke();c.beginPath();c.arc(m.x,m.y,m.r,0,TAU);c.setLineDash([2,3]);c.stroke();c.setLineDash([]);const fy=m.y-(m.t/.7)*110;glow(m.x,fy,10,'#ffb04a',.9);c.fillStyle='#fff6d0';c.fillRect(m.x-1,fy-1,3,3);}
    else{c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=1;c.beginPath();c.arc(m.x,m.y,8*(m.t/.6)+2,0,TAU);c.stroke();}}
  for(const b of blasts){c.strokeStyle=b.col;c.globalAlpha=Math.max(.2,1-b.r/b.max);c.lineWidth=2;c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.stroke();c.globalAlpha=1;}
  for(const r of rings){c.strokeStyle=r.c;c.globalAlpha=Math.max(0,r.t*3);c.lineWidth=1;c.beginPath();c.arc(r.x,r.y,r.r,0,TAU);c.stroke();c.globalAlpha=1;}
  for(const z of zaps){c.strokeStyle='#cfe0ff';c.lineWidth=2;c.globalAlpha=Math.min(1,z.t*8);c.beginPath();z.pts.forEach((p,i)=>{const jx=i?rnd(-2,2):0,jy=i?rnd(-2,2):0;i?c.lineTo(p.x+jx,p.y+jy):c.moveTo(p.x,p.y);});c.stroke();c.globalAlpha=1;}
  for(const s of shots){glow(s.x,s.y,s.r+4,s.col,.5);c.fillStyle=s.col;c.fillRect(Math.round(s.x-s.r),Math.round(s.y-s.r),Math.ceil(s.r*2),Math.ceil(s.r*2));c.fillStyle='#fff';c.fillRect(Math.round(s.x)-1,Math.round(s.y)-1,1,1);}
  if(orb)for(const o of orbitPositions(orb)){glow(o.x,o.y,10,'#e8d8ff',.6);c.fillStyle='#f1e8ff';c.beginPath();c.arc(o.x,o.y,3.4*(1+.12*orb.m.size),0,TAU);c.fill();c.fillStyle='#b9a8e8';c.beginPath();c.arc(o.x+1,o.y,2.4,0,TAU);c.fill();}
  const fa=spells.find(s=>s.id==='familiar');if(fa){const n=1+fa.m.multi;for(let i=0;i<n;i++){const a=fa.ang+i/n*TAU,fx=P.x+Math.cos(a)*30,fy=P.y+Math.sin(a)*22;glow(fx,fy,9,'#ffb4d8',.6);c.fillStyle='#ffd8ec';c.beginPath();c.arc(fx,fy,3,0,TAU);c.fill();c.fillStyle='#0b0818';c.fillRect(fx-1,fy-1,1,1);c.fillRect(fx+1,fy-1,1,1);}}
}
function drawHUD(){
  // hearts
  const hw=70;text('HP',18,18,'#ff9a9a',8,'left',FONT);c.fillStyle='#0b0818';c.fillRect(32,11,hw,8);c.fillStyle='#ff5a6a';c.fillRect(33,12,(hw-2)*P.hp/P.max,6);c.fillStyle='rgba(255,255,255,.25)';c.fillRect(33,12,(hw-2)*P.hp/P.max,2);text(P.hp+'/'+P.max,32+hw/2,18.5,'#fff',7,'center',FONT);
  // wave
  const mid=240;if(boss){const bw=170;c.fillStyle='#0b0818';c.fillRect(mid-bw/2,8,bw,7);c.fillStyle=boss.col;c.fillRect(mid-bw/2+1,9,(bw-2)*Math.max(0,boss.hp/boss.max),5);text(boss.name,mid,21,'#f1e8d4',8,'center',FONT);}
  else{text('REGION '+stage+'/'+(LAYERS+1),mid,15,'#dcb868',9,'center',FONT);if(scene==='wave'){c.fillStyle='#0b0818';c.fillRect(mid-40,18,80,3);c.fillStyle='#dcb868';c.fillRect(mid-40,18,80*Math.max(0,waveT/waveLen),3);}}
  if(guard){const bw=150;c.fillStyle='#0b0818';c.fillRect(mid-bw/2,32,bw,5);c.fillStyle='#ffd27a';c.fillRect(mid-bw/2+1,33,(bw-2)*Math.max(0,guard.hp/guard.max),3);}
  if(twist&&scene==='wave')text(twist.name+'  x'+twist.mult,mid,boss?30:29,'#ffb04a',7,'center',SMALL,500);
  text('✦ '+P.dust,W-18,18,'#dcb868',9,'right',FONT);
  for(let i=0;i<KEYS_NEEDED;i++){const kx=W-18-i*13-8,ky=26;c.fillStyle=i<keysHeld?'#ffd27a':'#2a2145';c.strokeStyle=i<keysHeld?'#fff6d0':'#5a4a82';c.lineWidth=1;c.beginPath();c.arc(kx,ky+3,3,0,TAU);c.fill();c.stroke();c.fillRect(kx-.5,ky+5,1.5,6);c.fillRect(kx,ky+9,3,1.5);}
  // spell bar
  const n=spells.length,sw=22,gap=3,x0=mid-(n*(sw+gap)-gap)/2,y0=H-5-sw;
  spells.forEach((s,i)=>{const x=x0+i*(sw+gap),def=SP[s.id];c.fillStyle='#0b0818';c.fillRect(x-1,y0-1,sw+2,sw+2);c.fillStyle=def.col;c.fillRect(x,y0,sw,sw);c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x,y0,sw,5);
    const cdMax=sCd(s),k=s.id==='ward'?(P.shield?0:s.cd/cdMax):(['orbit','thorns','familiar'].includes(s.id)?0:clamp(s.cd/cdMax,0,1));
    if(k>0){c.fillStyle='rgba(7,4,15,.65)';c.fillRect(x,y0,sw,sw*k);}
    text(def.l,x+sw/2,y0+sw/2+4,'#0b0818',11,'center',FONT);c.fillStyle=CATC[def.cat];c.fillRect(x,y0+sw-2,sw,2);
    let mc=0;for(const k2 in s.m)mc+=s.m[k2];for(let j=0;j<Math.min(mc,8);j++){c.fillStyle='#0b0818';c.fillRect(x+1+j*2.6,y0+1,2,2);c.fillStyle='#fff6d0';c.fillRect(x+1.4+j*2.6,y0+1.4,1.2,1.2);}});
}
function draw(){
  c.save();if(shake>0)c.translate(rnd(-shake,shake)*.4,rnd(-shake,shake)*.4);
  if(!bgc)bgc=makeBg();c.drawImage(bgc,0,0);
  if(scene==='menu'){c.restore();return;}
  // corner pads, dim during waves
  for(const g of gems){glow(g.x,g.y,6,'#ffe9a0',.5);c.fillStyle='#ffe9a0';c.fillRect(Math.round(g.x)-1,Math.round(g.y)-1,3,3);c.fillStyle='#fff';c.fillRect(Math.round(g.x),Math.round(g.y)-1,1,1);}
  const items=[];for(const e of enemies)items.push({y:e.y,f:()=>e.isBoss?drawBoss(e):drawEnemy(e)});items.push({y:P.y,f:drawPlayer});items.sort((a,b)=>a.y-b.y);for(const it of items)it.f();
  drawSpellFx();
  for(const q of eshots){glow(q.x,q.y,q.r+4,q.col,.6);c.fillStyle=q.col;c.beginPath();c.arc(q.x,q.y,q.r,0,TAU);c.fill();c.fillStyle='#fff';c.fillRect(Math.round(q.x)-1,Math.round(q.y)-1,2,2);}
  for(const p of parts){c.fillStyle=p.c;c.globalAlpha=Math.min(1,p.t*3);c.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}c.globalAlpha=1;
  for(const x of texts){c.globalAlpha=Math.min(1,x.t*3);text(x.s,x.x,x.y,x.c,7,'center',SMALL,500);}c.globalAlpha=1;
  c.restore();
  if(scene==='map')drawMap();
  if(flash>0){c.fillStyle='rgba(255,90,100,'+Math.min(.35,flash*2)+')';c.fillRect(0,0,W,H);}
  drawHUD();
  if(bannerT>0){const a=Math.min(1,bannerT*2);c.globalAlpha=a;c.fillStyle='rgba(7,4,15,.6)';c.fillRect(0,100,W,34);text(banner,240,123,'#f1e8d4',16,'center',FONT);c.globalAlpha=1;}
  if(stick.on&&stick.moved){const r=cv.getBoundingClientRect(),k=W/r.width,ox=(stick.ox-r.left)*k,oy=(stick.oy-r.top)*k;c.globalAlpha=.35;c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(ox,oy,22,0,TAU);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(ox+stick.x*22,oy+stick.y*22,8,0,TAU);c.fill();c.globalAlpha=1;}
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=true;});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false;});
cv.addEventListener('pointerdown',e=>{if(stick.id!==null)return;stick.id=e.pointerId;stick.ox=e.clientX;stick.oy=e.clientY;stick.x=stick.y=0;stick.on=true;stick.t0=performance.now();stick.moved=false;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==stick.id)return;let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const l=Math.hypot(dx,dy),R=Math.max(34,innerHeight*.12);if(l>7)stick.moved=true;if(l>R){stick.ox+=dx/l*(l-R);stick.oy+=dy/l*(l-R);dx=dx/l*R;dy=dy/l*R;}stick.x=dx/R;stick.y=dy/R;});
const endStick=e=>{if(e.pointerId!==stick.id)return;
  if(scene==='map'&&!stick.moved&&performance.now()-stick.t0<400){const r=cv.getBoundingClientRect();mapTap((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);}
  stick.id=null;stick.on=false;stick.x=stick.y=0;};
cv.addEventListener('pointerup',endStick);cv.addEventListener('pointercancel',endStick);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- sizing and loop ---------- */
function fit(){const sd=getComputedStyle(document.body),pw=innerWidth-parseFloat(sd.paddingLeft)-parseFloat(sd.paddingRight),ph=innerHeight;box.style.setProperty('--s',Math.max(.5,Math.min(pw/480,ph/270)).toFixed(4));}
addEventListener('resize',fit);fit();
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(frame);}
window.__surv={step:(dt)=>{update(dt);},state:()=>({scene,stage,cur,keysHeld,hp:P&&P.hp,spells:spells&&spells.map(s=>s.id),en:enemies&&enemies.length,E:enemies,ES:eshots,gems,corners,P,twist:twist&&twist.name,stats:stat}),enter:i=>enterNode(map.nodes[i]),next:()=>cur&&cur.next.map(n=>n.id),keys:()=>keysHeld,map:()=>map,newRun,give:id=>addSpell(id),mod:(id,k,n=1)=>{const s=spells.find(q=>q.id===id);for(let i=0;i<n;i++)applyMod(s,k);},bot:(ix,iy)=>{keys.__bx=ix;keys.__by=iy;},skip:()=>{if(scene==='wave'){waveT=0.01;if(boss)boss.hp=1;}}};
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 10px "Pixelify Sans"'),document.fonts.load('400 10px "VT323"')]).catch(()=>{}):Promise.resolve()).then(()=>{showMenu();requestAnimationFrame(frame);});
})();
</script>
