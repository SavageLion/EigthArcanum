<meta charset="utf-8">
<title>Arcanum Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: one landscape canvas (480x270 logical) letterboxed in the viewport, DOM panels laid over it for choices.
   Palette: night indigo, moon bone, star gold, ember red, frost blue. Type: Pixelify Sans for titles, VT323 for small text. */
:root{--bg:#07040f;--panel:#171027;--panel2:#241838;--line:#5a4a82;--ink:#f1e8d4;--dim:#a79bc0;--gold:#dcb868;--ember:#ff7a6e;--frost:#9ad0ff;--good:#7fe0c0;
  --display:"Pixelify Sans","Courier New",monospace;--small:"VT323","Courier New",monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;place-items:center}
#stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
#box{position:relative;--s:1;width:calc(480px*var(--s));height:calc(270px*var(--s))}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0818}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--s)*7px);background:rgba(7,4,15,.82);font-family:var(--display);text-align:center;padding:calc(var(--s)*6px)}
#panel.on{display:flex}
#panel h2{margin:0;font-size:calc(var(--s)*14px);color:var(--gold);letter-spacing:.06em;font-weight:700;text-wrap:balance}
#panel p{margin:0;font-family:var(--small);font-size:calc(var(--s)*10px);color:var(--dim)}
.row{display:flex;gap:calc(var(--s)*6px);justify-content:center;flex-wrap:nowrap;width:100%}
.card{flex:1 1 0;min-width:0;max-width:calc(var(--s)*140px);background:var(--panel);border:2px solid var(--line);color:var(--ink);font-family:var(--display);padding:calc(var(--s)*5px) calc(var(--s)*5px) calc(var(--s)*6px);display:flex;flex-direction:column;gap:calc(var(--s)*3px);align-items:center;cursor:pointer;min-height:calc(var(--s)*74px)}
.card:active,.card:focus-visible{background:var(--panel2);border-color:var(--gold);outline:none}
.card[disabled]{opacity:.4;cursor:default}
.card b{font-size:calc(var(--s)*10px);line-height:1.1;font-weight:700}
.card span{font-family:var(--small);font-size:calc(var(--s)*9px);line-height:1.05;color:var(--dim)}
.card i{font-style:normal;font-family:var(--small);font-size:calc(var(--s)*8px);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--gold))}
.ico{width:calc(var(--s)*16px);height:calc(var(--s)*16px);display:grid;place-items:center;background:var(--c,#555);color:#0b0818;font-weight:700;font-size:calc(var(--s)*10px);border:1px solid #0006}
.card img{width:calc(var(--s)*34px);height:calc(var(--s)*34px);object-fit:contain;image-rendering:pixelated}
.card.eq{border-color:var(--gold);background:var(--panel2)}.card.small{max-width:calc(var(--s)*92px);min-height:calc(var(--s)*54px);opacity:.75}.card.small img{width:calc(var(--s)*22px);height:calc(var(--s)*22px)}
.btn{font-family:var(--display);font-weight:700;font-size:calc(var(--s)*11px);color:#0b0818;background:var(--gold);border:0;padding:calc(var(--s)*5px) calc(var(--s)*14px);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:active{filter:brightness(1.2)}
.card[data-hunt]{border-color:var(--c,var(--line))}
.tag{font-family:var(--small);font-size:calc(var(--s)*9px);color:var(--dim)}
#rotate{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;z-index:9;font-family:var(--display);color:var(--gold);font-size:22px;padding:24px}
@media (orientation:portrait){#rotate{display:grid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div id="stage"><div id="box"><canvas id="cv" width="480" height="270"></canvas><div id="panel"></div></div></div>

/* ---------- waves ---------- */
function spawnGuardian(){
  const hp=effHP(30)*4.2;guard={type:'husk',x:240,y:70,vx:0,vy:0,hp,max:hp,r:15,spd:30,dmg:2,col:'#ffd27a',elite:true,slow:0,burn:0,flash:0,cd:2,st:0,stT:0,ph:0,orbCD:0,gem:14,kb:{x:0,y:0},guardian:true,name:'Key Guardian'};enemies.push(guard);
}
function typeWeights(){
  const w={wisp:5,bat:stage>=2?3:0,husk:stage>=2?2:0,seer:stage>=3?2:0,ram:stage>=4?2:0};
  if(twist){if(twist.weak){w.wisp*=2;w.bat*=2.5;w.husk=0;w.ram=0;}if(twist.heavy){w.husk*=3;w.ram*=3;w.wisp*=.3;w.bat*=.3;}if(twist.seers){w.seer=Math.max(2,w.seer)*4;}}
  return w;
}
function pickType(){const w=typeWeights();let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k;}return 'wisp';}
function queueSpawn(type){
  let x,y,n=0;do{x=rnd(AR.x0+16,AR.x1-16);y=rnd(AR.y0+16,AR.y1-16);const edge=Math.random();if(edge<.7){if(Math.random()<.5)x=Math.random()<.5?AR.x0+14:AR.x1-14;else y=Math.random()<.5?AR.y0+14:AR.y1-14;}}while(Math.hypot(x-P.x,y-P.y)<95&&n++<30);
  marks.push({x,y,t:.6,type});
}
function makeEnemy(type,x,y,elite){
  const d=ENEMIES[type],hp=effHP(d.hp)*(elite?3.2:1);

}
function ringShots(b,n,sp,off,col,r=3){for(let i=0;i<n;i++){const a=off+i/n*TAU;eshots.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r,dmg:1,life:6,col});}}

function spawnBoss(id){
  const d=BOSSES[id],hp=effHP(d.hp)*.55*bossMul;
  boss={kind:id,art:id,x:240,y:70,vx:0,vy:0,hp,max:hp,r:id==='emperor'||id==='devil'?24:20,t:0,cd:2,pat:0,slow:0,burn:0,flash:0,name:d.name,tx:240,ty:70,col:d.col,isBoss:true,kb:{x:0,y:0},ph:0,orbCD:0,type:'boss',dmg:2,dash:0,windup:0};
  enemies.push(boss);
}
function bossAI(b,dt){
  b.t+=dt;b.cd-=dt;const hpf=b.hp/b.max,ph2=hpf<.5;
  if(b.kind==='bell'){
    b.tx=240+Math.sin(b.t*.5)*140;b.ty=64+Math.sin(b.t*.8)*14;
    if(b.cd<=0){b.cd=ph2?2.6:3.6;const m=b.pat++%3;
      if(m===0){const n=ph2?18:12,o=rnd(0,TAU);for(let i=0;i<n;i++){const a=o+i/n*TAU;eshots.push({x:b.x,y:b.y,vx:Math.cos(a)*(58+(ph2?12:0)),vy:Math.sin(a)*(58+(ph2?12:0)),r:3,dmg:1,life:6,col:'#9ad0ff'});}}
      else if(m===1){for(let k=0;k<3;k++)later.push({t:k*.35,fn:()=>{const a=Math.atan2(P.y-b.y,P.x-b.x);for(let i=-2;i<=2;i++)eshots.push({x:b.x,y:b.y,vx:Math.cos(a+i*.17)*85,vy:Math.sin(a+i*.17)*85,r:3,dmg:1,life:6,col:'#cfe0ff'});}});}
      else{for(let i=0;i<(ph2?4:3);i++)queueSpawn('wisp');}
    }
  }else if(b.kind==='storm'){
    if(dist(b,{x:b.tx,y:b.ty})<6||b.t%3.2<.04){b.tx=rnd(110,370);b.ty=rnd(56,120);}
    if(b.cd<=0){b.cd=ph2?1.7:2.4;const m=b.pat++%3;
      if(m===0){for(let k=0;k<3;k++)later.push({t:k*.28,fn:()=>fanShots(b,3,.2,120,'#f0dc55')});}
      else if(m===1){[P.x,P.x-70,P.x+70,P.x-140,P.x+140].slice(0,ph2?5:3).forEach(x=>{x=clamp(x,AR.x0+12,AR.x1-12);zones.push({x:x-9,y:AR.y0,w:18,h:AR.y1-AR.y0,t:0,warn:.9,on:.3,col:'#f0dc55'});});}
      else ringShots(b,ph2?18:12,75,rnd(0,TAU),'#cfe0ff');}
  }else if(b.kind==='frost'){
    b.tx=240+Math.sin(b.t*.4)*150;b.ty=70+Math.sin(b.t*.9)*12;
    if(b.cd<=0){b.cd=ph2?2.2:3;const m=b.pat++%3;
      if(m===0){for(let k=0;k<(ph2?16:12);k++)later.push({t:k*.13,fn:()=>{for(let a=0;a<3;a++){const ang=b.t*2+k*.35+a*TAU/3;eshots.push({x:b.x,y:b.y,vx:Math.cos(ang)*70,vy:Math.sin(ang)*70,r:2.8,dmg:1,life:6,col:'#8fdcf0'});}}});}
      else if(m===1){for(let i=0;i<(ph2?4:3);i++){zones.push({x:clamp(P.x+rnd(-60,60),AR.x0+26,AR.x1-26),y:clamp(P.y+rnd(-40,40),AR.y0+26,AR.y1-26),r:24,t:0,warn:1,on:.4,col:'#8fdcf0'});}}
      else{for(let i=0;i<3;i++)queueSpawn('bat');ringShots(b,10,60,0,'#bfe8ff');}}
  }else if(b.kind==='devil'){
    if(b.dash>0){b.dash-=dt;b.x=clamp(b.x+b.dx*dt,AR.x0+20,AR.x1-20);b.y=clamp(b.y+b.dy*dt,AR.y0+20,AR.y1-30);b.vx=b.vy=0;return;}
    if(b.windup>0){b.windup-=dt;b.vx=b.vy=0;if(b.windup<=0)b.dash=.5;return;}
    b.tx=240+Math.sin(b.t*.5)*120;b.ty=70+Math.sin(b.t)*14;
    if(b.cd<=0){b.cd=ph2?1.5:2.1;const m=b.pat++%4;
      if(m===0){const a=Math.atan2(P.y-b.y,P.x-b.x);b.dx=Math.cos(a)*240;b.dy=Math.sin(a)*240;b.windup=.6;b.cd=1.8;marks.push({x:b.x,y:b.y,t:.6,line:a});}
      else if(m===1)fanShots(b,ph2?11:9,.14,135,'#ff7a6e');
      else if(m===2){ringShots(b,16,80,0,'#e0405a');later.push({t:.4,fn:()=>ringShots(b,16,80,.2,'#e0405a')});}

    if(b.cd<=0){b.cd=ph2?1.5:2.2;const m=b.pat++%4;
      if(m===0){const a=Math.atan2(P.y-b.y,P.x-b.x),n=ph2?9:7;for(let i=0;i<n;i++){const o=(i-(n-1)/2)*.15;eshots.push({x:b.x,y:b.y,vx:Math.cos(a+o)*110,vy:Math.sin(a+o)*110,r:3.2,dmg:1,life:6,col:'#ffb04a'});}}
      else if(m===1){const n=ph2?20:15,o=b.t;for(let i=0;i<n;i++){const a=o+i/n*TAU;eshots.push({x:b.x,y:b.y,vx:Math.cos(a)*78,vy:Math.sin(a)*78,r:3,dmg:1,life:6,col:'#ff7a6e'});}}
      else if(m===2){const gap=rint(2,10);for(let i=0;i<13;i++)if(Math.abs(i-gap)>1)eshots.push({x:AR.x0+14+i*34,y:AR.y0+4,vx:0,vy:80,r:3.2,dmg:1,life:6,col:'#ffd27a'});}

}

/* ---------- damage ---------- */
function hitEnemy(e,dmg,o={}){
  if(e.dead)return;dmg=Math.max(1,dmg);e.hp-=dmg;e.flash=.1;stat.dmg+=dmg;
  if(o.frost||gHit.frost)e.slow=Math.max(e.slow,2);if(o.burn||gHit.burn)e.burn=Math.max(e.burn,3);
  if(o.kx!==undefined&&!e.isBoss){e.kb.x+=o.kx;e.kb.y+=o.ky;}
  texts.push({x:e.x+rnd(-4,4),y:e.y-e.r-2,s:String(Math.round(dmg)),t:.6,c:o.crit?'#ffd27a':'#f1e8d4'});
  for(let i=0;i<2;i++)parts.push({x:e.x,y:e.y,vx:rnd(-40,40),vy:rnd(-40,40),t:.25,c:e.col||'#fff',s:1});
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.dead=true;stat.kills++;
  const n=e.isBoss?18:e.gem,mult=twist?twist.mult:1,tot=Math.max(1,Math.round(n*mult));
  for(let i=0;i<tot;i++)gems.push({x:e.x+rnd(-6,6),y:e.y+rnd(-6,6),vx:rnd(-30,30),vy:rnd(-30,30),v:1,t:0});
  for(let i=0;i<(e.isBoss?40:8);i++)parts.push({x:e.x,y:e.y,vx:rnd(-90,90),vy:rnd(-90,90),t:rnd(.3,.7),c:e.col,s:2});
  rings.push({x:e.x,y:e.y,r:3,max:e.isBoss?60:14,t:.3,c:e.col});
  if(e.guardian){keysHeld++;guard=null;shake=5;clearRoom();}
  if(e.isBoss){shake=8;clearRoom();}
}
function hurtPlayer(d){
  if(P.inv>0||scene!=='wave')return;
  if(P.shield){P.shield=0;P.inv=.7;const w=hasSpell('ward');if(w){w.cd=sCd(w);const a=sArea(w);blasts.push({x:P.x,y:P.y,r:4,max:52*a,spd:170,dmg:sDmg(w,6),hit:new Set(),col:'#7fe0c0',push:1});}shake=3;return;}
  P.hp-=d;P.inv=.9;shake=5;flash=.15;stat.hurt++;
  for(let i=0;i<8;i++)parts.push({x:P.x,y:P.y,vx:rnd(-80,80),vy:rnd(-80,80),t:.4,c:'#ff7a6e',s:1});
  if(P.hp<=0){P.hp=0;scene='dead';showEnd(false);}
}
function nearest(x,y,maxD=240,skip){let b=null,bd=maxD;for(const e of enemies){if(e.dead||(skip&&skip.has(e)))continue;const d=Math.hypot(e.x-x,e.y-y)*(e.isBoss||e.guardian?.5:1);if(d<bd){bd=d;b=e;}}return b;}

/* ---------- spell casting ---------- */
function shotOf(x,y,a,s,o={}){
  const m=s.m;shots.push(Object.assign({x,y,vx:Math.cos(a)*215,vy:Math.sin(a)*215,r:2.3*sArea(s),dmg:sDmg(s,6),pierce:m.pierce*2,bounce:m.bounce,split:m.split,frost:m.frost>0,burn:m.burn>0,hit:new Set(),life:1.3,col:SP[s.id].col},o));
}
function castBolt(s,ox=P.x,oy=P.y,src='p'){
  const tg=nearest(ox,oy,260);if(!tg)return false;const n=1+s.m.multi,a0=Math.atan2(tg.y-oy,tg.x-ox);
  for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.17;shotOf(ox,oy,a,s,src==='f'?{dmg:sDmg(s,3),r:2}:{});}return true;
}
function castNova(s){const n=1+s.m.multi,a=sArea(s);for(let i=0;i<n;i++)later.push({t:i*.28,fn:()=>blasts.push({x:P.x,y:P.y,r:4,max:62*a,spd:150,dmg:sDmg(s,6),hit:new Set(),col:'#9ad0ff',frost:s.m.frost>0,burn:s.m.burn>0,push:.4})});return true;}
function castChain(s){
  const n=1+s.m.multi,used=new Set();let any=false;
  for(let k=0;k<n;k++){let cur=nearest(P.x,P.y,170,used);if(!cur)break;any=true;const pts=[{x:P.x,y:P.y}];let dmg=sDmg(s,6);
    for(let j=0;j<3+s.m.bounce*2&&cur;j++){used.add(cur);pts.push({x:cur.x,y:cur.y});hitEnemy(cur,dmg,{frost:s.m.frost>0,burn:s.m.burn>0});dmg*=.85;cur=nearest(cur.x,cur.y,85,used);}
    zaps.push({pts,t:.18});}
  return any;
}
function castMeteor(s){
  const n=1+s.m.multi;let any=false;
  for(let i=0;i<n;i++){let tg=enemies.filter(e=>!e.dead);tg=tg.length?pick(tg):null;if(!tg)break;any=true;marks.push({x:tg.x+rnd(-8,8),y:tg.y+rnd(-8,8),t:.7,meteor:s,r:24*sArea(s),warn:true});}
  return any;
}
function explodeMeteor(m){
  const s=m.meteor;rings.push({x:m.x,y:m.y,r:3,max:m.r,t:.3,c:'#ff9a5a'});shake=Math.max(shake,2);
  for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-m.x,e.y-m.y)<m.r+e.r)hitEnemy(e,sDmg(s,14),{frost:s.m.frost>0,burn:s.m.burn>0,kx:(e.x-m.x)*.4,ky:(e.y-m.y)*.4});}
  for(let i=0;i<14;i++)parts.push({x:m.x,y:m.y,vx:rnd(-100,100),vy:rnd(-100,100),t:.5,c:'#ffb04a',s:2});
  if(s.m.split)for(let i=0;i<4;i++)shotOf(m.x,m.y,i/4*TAU+.4,s,{dmg:sDmg(s,3),r:1.8,split:0,life:.7});
}
function castBlink(s){
  let thr=null,bd=26;for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<bd+e.r){bd=d;thr=e;}}
  if(!thr){for(const q of eshots){if(Math.hypot(q.x-P.x,q.y-P.y)<14){thr=q;break;}}}
  if(!thr)return false;
  let ax=P.x-thr.x,ay=P.y-thr.y;const l=Math.hypot(ax,ay)||1;ax/=l;ay/=l;

function drawZones(){
  for(const z of zones){const on=z.t>z.warn,a=on?.55:.25+.2*Math.sin(t*20);c.fillStyle=z.col;c.strokeStyle=z.col;c.globalAlpha=on?a:.18;
    if(z.r){c.beginPath();c.arc(z.x,z.y,z.r,0,TAU);c.fill();c.globalAlpha=on?.9:.6;c.lineWidth=1;c.stroke();}else{c.fillRect(z.x,z.y,z.w,z.h);c.globalAlpha=on?.9:.6;c.lineWidth=1;c.strokeRect(z.x+.5,z.y+.5,z.w-1,z.h-1);}c.globalAlpha=1;}
}
function drawMinimap(){
  if(!world)return;const ox=18,oy=26,cs=8;
  for(const c0 of world.cells){const x=ox+c0.x*cs,y=oy+c0.y*cs,known=c0.visited||c0.seen;
    c.fillStyle=!known?'rgba(20,14,40,.55)':c0.visited?(c0.cleared?'#3d3068':'#6a3a2a'):'#2a2145';c.fillRect(x,y,cs-1,cs-1);
    if(known&&c0.kind==='boss'){c.fillStyle='#ff7a6e';c.fillRect(x+3,y+1,2,4);c.fillRect(x+3,y+6,2,1);}
    else if(c0.visited&&c0.kind==='guard'){c.fillStyle='#ffd27a';c.fillRect(x+2,y+2,3,3);}
    else if(c0.visited&&['market','rest','wager'].includes(c0.kind)){c.fillStyle=ROOMK[c0.kind].col;c.fillRect(x+3,y+3,2,2);}
    if(c0.visited)for(const d in c0.link){const n=world.cells[c0.link[d]];if(d==='E'){c.fillStyle='#8f7aa8';c.fillRect(x+cs-1,y+3,1,2);}if(d==='S'){c.fillStyle='#8f7aa8';c.fillRect(x+3,y+cs-1,2,1);}}
    if(c0===room){c.strokeStyle='#fff6d0';c.lineWidth=1;c.strokeRect(x-.5,y-.5,cs,cs);}}
  const b=world.bossCell,dx=b.x-room.x,dy=b.y-room.y,dd=Math.abs(dx)+Math.abs(dy),cx0=ox+GC*cs+14,cy0=oy+13,col=dd<=1?'#ff7a6e':dd<=3?'#ffb04a':'#8fa8ff';
  c.strokeStyle=col;c.lineWidth=1;c.beginPath();c.arc(cx0,cy0,10,0,TAU);c.stroke();
  if(dd){const a=Math.atan2(dy,dx);c.fillStyle=col;c.beginPath();c.moveTo(cx0+Math.cos(a)*8,cy0+Math.sin(a)*8);c.lineTo(cx0+Math.cos(a+2.5)*6,cy0+Math.sin(a+2.5)*6);c.lineTo(cx0+Math.cos(a-2.5)*6,cy0+Math.sin(a-2.5)*6);c.fill();}
  text(dd?dd+(dd===1?' room':' rooms'):'here',cx0,cy0+20,col,8,'center',FONT);
}
function drawPlayer(){
  const x=Math.round(P.x),y=Math.round(P.y);
  glow(x,y-6,20,'#b9a8ff',.22);c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(x,y+6,7,2.5,0,0,TAU);c.fill();
  if(P.shield){glow(x,y-2,16,'#7fe0c0',.45);c.strokeStyle='rgba(127,224,192,.9)';c.lineWidth=1;c.beginPath();c.arc(x,y-1,11,0,TAU);c.stroke();}
  if(P.inv>0&&Math.floor(t*20)%2&&scene==='wave')c.globalAlpha=.4;
  const img=P.moving?IM.walk[P.face][Math.floor(P.step*12)%6]:IM.idle[P.face];
  if(img&&img.complete){c.imageSmoothingEnabled=true;c.drawImage(img,x-27,y-37,54,54);c.imageSmoothingEnabled=false;}
  c.globalAlpha=1;
}
function drawSpellFx(){
  const orb=spells.find(s=>s.id==='orbit');
  const th=spells.find(s=>s.id==='thorns');if(th){const R=32*sArea(th);c.strokeStyle='rgba(143,224,106,.25)';c.lineWidth=1;c.setLineDash([2,3]);c.beginPath();c.arc(P.x,P.y,R,0,TAU);c.stroke();c.setLineDash([]);}
  for(const m of marks){if(m.meteor){const k=1-m.t/.7;c.strokeStyle='rgba(255,154,90,.8)';c.lineWidth=1;c.beginPath();c.arc(m.x,m.y,m.r*k,0,TAU);c.stroke();c.beginPath();c.arc(m.x,m.y,m.r,0,TAU);c.setLineDash([2,3]);c.stroke();c.setLineDash([]);const fy=m.y-(m.t/.7)*110;glow(m.x,fy,10,'#ffb04a',.9);c.fillStyle='#fff6d0';c.fillRect(m.x-1,fy-1,3,3);}
    else if(m.line!==undefined){c.strokeStyle='rgba(255,122,110,'+(.35+.4*Math.sin(t*30))+')';c.lineWidth=3;c.beginPath();c.moveTo(m.x,m.y);c.lineTo(m.x+Math.cos(m.line)*320,m.y+Math.sin(m.line)*320);c.stroke();}
    else{c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=1;c.beginPath();c.arc(m.x,m.y,8*(m.t/.6)+2,0,TAU);c.stroke();}}
  for(const b of blasts){c.strokeStyle=b.col;c.globalAlpha=Math.max(.2,1-b.r/b.max);c.lineWidth=2;c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.stroke();c.globalAlpha=1;}
  for(const r of rings){c.strokeStyle=r.c;c.globalAlpha=Math.max(0,r.t*3);c.lineWidth=1;c.beginPath();c.arc(r.x,r.y,r.r,0,TAU);c.stroke();c.globalAlpha=1;}
  for(const z of zaps){c.strokeStyle='#cfe0ff';c.lineWidth=2;c.globalAlpha=Math.min(1,z.t*8);c.beginPath();z.pts.forEach((p,i)=>{const jx=i?rnd(-2,2):0,jy=i?rnd(-2,2):0;i?c.lineTo(p.x+jx,p.y+jy):c.moveTo(p.x,p.y);});c.stroke();c.globalAlpha=1;}
  for(const s of shots){glow(s.x,s.y,s.r+4,s.col,.5);c.fillStyle=s.col;c.fillRect(Math.round(s.x-s.r),Math.round(s.y-s.r),Math.ceil(s.r*2),Math.ceil(s.r*2));c.fillStyle='#fff';c.fillRect(Math.round(s.x)-1,Math.round(s.y)-1,1,1);}
  if(orb)for(const o of orbitPositions(orb)){glow(o.x,o.y,10,'#e8d8ff',.6);c.fillStyle='#f1e8ff';c.beginPath();c.arc(o.x,o.y,3.4*(1+.12*orb.m.size),0,TAU);c.fill();c.fillStyle='#b9a8e8';c.beginPath();c.arc(o.x+1,o.y,2.4,0,TAU);c.fill();}
  const fa=spells.find(s=>s.id==='familiar');if(fa){const n=1+fa.m.multi;for(let i=0;i<n;i++){const a=fa.ang+i/n*TAU,fx=P.x+Math.cos(a)*30,fy=P.y+Math.sin(a)*22;glow(fx,fy,9,'#ffb4d8',.6);c.fillStyle='#ffd8ec';c.beginPath();c.arc(fx,fy,3,0,TAU);c.fill();c.fillStyle='#0b0818';c.fillRect(fx-1,fy-1,1,1);c.fillRect(fx+1,fy-1,1,1);}}
}
function drawHUD(){
  drawMinimap();
  // hearts
  const hw=70;text('HP',18,18,'#ff9a9a',8,'left',FONT);c.fillStyle='#0b0818';c.fillRect(32,11,hw,8);c.fillStyle='#ff5a6a';c.fillRect(33,12,(hw-2)*P.hp/P.max,6);c.fillStyle='rgba(255,255,255,.25)';c.fillRect(33,12,(hw-2)*P.hp/P.max,2);text(P.hp+'/'+P.max,32+hw/2,18.5,'#fff',7,'center',FONT);
  // wave
  const mid=240;if(boss){const bw=170;c.fillStyle='#0b0818';c.fillRect(mid-bw/2,8,bw,7);c.fillStyle=boss.col;c.fillRect(mid-bw/2+1,9,(bw-2)*Math.max(0,boss.hp/boss.max),5);text(boss.name,mid,21,'#f1e8d4',8,'center',FONT);}
  else{text(locked?(room.kind==='guard'?'KEY GUARDIAN':'AMBUSH'):'HUNTING: '+hunting.name.toUpperCase(),mid,15,'#dcb868',9,'center',FONT);if(locked){c.fillStyle='#0b0818';c.fillRect(mid-40,18,80,3);c.fillStyle='#dcb868';c.fillRect(mid-40,18,80*Math.max(0,waveT/waveLen),3);}}
  if(guard){const bw=150;c.fillStyle='#0b0818';c.fillRect(mid-bw/2,32,bw,5);c.fillStyle='#ffd27a';c.fillRect(mid-bw/2+1,33,(bw-2)*Math.max(0,guard.hp/guard.max),3);}
  if(twist&&scene==='wave')text(twist.name+'  x'+twist.mult,mid,boss?30:29,'#ffb04a',7,'center',SMALL,500);
  text('✦ '+P.dust,W-18,18,'#dcb868',9,'right',FONT);
  for(let i=0;i<KEYS_NEEDED;i++){const kx=W-18-i*13-8,ky=26;c.fillStyle=i<keysHeld?'#ffd27a':'#2a2145';c.strokeStyle=i<keysHeld?'#fff6d0':'#5a4a82';c.lineWidth=1;c.beginPath();c.arc(kx,ky+3,3,0,TAU);c.fill();c.stroke();c.fillRect(kx-.5,ky+5,1.5,6);c.fillRect(kx,ky+9,3,1.5);}
  // spell bar
  const n=spells.length,sw=22,gap=3,x0=mid-(n*(sw+gap)-gap)/2,y0=H-5-sw;
  spells.forEach((s,i)=>{const x=x0+i*(sw+gap),def=SP[s.id];c.fillStyle='#0b0818';c.fillRect(x-1,y0-1,sw+2,sw+2);c.fillStyle=def.col;c.fillRect(x,y0,sw,sw);c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x,y0,sw,5);
    const cdMax=sCd(s),k=s.id==='ward'?(P.shield?0:s.cd/cdMax):(['orbit','thorns','familiar'].includes(s.id)?0:clamp(s.cd/cdMax,0,1));
    if(k>0){c.fillStyle='rgba(7,4,15,.65)';c.fillRect(x,y0,sw,sw*k);}
    text(def.l,x+sw/2,y0+sw/2+4,'#0b0818',11,'center',FONT);c.fillStyle=CATC[def.cat];c.fillRect(x,y0+sw-2,sw,2);
    let mc=0;for(const k2 in s.m)mc+=s.m[k2];for(let j=0;j<Math.min(mc,8);j++){c.fillStyle='#0b0818';c.fillRect(x+1+j*2.6,y0+1,2,2);c.fillStyle='#fff6d0';c.fillRect(x+1.4+j*2.6,y0+1.4,1.2,1.2);}});
}
function draw(){
  c.save();if(shake>0)c.translate(rnd(-shake,shake)*.4,rnd(-shake,shake)*.4);
  if(!bgc)bgc=makeBg();c.drawImage(bgc,0,0);
  if(scene==='menu'||scene==='sanctum'){c.restore();return;}
  drawRoom();drawZones();
  for(const g of gems){glow(g.x,g.y,6,'#ffe9a0',.5);c.fillStyle='#ffe9a0';c.fillRect(Math.round(g.x)-1,Math.round(g.y)-1,3,3);c.fillStyle='#fff';c.fillRect(Math.round(g.x),Math.round(g.y)-1,1,1);}
  const items=[];for(const e of enemies)items.push({y:e.y,f:()=>e.isBoss?drawBoss(e):drawEnemy(e)});items.push({y:P.y,f:drawPlayer});items.sort((a,b)=>a.y-b.y);for(const it of items)it.f();
  drawSpellFx();
  for(const q of eshots){glow(q.x,q.y,q.r+4,q.col,.6);c.fillStyle=q.col;c.beginPath();c.arc(q.x,q.y,q.r,0,TAU);c.fill();c.fillStyle='#fff';c.fillRect(Math.round(q.x)-1,Math.round(q.y)-1,2,2);}
  for(const p of parts){c.fillStyle=p.c;c.globalAlpha=Math.min(1,p.t*3);c.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}c.globalAlpha=1;
  for(const x of texts){c.globalAlpha=Math.min(1,x.t*3);text(x.s,x.x,x.y,x.c,7,'center',SMALL,500);}c.globalAlpha=1;
  c.restore();
  if(dark>0){c.fillStyle='rgba(10,0,24,'+Math.min(.45,dark*.09)+')';c.fillRect(0,0,W,H);}
  if(fade>0){c.fillStyle='rgba(7,4,15,'+Math.min(1,fade/.35)+')';c.fillRect(0,0,W,H);}
  if(flash>0){c.fillStyle='rgba(255,90,100,'+Math.min(.35,flash*2)+')';c.fillRect(0,0,W,H);}
  drawHUD();
  if(bannerT>0){const a=Math.min(1,bannerT*2);c.globalAlpha=a;c.fillStyle='rgba(7,4,15,.6)';c.fillRect(0,100,W,34);text(banner,240,123,'#f1e8d4',16,'center',FONT);c.globalAlpha=1;}
  if(stick.on&&stick.moved){const r=cv.getBoundingClientRect(),k=W/r.width,ox=(stick.ox-r.left)*k,oy=(stick.oy-r.top)*k;c.globalAlpha=.35;c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(ox,oy,22,0,TAU);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(ox+stick.x*22,oy+stick.y*22,8,0,TAU);c.fill();c.globalAlpha=1;}
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=true;});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false;});
cv.addEventListener('pointerdown',e=>{if(stick.id!==null)return;stick.id=e.pointerId;stick.ox=e.clientX;stick.oy=e.clientY;stick.x=stick.y=0;stick.on=true;stick.t0=performance.now();stick.moved=false;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==stick.id)return;let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const l=Math.hypot(dx,dy),R=Math.max(34,innerHeight*.12);if(l>7)stick.moved=true;if(l>R){stick.ox+=dx/l*(l-R);stick.oy+=dy/l*(l-R);dx=dx/l*R;dy=dy/l*R;}stick.x=dx/R;stick.y=dy/R;});
const endStick=e=>{if(e.pointerId!==stick.id)return;
  stick.id=null;stick.on=false;stick.x=stick.y=0;};
cv.addEventListener('pointerup',endStick);cv.addEventListener('pointercancel',endStick);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- sizing and loop ---------- */
function fit(){const sd=getComputedStyle(document.body),pw=innerWidth-parseFloat(sd.paddingLeft)-parseFloat(sd.paddingRight),ph=innerHeight;box.style.setProperty('--s',Math.max(.5,Math.min(pw/480,ph/270)).toFixed(4));}
addEventListener('resize',fit);fit();
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(frame);}
window.__hunt={enter:id=>{const n=world.cells[id];n.unsealed=true;enterRoom(n,null);},step:dt=>{update(dt);},start:id=>startHunt(id),state:()=>({scene,locked,stage,hp:P&&P.hp,max:P&&P.max,spells:spells&&spells.map(s=>s.id),E:enemies,ES:eshots,P,room,world,keys:keysHeld,dark,stats:stat,hunting:hunting&&hunting.id,dust:P&&P.dust}),bot:(ix,iy)=>{keys.__bx=ix;keys.__by=iy;},go:d=>tryGo(d),give:id=>addSpell(id),mod:(id,k,n=1)=>{const s=spells.find(q=>q.id===id);for(let i=0;i<n;i++)applyMod(s,k);},skip:()=>{if(locked){waveT=0.01;if(boss)boss.hp=1;}},meta:()=>meta,sanctum:()=>showSanctum(),setKeys:n=>{keysHeld=n;}};
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 10px "Pixelify Sans"'),document.fonts.load('400 10px "VT323"')]).catch(()=>{}):Promise.resolve()).then(()=>{loadMeta();showSanctum();requestAnimationFrame(frame);});
})();
</script>
