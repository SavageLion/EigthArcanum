  if(!DISH[key]){const pair=[ka,kb].sort().join('_');DISH[key]={n:FUSION[pair]||(A.n+'-'+B.n),col:A.col,cd:(A.cd+B.cd)/2,dmg:(A.dmg+B.dmg)*.72,spd:(A.spd+B.spd)/2,n0:Math.max(A.n0,B.n0),spread:A.spread||B.spread,pierce:Math.max(A.pierce||0,B.pierce||0),boom:A.boom||B.boom,lob:(A.lob||B.lob)&&!(A.boom||B.boom)?1:0,splash:A.splash||B.splash,parts:[ka,kb],desc:'A fusion of '+A.n+' and '+B.n+'.'};}

}

  else if(scene==='mechanic'&&sceneT>.2){for(const u of UPG){const p=upgPrice(u);if(RUN.car[u.id]<u.max&&RUN.cash>=p){RUN.cash-=p;RUN.car[u.id]++;u.fn();}}resumeTrip();}
  else if(scene==='gas'&&sceneT>.2){const amt=Math.ceil(RUN.fuelMax-RUN.fuel),price=Math.ceil(amt*gasPrice());if(RUN.cash>=price){RUN.cash-=price;RUN.fuel=RUN.fuelMax;}else{const a2=Math.floor(RUN.cash/gasPrice());RUN.fuel=Math.min(RUN.fuelMax,RUN.fuel+a2);RUN.cash-=Math.ceil(a2*gasPrice());}resumeTrip();}

  else if(scene==='over'||scene==='win'){scene='title';}
  else if(scene==='trip'){const L=S.trip;let want=1,tgt=null;
    for(const seg of L.segs){if(seg.used)continue;const dx=seg.x-L.x;if(dx>-170&&dx<900){const want2=RUN.fuel<55?'gas':RUN.cash>60?'mechanic':'shift';tgt=seg.exits.find(e=>e.type===want2)||seg.exits.find(e=>e.type==='shift')||seg.exits.find(e=>e.type==='cook')||(RUN.fuel<30||L.ins.on?seg.exits[Math.floor(Math.random()*seg.exits.length)]:null);if(tgt)break;}}
    const lanes=[0,1,2].map(i=>{let nearest=1e9;for(const c2 of L.cars)if(c2.lane===i&&c2.x>L.x-30&&c2.x<L.x+260)nearest=Math.min(nearest,c2.x-L.x);return nearest;});let best=0;lanes.forEach((v,i)=>{if(v>lanes[best])best=i;});const cur=Math.round((L.y-ROAD.top-ROAD.lane/2)/ROAD.lane);let ty=LANEY(clamp(lanes[cur]<120?best:cur,0,2));
    if(tgt&&tgt.x-L.x<420&&tgt.x-L.x>-160)ty=tgt.side==='top'?30:240;
    KEYS.u=L.y>ty+6?1:0;KEYS.d=L.y<ty-6?1:0;KEYS.r=1;KEYS.l=0;}
  else if(scene==='shift'){const tr=S.truck;let n=null,bd=1e9;for(const e of S.E){if(e.state==='fed')continue;const d=Math.hypot(e.x-tr.x,e.y-tr.y);if(d<bd){bd=d;n=e;}}KEYS.l=KEYS.r=KEYS.u=KEYS.d=0;if(n&&bd<90){KEYS.l=n.x>tr.x?1:0;KEYS.r=n.x<tr.x?1:0;KEYS.u=n.y>tr.y?1:0;KEYS.d=n.y<tr.y?1:0;}else{KEYS.l=tr.x>S.arena.AW/2+20?1:0;KEYS.r=tr.x<S.arena.AW/2-20?1:0;KEYS.u=tr.y>S.arena.AH/2+20?1:0;KEYS.d=tr.y<S.arena.AH/2-20?1:0;}}
}
function update(dt){
  t+=dt;sceneT+=dt;if(paused)return;autoplay(dt);
  if(scene==='trip')updateTrip(dt);else if(scene==='shift')updateShift(dt);else if(scene==='kitchen'||scene==='mechanic'||scene==='gas'||scene==='tow'){}
}
function render(){
  HIT.length=0;c.setTransform(SC,0,0,SC,0,0);c.imageSmoothingEnabled=false;
  if(scene==='title')titleScene();else if(scene==='trip')drawTrip();else if(scene==='kitchen')kitchenScene();else if(scene==='mechanic')mechanicScene();else if(scene==='gas')gasScene();else if(scene==='tow')towScene();else if(scene==='shift')drawShift();else if(scene==='levelup')levelScene();else if(scene==='results')resultsScene();else if(scene==='over')endScene(false);else if(scene==='win')endScene(true);
  if(paused)pauseLayer();
}
let last=0;function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;try{update(dt);render();}catch(e){if(!frame.t||now-frame.t>2000){frame.t=now;console.error('frame error',e);}}requestAnimationFrame(frame);}requestAnimationFrame(n=>{last=n;frame(n);});
/* ---------- input ---------- */
cvs.addEventListener('pointerdown',e=>{try{cvs.setPointerCapture(e.pointerId);}catch(_){}const p=pt(e);
  for(let i=HIT.length-1;i>=0;i--){const b=HIT[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}}
  if((scene==='trip'||scene==='shift')&&!paused&&!J.on&&p.x<LW*.62){J={on:true,id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};}});
cvs.addEventListener('pointermove',e=>{if(J.on&&e.pointerId===J.id){const p=pt(e);J.x=p.x;J.y=p.y;}});
const up=e=>{if(J.on&&e.pointerId===J.id)J={on:false,id:-1,ox:0,oy:0,x:0,y:0};};cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);cvs.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')KEYS.l=1;if(k==='ArrowRight'||k==='d')KEYS.r=1;if(k==='ArrowUp'||k==='w')KEYS.u=1;if(k==='ArrowDown'||k==='s')KEYS.d=1;if(k==='p'||k==='Escape')paused=!paused;if(k==='f')toggleFS();
  if(scene==='levelup'&&'123'.includes(k)){const o=S.offers[+k-1];if(o){o.fn();scene='shift';}}if(scene==='title'&&(k==='Enter'||k===' ')){newRun(sel);startTrip();}});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')KEYS.l=0;if(k==='ArrowRight'||k==='d')KEYS.r=0;if(k==='ArrowUp'||k==='w')KEYS.u=0;if(k==='ArrowDown'||k==='s')KEYS.d=0;});
window.__ft={step:dt=>update(dt),render,state:()=>({scene,RUN,S,BEST}),auto:v=>{AUTO=v;},rot:()=>ROT,newRun,startTrip,resumeTrip,beginLeg,startShift,stop:ty=>{if(!S.trip)beginLeg();S.trip.resumeX=S.trip.resumeX||300;enterStop({},{x:100,type:ty,venue:'beach'});},pick:i=>{const o=S.offers[i];if(o){o.fn();scene='shift';}},goto:s=>{scene=s;},setKey:(k,v)=>{KEYS[k]=v;}};
})();
