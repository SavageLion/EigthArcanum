/* HOT & HANGRY: a food truck roguelike for phones, forced landscape.
   Drive around town for a parking spot, then survive the lunch rush by firing food out of your truck at hungry customers. Feed them to earn tips and levels.
   Dishes (burger, hot dog, taco, pizza, ice cream) gain projectiles; flavours (spicy, frozen, sour, sweet, greasy) change what the food does; recipes unlock at level 3.
   Spicy food sets customers on fire (and heats your kitchen!). Five shifts, the last one is a food critic. One self-contained file. */

const hash=(a,b)=>{let h=(Math.imul(a|0,374761393)^Math.imul(b|0,668265263))>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return ((h^(h>>>16))>>>0)/4294967296;};
let audioCtx=null,MUTED=false;try{MUTED=localStorage.getItem('hh-mute')==='1';}catch(e){}
function beep(f,d=.06,type='square',v=.03,sl=0){try{if(MUTED)return;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,audioCtx.currentTime);if(sl)o.frequency.linearRampToValueAtTime(f+sl,audioCtx.currentTime+d);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}

const IM={};
function load(name,src){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const q=cv.getContext('2d');q.drawImage(im,0,0);const d=q.getImageData(0,0,im.width,im.height).data;let x0=im.width,y0=im.height,x1=0,y1=0;for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++)if(d[(y*im.width+x)*4+3]>40){if(x<x0)x0=x;if(x+1>x1)x1=x+1;if(y<y0)y0=y;if(y+1>y1)y1=y+1;}IM[name]={im,bb:x1>x0?{x0,y0,x1,y1}:{x0:0,y0:0,x1:im.width,y1:im.height}};};im.src=src;}

function spr(name,x,y,h,flip,alpha,flash){const o=IM[name];if(!o)return;const bb=o.bb,bw=bb.x1-bb.x0,bh=bb.y1-bb.y0,w=h*bw/bh;c.save();c.globalAlpha=alpha==null?1:alpha;c.translate(x,y);if(flip)c.scale(-1,1);c.drawImage(o.im,bb.x0,bb.y0,bw,bh,-w/2,-h,w,h);if(flash>0){c.globalCompositeOperation='lighter';c.globalAlpha=flash;c.drawImage(o.im,bb.x0,bb.y0,bw,bh,-w/2,-h,w,h);}c.restore();}

function wrap(s,n){const w=String(s).split(' '),L=[];let l='';for(const x of w){if((l+' '+x).trim().length>n){L.push(l);l=x;}else l=(l+' '+x).trim();}if(l)L.push(l);return L;}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

  const m=[.213+cs*.787-sn*.213,.715-cs*.715-sn*.715,.072-cs*.072+sn*.928,.213-cs*.213+sn*.143,.715+cs*.285+sn*.14,.072-cs*.072-sn*.283,.213-cs*.213-sn*.787,.715-cs*.715+sn*.715,.072+cs*.928+sn*.072];
  for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b2=px[i+2];px[i]=clamp((r*m[0]+g*m[1]+b2*m[2])*bri,0,255);px[i+1]=clamp((r*m[3]+g*m[4]+b2*m[5])*bri,0,255);px[i+2]=clamp((r*m[6]+g*m[7]+b2*m[8])*bri,0,255);}

function hueCanvas(im,deg,bri){const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const q=cv.getContext('2d');q.drawImage(im,0,0);const d=q.getImageData(0,0,cv.width,cv.height),px=d.data,a=deg*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a);
  const m=[.213+cs*.787-sn*.213,.715-cs*.715-sn*.715,.072-cs*.072+sn*.928,.213-cs*.213+sn*.143,.715+cs*.285+sn*.14,.072-cs*.072-sn*.283,.213-cs*.213-sn*.787,.715-cs*.715+sn*.715,.072+cs*.928+sn*.072];
  for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b2=px[i+2];px[i]=clamp((r*m[0]+g*m[1]+b2*m[2])*bri,0,255);px[i+1]=clamp((r*m[3]+g*m[4]+b2*m[5])*bri,0,255);px[i+2]=clamp((r*m[6]+g*m[7]+b2*m[8])*bri,0,255);}
  q.putImageData(d,0,0);return cv;}
function tinted(key,im,deg,bri){if(!deg&&(!bri||bri===1))return im;const k=key+'|'+deg+'|'+bri;if(!TINT[k]){try{TINT[k]=hueCanvas(im,deg,bri||1);}catch(e){TINT[k]=im;}}return TINT[k];}
// animated top-down sprite: size = drawn height, ph = phase, spd = frames per second (0 = ph is the frame)
function drawAnim(n,x,y,size,ph,spd,rot,deg,bri,flash){const a=AN[n];if(!a)return false;const f=((Math.floor(spd?t*spd+ph:ph)%9)+9)%9,src=tinted(n,a.im,deg||0,bri||1),s=size/a.fh,w=a.fw*s,h=a.fh*s;
  c.save();c.translate(x,y);if(rot)c.rotate(rot);c.drawImage(src,f*a.fw,a.fh,a.fw,a.fh,-w/2,-h/2,w,h);if(flash>0){c.globalCompositeOperation='lighter';c.globalAlpha=flash;c.drawImage(src,f*a.fw,a.fh,a.fw,a.fh,-w/2,-h/2,w,h);}c.restore();return true;}
function drawImg(n,x,y,w,h,rot,deg,flash){const im=IMG[n];if(!im)return false;const src=tinted(n,im,deg||0,1);c.save();c.translate(x,y);if(rot)c.rotate(rot);c.drawImage(src,-w/2,-h/2,w,h);if(flash>0){c.globalCompositeOperation='lighter';c.globalAlpha=flash;c.drawImage(src,-w/2,-h/2,w,h);}c.restore();return true;}

/* ---------- input ---------- */
cvs.addEventListener('pointerdown',e=>{try{cvs.setPointerCapture(e.pointerId);}catch(_){}const p=pt(e);
  for(let i=HIT.length-1;i>=0;i--){const b=HIT[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn(e.pointerId,p);return;}}
  if(scene==='city'&&!paused&&!S.bigmap&&!J.on){const gh=Math.hypot(p.x-64,p.y-206)<50;J={on:true,id:e.pointerId,ox:gh?64:p.x,oy:gh?206:p.y,x:p.x,y:p.y};}
  else if(scene==='shift'&&!paused){S.tap={x:p.x,y:p.y};}});
cvs.addEventListener('pointermove',e=>{if(J.on&&e.pointerId===J.id){const p=pt(e);J.x=p.x;J.y=p.y;}if(DRAG.on&&e.pointerId===DRAG.id){const p=pt(e);DRAG.x=p.x;DRAG.y=p.y;}});
const up=e=>{if(J.on&&e.pointerId===J.id)J={on:false,id:-1,ox:0,oy:0,x:0,y:0};if(DRAG.on&&e.pointerId===DRAG.id){DRAG.on=false;if(scene==='shift'&&!paused){if(Math.hypot(DRAG.x-DRAG.sx,DRAG.y-DRAG.sy)>14)throwDish(DRAG.ds,DRAG.x,DRAG.y-8);else S.cookTog=DRAG.ds;}}};cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);cvs.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')KEYS.l=1;if(k==='ArrowRight'||k==='d')KEYS.r=1;if(k==='ArrowUp'||k==='w')KEYS.u=1;if(k==='ArrowDown'||k==='s')KEYS.d=1;if(k==='p'||k==='Escape')paused=!paused;if(k==='f')toggleFS();
  if(scene==='levelup'&&'123'.includes(k)){const o=S.offers[+k-1];if(o){o.fn();scene=S.levelBack||'shift';}}if(scene==='title'&&(k==='Enter'||k===' ')){newRun(sel);S.stageFrom='title';scene='stages';}});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')KEYS.l=0;if(k==='ArrowRight'||k==='d')KEYS.r=0;if(k==='ArrowUp'||k==='w')KEYS.u=0;if(k==='ArrowDown'||k==='s')KEYS.d=0;});
window.__ft={step:dt=>update(dt),render,state:()=>({scene,RUN,S,BEST}),auto:v=>{AUTO=v;},rot:()=>ROT,newRun,startTrip,beginStage,resumeTrip,beginLeg,startShift,stop:ty=>{if(!S.city)beginLeg();enterStop({type:ty,venue:'beach'});},aim:(x,y)=>{S.tap={x,y};},pick:i=>{const o=S.offers[i];if(o){o.fn();scene=S.levelBack||'shift';}},goto:s=>{scene=s;},setKey:(k,v)=>{KEYS[k]=v;}};
})();
