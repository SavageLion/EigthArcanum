  TRUCKS.forEach((T,i)=>{const w=150,x=LW/2-w-8+i*(w+16),y=70,on=sel===i;HIT.push({x,y,w,h:112,fn:()=>{sel=i;beep(600,.04,'triangle');}});panel(x,y,w,112,on?'#ffd24a':'#6a5a6a',.9);spr(T.spr,x+w/2,y+58,52);text(T.n,x+w/2,y+74,on?'#fff':'#c8b8c8',9,'center');wrap(T.desc,28).slice(0,3).forEach((q,j)=>text(q,x+w/2,y+86+j*9,'#d8c8b0',6.4,'center',500));});
  btn(LW/2-70,192,140,34,'START THE SHIFT',()=>{newRun(sel);startDrive();beep(660,.15,'triangle',.05);},{main:true,sz:10});
  text(`Best run: ${BEST.shifts} shifts, ${BEST.fed} fed`,LW/2,244,'#ffe9a8',7,'center',500);
  text('Drag the left side to drive. Your truck fires on its own.',LW/2,258,'#d8c0c8',6.6,'center',500);
  btn(LW-34,6,28,16,MUTED?'mute':'snd',()=>{MUTED=!MUTED;try{localStorage.setItem('hh-mute',MUTED?'1':'0');}catch(e){}},{sz:6.5});btn(LW-70,6,32,16,'full',toggleFS,{sz:6.5});
}
function endScene(win){
  c.fillStyle='#120c14';c.fillRect(0,0,LW,LH);const g=c.createLinearGradient(0,0,0,LH);g.addColorStop(0,win?'#40306a':'#4a1a1a');g.addColorStop(1,'#120c14');c.fillStyle=g;c.fillRect(0,0,LW,LH);
  text(win?'FIVE STARS!':'SHUT DOWN',LW/2,48,win?'#ffd24a':'#ff6a5a',26,'center');
  text(win?'The Food Critic loved it. The whole town queues up for your truck.':(S.loseWhy||(RUN.hp<=0?'The health inspector closed the truck.':'Closed for business.')),LW/2,66,'#e8d8c0',8,'center',500);
  text(`Shifts survived ${RUN.shift+(win?1:0)} of 5     Customers fed ${RUN.fed}     Level ${RUN.lv}`,LW/2,94,'#fff',9,'center');
  const names=RUN.dishes.map(d=>DISH[d.k].n+(d.recipe?` (${d.recipe})`:'')+' Lv '+d.lv+(d.fl.length?'  '+d.fl.map(f=>FLAV[f].n).join('+'):''));
  text('YOUR MENU',LW/2,118,'#ffb84a',8,'center');names.forEach((n,i)=>text(n,LW/2,132+i*11,'#e8d8c0',7.4,'center',500));
  text(RUN.relics.length?'Relics: '+RUN.relics.map(id=>RELICS.find(r=>r.id===id).t).join(', '):'No relics',LW/2,184,'#e0b8ff',7,'center',500);
  btn(LW/2-70,206,140,32,'TRY AGAIN',()=>{scene='title';sceneT=0;},{main:true,sz:10});
}
function toggleFS(){const d=document,el=d.documentElement;try{if(!d.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen).call(el).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}else d.exitFullscreen();}catch(e){}}
function pauseLayer(){c.fillStyle='rgba(8,4,14,.8)';c.fillRect(0,0,LW,LH);HIT.length=0;text('PAUSED',LW/2,100,'#ffd24a',18,'center');btn(LW/2-60,118,120,28,'Resume',()=>{paused=false;},{main:true});btn(LW/2-60,154,120,24,'Quit run',()=>{paused=false;scene='title';},{sz:8});}
/* ---------- loop ---------- */
function autoplay(dt){
  if(!AUTO)return;
  if(scene==='title'){newRun(Math.random()<.5?0:1);startDrive();}
  else if(scene==='levelup'&&sceneT>.15){const o=S.offers[Math.floor(Math.random()*S.offers.length)];o.fn();scene='shift';}
  else if(scene==='results'&&sceneT>.2){const aff=S.shop.filter(s=>!s.sold&&RUN.cash>=s.price);if(aff.length){const s=aff[0];RUN.cash-=s.price;s.sold=true;s.o.fn();}if(!S.relicTaken){const r=S.relicOffers[0];S.relicTaken=true;RUN.relics.push(r.id);r.fn(RUN);}startDrive();}
  else if(scene==='over'||scene==='win'){scene='title';}
  else if(scene==='drive'){const w=S.world,tr=S.truck;let b=null,bd=1e9;for(const s of w.spots){const d=Math.hypot(s.x-tr.x,s.y-tr.y);if(d<bd){bd=d;b=s;}}const dx=b.x-tr.x,dy=b.y-tr.y,l=Math.hypot(dx,dy)||1;KEYS.l=dx<-6?1:0;KEYS.r=dx>6?1:0;KEYS.u=dy<-6?1:0;KEYS.d=dy>6?1:0;if(l<8){KEYS.l=KEYS.r=KEYS.u=KEYS.d=0;}}
  else if(scene==='shift'){const tr=S.truck;let n=null,bd=1e9;for(const e of S.E){if(e.state==='fed')continue;const d=Math.hypot(e.x-tr.x,e.y-tr.y);if(d<bd){bd=d;n=e;}}KEYS.l=KEYS.r=KEYS.u=KEYS.d=0;if(n&&bd<90){KEYS.l=n.x>tr.x?1:0;KEYS.r=n.x<tr.x?1:0;KEYS.u=n.y>tr.y?1:0;KEYS.d=n.y<tr.y?1:0;}else{KEYS.l=tr.x>S.arena.AW/2+20?1:0;KEYS.r=tr.x<S.arena.AW/2-20?1:0;KEYS.u=tr.y>S.arena.AH/2+20?1:0;KEYS.d=tr.y<S.arena.AH/2-20?1:0;}}
}
function update(dt){
  t+=dt;sceneT+=dt;if(paused)return;autoplay(dt);
  if(scene==='drive')updateDrive(dt);else if(scene==='shift')updateShift(dt);
}
function render(){
  HIT.length=0;c.setTransform(SC,0,0,SC,0,0);c.imageSmoothingEnabled=false;
  if(scene==='title')titleScene();else if(scene==='drive')drawDrive();else if(scene==='shift')drawShift();else if(scene==='levelup')levelScene();else if(scene==='results')resultsScene();else if(scene==='over')endScene(false);else if(scene==='win')endScene(true);
  if(paused)pauseLayer();
}
let last=0;function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;try{update(dt);render();}catch(e){if(!frame.t||now-frame.t>2000){frame.t=now;console.error('frame error',e);}}requestAnimationFrame(frame);}requestAnimationFrame(n=>{last=n;frame(n);});
/* ---------- input ---------- */
cvs.addEventListener('pointerdown',e=>{try{cvs.setPointerCapture(e.pointerId);}catch(_){}const p=pt(e);
  for(let i=HIT.length-1;i>=0;i--){const b=HIT[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}}
  if((scene==='drive'||scene==='shift')&&!paused&&!J.on&&p.x<LW*.62){J={on:true,id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};}});
cvs.addEventListener('pointermove',e=>{if(J.on&&e.pointerId===J.id){const p=pt(e);J.x=p.x;J.y=p.y;}});
const up=e=>{if(J.on&&e.pointerId===J.id)J={on:false,id:-1,ox:0,oy:0,x:0,y:0};};cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);cvs.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')KEYS.l=1;if(k==='ArrowRight'||k==='d')KEYS.r=1;if(k==='ArrowUp'||k==='w')KEYS.u=1;if(k==='ArrowDown'||k==='s')KEYS.d=1;if(k==='p'||k==='Escape')paused=!paused;if(k==='f')toggleFS();
  if(scene==='levelup'&&'123'.includes(k)){const o=S.offers[+k-1];if(o){o.fn();scene='shift';}}if(scene==='title'&&(k==='Enter'||k===' ')){newRun(sel);startDrive();}});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')KEYS.l=0;if(k==='ArrowRight'||k==='d')KEYS.r=0;if(k==='ArrowUp'||k==='w')KEYS.u=0;if(k==='ArrowDown'||k==='s')KEYS.d=0;});
window.__ft={step:dt=>update(dt),render,state:()=>({scene,RUN,S,BEST}),auto:v=>{AUTO=v;},rot:()=>ROT,newRun,startDrive,startShift,pick:i=>{const o=S.offers[i];if(o){o.fn();scene='shift';}},goto:s=>{scene=s;},setKey:(k,v)=>{KEYS[k]=v;}};
})();
</script>
