  btn(LW/2-70,192,140,34,'START THE SHIFT',()=>{newRun(sel);startTrip();beep(660,.15,'triangle',.05);},{main:true,sz:10});
  text(`Best run: ${BEST.shifts} shifts, ${BEST.fed} fed`,LW/2,244,'#ffe9a8',7,'center',500);
  text('Drag the left side to drive. Your truck fires on its own.',LW/2,258,'#d8c0c8',6.6,'center',500);
  btn(LW-34,6,28,16,MUTED?'mute':'snd',()=>{MUTED=!MUTED;try{localStorage.setItem('hh-mute',MUTED?'1':'0');}catch(e){}},{sz:6.5});btn(LW-70,6,32,16,'full',toggleFS,{sz:6.5});
}
function endScene(win){
  c.fillStyle='#120c14';c.fillRect(0,0,LW,LH);const g=c.createLinearGradient(0,0,0,LH);g.addColorStop(0,win?'#40306a':'#4a1a1a');g.addColorStop(1,'#120c14');c.fillStyle=g;c.fillRect(0,0,LW,LH);
  text(win?'FIVE STARS!':'SHUT DOWN',LW/2,48,win?'#ffd24a':'#ff6a5a',26,'center');
  text(win?'You won the Golden Spatula! The whole coast queues up for your truck.':(S.loseWhy||(RUN.hp<=0?'The health inspector closed the truck.':'Closed for business.')),LW/2,66,'#e8d8c0',8,'center',500);
  text(`Legs ${win?3:RUN.leg} of 3     Stops ${RUN.stops}     Customers fed ${RUN.fed}     Level ${RUN.lv}`,LW/2,94,'#fff',9,'center');
  const names=RUN.dishes.map(d=>DISH[d.k].n+(d.recipe?` (${d.recipe})`:'')+' Lv '+d.lv+(d.fl.length?'  '+d.fl.map(f=>FLAV[f].n).join('+'):''));
  text('YOUR MENU',LW/2,118,'#ffb84a',8,'center');names.forEach((n,i)=>text(n,LW/2,132+i*11,'#e8d8c0',7.4,'center',500));
  text(RUN.relics.length?'Relics: '+RUN.relics.map(id=>RELICS.find(r=>r.id===id).t).join(', '):'No relics',LW/2,184,'#e0b8ff',7,'center',500);
  btn(LW/2-70,206,140,32,'TRY AGAIN',()=>{scene='title';sceneT=0;},{main:true,sz:10});
}
function toggleFS(){const d=document,el=d.documentElement;try{if(!d.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen).call(el).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}else d.exitFullscreen();}catch(e){}}
function pauseLayer(){c.fillStyle='rgba(8,4,14,.8)';c.fillRect(0,0,LW,LH);HIT.length=0;text('PAUSED',LW/2,100,'#ffd24a',18,'center');btn(LW/2-60,118,120,28,'Resume',()=>{paused=false;},{main:true});btn(LW/2-60,154,120,24,'Quit run',()=>{paused=false;scene='title';},{sz:8});}
/* ---------- loop ---------- */
function autoplay(dt){
  if(!AUTO)return;
  if(scene==='title'){newRun(Math.random()<.5?0:1);startTrip();}
  else if(scene==='levelup'&&sceneT>.15){const o=S.offers[Math.floor(Math.random()*S.offers.length)];o.fn();scene='shift';}
  else if(scene==='results'&&sceneT>.2){const aff=S.shop.filter(s=>!s.sold&&RUN.cash>=s.price);if(aff.length){const s=aff[0];RUN.cash-=s.price;s.sold=true;s.o.fn();}if(!S.relicTaken){const r=S.relicOffers[0];S.relicTaken=true;if(r){RUN.relics.push(r.id);r.fn(RUN);}}if(S.legDone){RUN.leg++;S.legDone=false;beginLeg();}else resumeTrip();}
  else if(scene==='kitchen'&&sceneT>.2){if(RUN.dishes.length>=2&&RUN.cash>=20&&!KT.done){KT.done=1;fuse(RUN.dishes[0],RUN.dishes[1]);RUN.cash-=20;}resumeTrip();}
  else if(scene==='mechanic'&&sceneT>.2){for(const u of UPG){const p=upgPrice(u);if(RUN.car[u.id]<u.max&&RUN.cash>=p){RUN.cash-=p;RUN.car[u.id]++;u.fn();}}resumeTrip();}
  else if(scene==='gas'&&sceneT>.2){const amt=Math.ceil(RUN.fuelMax-RUN.fuel),price=Math.ceil(amt*gasPrice());if(RUN.cash>=price){RUN.cash-=price;RUN.fuel=RUN.fuelMax;}else{const a2=Math.floor(RUN.cash/gasPrice());RUN.fuel=Math.min(RUN.fuelMax,RUN.fuel+a2);RUN.cash-=Math.ceil(a2*gasPrice());}resumeTrip();}
  else if(scene==='tow'&&sceneT>.2){if(RUN.cash>=40){RUN.cash-=40;RUN.fuel=25;scene='city';}else{S.loseWhy='Out of petrol.';endRun(false);}}
  else if(scene==='over'||scene==='win'){scene='title';}
  else if(scene==='city'){const w=S.city,tr=S.truck;let tg=null,bd=1e9;const wantT=RUN.fuel<45?'gas':(RUN.cash>70&&Math.random()<.002)?'mechanic':(S.legShifts>=3?'cook':'shift');
    const lots=w.lots.filter(l=>l.type&&!l.used);for(const l of lots){const ok=l.type===wantT||(wantT==='gas'&&l.type==='gas')||(l.type==='shift'&&wantT!=='gas'&&wantT!=='cook');if(!ok)continue;if(l.type==='cook'&&S.legShifts<3)continue;const d=Math.hypot(l.x+l.w/2-tr.x,l.y+l.h/2-tr.y);if(d<bd){bd=d;tg=l;}}
    if(!tg){for(const l of lots){if(l.type==='cook'&&S.legShifts<3)continue;const d=Math.hypot(l.x+l.w/2-tr.x,l.y+l.h/2-tr.y);if(d<bd){bd=d;tg=l;}}}
    KEYS.l=KEYS.r=KEYS.u=KEYS.d=0;if(tg){const cx=tg.x+tg.w/2,cy=tg.y+tg.h/2,near=(arr,v)=>arr.reduce((m,x)=>Math.abs(x-v)<Math.abs(m-v)?x:m,arr[0]),vxT=near(CITY.vx,cx),hyT=near(CITY.hy,cy),onH=Math.abs(tr.y-near(CITY.hy,tr.y))<24,onV=Math.abs(tr.x-near(CITY.vx,tr.x))<24,inT=tr.x>tg.x&&tr.x<tg.x+tg.w&&tr.y>tg.y&&tr.y<tg.y+tg.h;
      const go=(tx,ty)=>{const dx=tx-tr.x,dy=ty-tr.y;if(Math.abs(dx)>10)KEYS[dx>0?'r':'l']=1;if(Math.abs(dy)>10)KEYS[dy>0?'d':'u']=1;};
      if(inT)go(cx,cy);
      else if(onV&&Math.abs(tr.x-vxT)<24){if(Math.abs(tr.y-cy)<tg.h/2-10)go(cx,tr.y);else go(vxT,cy);}
      else if(onH)go(vxT,near(CITY.hy,tr.y));
      else if(onV)go(near(CITY.vx,tr.x),hyT);
      else go(tr.x,near(CITY.hy,tr.y));}}
  else if(scene==='shift'){S.botT=(S.botT||0)-dt;if(S.botT<=0){S.botT=.45;for(const ds of S.dishState)if(ds.fire>0)extinguish(ds,true);const cand=S.E.filter(e=>e.state!=='fed'&&e.z>.1).sort((a,b)=>b.z-a.z);for(const e of cand){const ds=S.dishState.find(x=>x.t<=0&&!x.fire&&orderOk(x.d,e.order));if(ds&&S.fire<=0){serveTo(ds,e);break;}}}}
}
function update(dt){
  t+=dt;sceneT+=dt;if(paused)return;autoplay(dt);
  if(scene!=='city'&&J.on)J={on:false,id:-1,ox:0,oy:0,x:0,y:0};if(scene==='city'){if(!S.bigmap)updateCity(dt);}else S.bigmap=false;if(scene==='shift')updateShift(dt);else if(scene==='kitchen'||scene==='mechanic'||scene==='gas'||scene==='tow'){}
}
function render(){
  HIT.length=0;c.setTransform(SC,0,0,SC,0,0);c.imageSmoothingEnabled=false;
  if(scene==='title')titleScene();else if(scene==='city')drawCity();else if(scene==='kitchen')kitchenScene();else if(scene==='mechanic')mechanicScene();else if(scene==='gas')gasScene();else if(scene==='tow')towScene();else if(scene==='shift')drawShift();else if(scene==='levelup')levelScene();else if(scene==='results')resultsScene();else if(scene==='over')endScene(false);else if(scene==='win')endScene(true);
  if(paused)pauseLayer();
}
let last=0;function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;try{update(dt);render();}catch(e){if(!frame.t||now-frame.t>2000){frame.t=now;console.error('frame error',e);}}requestAnimationFrame(frame);}requestAnimationFrame(n=>{last=n;frame(n);});
/* ---------- input ---------- */
cvs.addEventListener('pointerdown',e=>{try{cvs.setPointerCapture(e.pointerId);}catch(_){}const p=pt(e);
  for(let i=HIT.length-1;i>=0;i--){const b=HIT[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn(e.pointerId,p);return;}}
  if(scene==='city'&&!paused&&!S.bigmap&&!J.on){const gh=Math.hypot(p.x-64,p.y-206)<50;J={on:true,id:e.pointerId,ox:gh?64:p.x,oy:gh?206:p.y,x:p.x,y:p.y};}
  else if(scene==='shift'&&!paused){S.tap={x:p.x,y:p.y};}});
cvs.addEventListener('pointermove',e=>{if(J.on&&e.pointerId===J.id){const p=pt(e);J.x=p.x;J.y=p.y;}if(DRAG.on&&e.pointerId===DRAG.id){const p=pt(e);DRAG.x=p.x;DRAG.y=p.y;}});
const up=e=>{if(J.on&&e.pointerId===J.id)J={on:false,id:-1,ox:0,oy:0,x:0,y:0};if(DRAG.on&&e.pointerId===DRAG.id){DRAG.on=false;if(Math.hypot(DRAG.x-DRAG.sx,DRAG.y-DRAG.sy)>10)S.tap={x:DRAG.x,y:DRAG.y-10,ds:DRAG.ds};}};cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);cvs.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')KEYS.l=1;if(k==='ArrowRight'||k==='d')KEYS.r=1;if(k==='ArrowUp'||k==='w')KEYS.u=1;if(k==='ArrowDown'||k==='s')KEYS.d=1;if(k==='p'||k==='Escape')paused=!paused;if(k==='f')toggleFS();
  if(scene==='levelup'&&'123'.includes(k)){const o=S.offers[+k-1];if(o){o.fn();scene='shift';}}if(scene==='title'&&(k==='Enter'||k===' ')){newRun(sel);startTrip();}});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')KEYS.l=0;if(k==='ArrowRight'||k==='d')KEYS.r=0;if(k==='ArrowUp'||k==='w')KEYS.u=0;if(k==='ArrowDown'||k==='s')KEYS.d=0;});
window.__ft={step:dt=>update(dt),render,state:()=>({scene,RUN,S,BEST}),auto:v=>{AUTO=v;},rot:()=>ROT,newRun,startTrip,resumeTrip,beginLeg,startShift,stop:ty=>{if(!S.city)beginLeg();enterStop({type:ty,venue:'beach'});},aim:(x,y)=>{S.tap={x,y};},pick:i=>{const o=S.offers[i];if(o){o.fn();scene='shift';}},goto:s=>{scene=s;},setKey:(k,v)=>{KEYS[k]=v;}};
})();
