<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>The Eighth Arcanum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: one portrait tarot card fills the phone. Every boss is a card in the deck, every reward is a card you draw. */
:root{
  color-scheme:dark;
  --ink:#140d1f; --ink-2:#22162f; --gold:#dcb868; --gold-dim:#8f7440; --bone:#f1e8d4; --bone-dim:#bdb09c; --boss:#dcb868;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"VT323","Courier New",monospace;
  --label:"VT323","Courier New",monospace;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--bone);font-family:var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;height:100%;overflow:hidden;touch-action:none;background:var(--ink);cursor:grab;max-width:100%}
canvas{display:block;width:100%;height:100%}
#mute{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));width:44px;height:44px;border:0;background:transparent;color:var(--gold);cursor:pointer;display:grid;place-items:center;z-index:3;touch-action:manipulation}
#mute svg{width:22px;height:22px}
.overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;overflow-y:auto;touch-action:pan-y;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;background:linear-gradient(to bottom,rgba(20,13,31,.12),rgba(20,13,31,.82) 42%,rgba(20,13,31,.97));cursor:default}
.inner{margin-block:auto 0;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--label);font-weight:700;letter-spacing:.14em;font-size:.82rem;color:var(--gold)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.08;color:var(--bone)}
h1{font-size:clamp(2.4rem,12vw,3.2rem)}
h2{font-size:clamp(1.6rem,7.5vw,2.05rem)}
p{margin:0;font-size:1.06rem;line-height:1.42;color:var(--bone)}
.muted{color:var(--bone-dim)}
.go{appearance:none;border:1px solid var(--gold);outline:1px solid var(--gold-dim);outline-offset:3px;background:var(--gold);color:#21140d;font-family:var(--display);font-size:1.25rem;padding:14px 18px;margin:4px;cursor:pointer;border-radius:2px;touch-action:manipulation}
.go:active{transform:translateY(1px)}
.go:focus-visible,.card:focus-visible,#mute:focus-visible{outline:3px solid var(--bone);outline-offset:2px}
.cards{display:grid;gap:10px}
.card{appearance:none;text-align:left;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--ink-2);color:var(--bone);border:1px solid var(--boss);outline:1px solid color-mix(in srgb,var(--boss) 40%,transparent);outline-offset:-5px;padding:14px;cursor:pointer;border-radius:3px;touch-action:manipulation;font-family:var(--body)}
.card:active{background:#2f2040}
.card svg{width:40px;height:40px;color:var(--boss);grid-row:span 2}
.card b{font-family:var(--display);font-weight:400;font-size:1.18rem;line-height:1.15}
.card span{font-size:1rem;line-height:1.3;color:var(--bone-dim)}
.hand{display:flex;flex-wrap:wrap;gap:6px}
.hand i{font-style:normal;font-family:var(--label);font-size:.86rem;letter-spacing:.03em;color:var(--gold);border:1px solid var(--gold-dim);padding:2px 8px;border-radius:2px}
.stats{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-weight:400;font-size:1.5rem}
.stats small{font-family:var(--label);letter-spacing:.08em;color:var(--bone-dim);font-size:.8rem}
#spells{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:1}
.spell{appearance:none;position:relative;width:68px;height:68px;border-radius:50%;background:rgba(34,22,47,.82);border:2px solid var(--boss);outline:1px solid color-mix(in srgb,var(--boss) 45%,transparent);outline-offset:3px;color:var(--boss);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none;font-family:var(--label)}
.spell svg{width:34px;height:34px}
.spell small{position:absolute;bottom:-5px;right:-3px;background:#2a5a8c;color:#eaf5ff;border-radius:9px;padding:0 6px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.spell.low{opacity:.42}
.spell:active{transform:scale(.94)}
.spell:focus-visible{outline:3px solid var(--bone)}
.card .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.card svg{grid-row:auto}
.card small{font-family:var(--label);font-size:.8rem;letter-spacing:.03em;color:var(--gold);line-height:1.2}
.card em{font-family:var(--label);font-style:normal;font-size:.84rem;color:#a9d4f7;font-variant-numeric:tabular-nums}
.card.secret{border-color:var(--gold);outline-color:var(--gold);background:#33243c}
/* pixel treatment */
canvas{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.overlay{background:linear-gradient(to bottom,rgba(11,8,20,0) 0 30%,rgba(11,8,20,.55) 30% 36%,rgba(11,8,20,.8) 36% 42%,rgba(11,8,20,.95) 42%)}
h1,h2{line-height:1;font-weight:700}
h1{font-size:clamp(2.7rem,13vw,3.5rem)} h2{font-size:clamp(1.8rem,8vw,2.2rem)}
p{font-size:1.32rem;line-height:1.1}
.eyebrow{font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.go{border-radius:0;font-weight:700;font-size:1.45rem;border:0;outline:0;margin:0 0 6px;box-shadow:inset 0 -4px 0 #a07f3a,0 0 0 3px #0b0814,0 0 0 5px var(--gold-dim)}
.go:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #a07f3a,0 0 0 3px #0b0814,0 0 0 5px var(--gold-dim)}
.card{border-radius:0;outline:0;border:2px solid var(--boss);box-shadow:4px 4px 0 #0b0814;background:#20142a;padding:10px 12px;grid-template-columns:42px minmax(0,1fr)}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #0b0814}
.card svg{width:39px;height:auto}
.card b{font-weight:700;font-size:1.3rem;line-height:1}
.card span{font-size:1.16rem;line-height:1.02}
.card small{font-size:1.02rem;line-height:1}
.card em{font-size:1.08rem}
.card.secret{background:#3a2a22;box-shadow:4px 4px 0 #0b0814,0 0 0 1px var(--gold)}
.hand i{border-radius:0;font-size:1.08rem;line-height:1.05}
.stats b{font-weight:700;font-size:1.7rem} .stats small{font-size:1.02rem;letter-spacing:.02em}
.spell{border-radius:0;outline:0;border:3px solid var(--boss);background:#20142a;box-shadow:3px 3px 0 #0b0814;width:66px;height:66px}
.spell svg{width:39px;height:auto}
.spell small{border-radius:0;bottom:-4px;right:-4px;background:#1c4a7c;font-size:1.05rem;line-height:1;padding:1px 5px;font-weight:400}
.spell.low{opacity:1;filter:saturate(.25) brightness(.55)}
#mute svg{width:26px;height:auto}
#bossname{position:absolute;left:44px;right:44px;top:calc(var(--u)*5);text-align:center;font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.1;color:var(--bone);text-shadow:2px 2px 0 #0b0814;pointer-events:none;white-space:nowrap;overflow:hidden}
#manalabel{position:absolute;left:calc(var(--u)*8);bottom:calc(var(--u)*24);font-family:var(--body);font-size:1.05rem;line-height:1;color:#a9d4f7;text-transform:uppercase;text-shadow:2px 2px 0 #0b0814;pointer-events:none}
#intro{position:absolute;left:16px;right:16px;top:43%;text-align:center;display:flex;flex-direction:column;gap:6px;pointer-events:none;text-shadow:3px 3px 0 #0b0814}
#intro small{font-family:var(--body);font-size:1.25rem;color:var(--gold);text-transform:uppercase}
#intro b{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,8.5vw,2.4rem);line-height:1;color:var(--bone)}
#omen{position:absolute;left:12px;right:12px;top:calc(var(--u)*26);text-align:center;font-family:var(--body);font-size:1.05rem;line-height:1;color:var(--gold);text-shadow:2px 2px 0 #0b0814;pointer-events:none}
.cardback{appearance:none;width:min(62%,220px);aspect-ratio:3/4.6;align-self:center;background:#2b1a44;border:3px solid var(--gold);box-shadow:inset 0 0 0 5px #20142a,inset 0 0 0 7px var(--gold-dim),5px 5px 0 #0b0814;color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;touch-action:manipulation;padding:12px}
.cardback span{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:1}
.cardback b{font-family:var(--body);font-weight:400;font-size:1.3rem}
.cardback:active{transform:translate(2px,2px)}
.cardback:focus-visible,.omen:focus-visible{outline:3px solid var(--bone);outline-offset:2px}
.tcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;background:#20142a;border:2px solid var(--boss);box-shadow:4px 4px 0 #0b0814;padding:8px 12px}
.tcard img{width:96px;height:96px;image-rendering:pixelated;display:block;max-width:100%}
.tinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.tinfo small{font-family:var(--body);font-size:1.05rem;color:var(--gold);text-transform:uppercase;line-height:1}
.tinfo h2{font-size:clamp(1.45rem,6.5vw,1.8rem)}
.tinfo p{font-size:1.1rem;line-height:1}
.echo{font-size:1.16rem;line-height:1.05;color:var(--bone-dim)}
.echo b{color:var(--bone);font-weight:400}
.omens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.omen{appearance:none;display:flex;flex-direction:column;gap:5px;text-align:left;background:#2b1a44;color:var(--bone);border:2px solid var(--gold);box-shadow:4px 4px 0 #0b0814;padding:10px;cursor:pointer;touch-action:manipulation;font-family:var(--body)}
.omen:active{transform:translate(2px,2px)}
.omen small{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--gold);line-height:1}
.omen b{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1}
.omen span{font-size:1.1rem;line-height:1;color:var(--bone-dim)}
@media (prefers-reduced-motion:no-preference){.flip{animation:flip .32s steps(5) both}@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}}
.coin{display:inline-block;width:12px;height:12px;background:var(--gold);box-shadow:inset -3px -3px 0 #a07f3a,0 0 0 2px #0b0814;flex:none}
.gold{display:flex;align-items:center;gap:8px;font-size:1.25rem;line-height:1;color:var(--gold)}
.reward{display:flex;flex-direction:column;gap:3px}
.reward b{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1;color:var(--gold)}
.reward span{font-size:1.08rem;line-height:1;color:var(--bone-dim)}
.sellrow{appearance:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--bone);border:2px dashed var(--gold-dim);padding:12px;cursor:pointer;touch-action:manipulation;font-family:var(--body)}
.sellrow b{flex:1;min-width:0;font-weight:400;font-size:1.2rem;line-height:1}
.sellrow em{font-style:normal;font-size:1.15rem;color:var(--gold);white-space:nowrap}
.sellrow:active{transform:translate(1px,1px)}
.shopstatus{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shoprow{appearance:none;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:#20142a;color:var(--bone);border:2px solid var(--boss);box-shadow:3px 3px 0 #0b0814;padding:9px 10px;cursor:pointer;touch-action:manipulation;font-family:var(--body)}
.shoprow svg{width:34px;height:auto;color:var(--boss)}
.shoprow .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.shoprow b{font-family:var(--display);font-weight:700;font-size:1.14rem;line-height:1}
.shoprow span{font-size:1.08rem;line-height:1;color:var(--bone-dim)}
.shoprow em{font-style:normal;font-size:1.12rem;color:var(--gold);white-space:nowrap}
.shoprow:active:not(:disabled){transform:translate(2px,2px)}
.shoprow:disabled{opacity:.48;cursor:default;box-shadow:none}
.shopbtns{display:flex;flex-direction:column;gap:12px}
.ghost{appearance:none;background:transparent;color:var(--bone);border:2px solid var(--gold-dim);padding:10px;font-family:var(--body);font-size:1.2rem;cursor:pointer;touch-action:manipulation}
.ghost:disabled{opacity:.45;cursor:default}
.shoprow:focus-visible,.sellrow:focus-visible,.ghost:focus-visible{outline:3px solid var(--bone);outline-offset:2px}
.omen:nth-child(3){grid-column:1/-1}
.cardback.elite{background:#4d1020;border-color:#ffd27a;box-shadow:inset 0 0 0 5px #2a0a12,inset 0 0 0 7px var(--gold),5px 5px 0 #0b0814}
.tcard.elite{background:#3a1420;border-width:3px;border-color:var(--gold)}
#hint{position:absolute;left:12px;right:12px;top:calc(var(--u)*37);text-align:center;font-family:var(--body);font-size:1.2rem;line-height:1;color:var(--bone);text-shadow:2px 2px 0 #0b0814;pointer-events:none}
#call{position:absolute;left:12px;right:12px;top:47%;text-align:center;font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;text-shadow:3px 3px 0 #0b0814;pointer-events:none;z-index:1}
.overlay.pullov{background:none;gap:10px;cursor:pointer;justify-content:flex-start;padding-top:calc(max(8px,env(safe-area-inset-top,0px)) + 14px)}
.pullhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-right:32px;text-shadow:2px 2px 0 #0b0814}
.pullhead .gold{color:var(--bone)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;perspective:600px;flex:none}
.slot{aspect-ratio:3/4.7;visibility:hidden;min-width:0}
.slot.landed{visibility:visible}
.slotin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .34s steps(6)}
.slot.turned .slotin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px;text-align:center;border:2px solid var(--gold);box-shadow:3px 3px 0 #0b0814;overflow:hidden}
.back{background:#3a2466;color:var(--gold);box-shadow:inset 0 0 0 3px #20142a,inset 0 0 0 4px var(--gold-dim),3px 3px 0 #0b0814}
.slot.elite .back{background:#6e1830}.slot.omencard .back{background:#7d5a22}.slot.arenacard .back{background:#1d5a66}
.back span{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1}
.back em{font-style:normal;font-size:1.05rem;line-height:1}
.front{background:#20142a;transform:rotateY(180deg);color:var(--bone)}
.slot.elite .front{background:#3a1420}
.front img{width:min(100%,86px);image-rendering:pixelated;display:block}
.front small{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--gold);line-height:1}
.front b{font-family:var(--display);font-weight:700;font-size:.98rem;line-height:1.02;overflow-wrap:anywhere}
.slot.fly{animation:cardfly .38s steps(9) both}
@keyframes cardfly{from{transform:translate(var(--fx),var(--fy)) rotate(-420deg) scale(.42)}to{transform:none}}
.reads{display:flex;flex-direction:column;gap:7px;flex:none}
.reads p{font-size:1.16rem;line-height:1.05;color:var(--bone-dim);background:rgba(11,8,20,.76);padding:5px 8px}
.reads b{font-weight:400;color:var(--gold)}
.pullfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
@media (prefers-reduced-motion:reduce){.slotin{transition:none}.slot.fly{animation:none}}
#spells.three{gap:8px}
#spells.three .spell{width:54px;height:54px}
#spells.three .spell svg{width:31px}
</style>

<div id="wrap"><div id="stage">
  <canvas id="c" aria-label="Boss battle arena"></canvas>
  <button id="mute" aria-label="Turn sound off" hidden></button>
  <div id="spells" hidden></div>
  <div id="bossname" hidden></div>
  <div id="omen" hidden></div>
  <div id="manalabel" hidden>Mana</div>
  <div id="intro" hidden></div>
  <div id="hint" hidden></div>
  <div id="call" hidden></div>
  <div id="ov" class="overlay"></div>
</div></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const stage=$('stage'), cv=$('c'), ctx=cv.getContext('2d'), ov=$('ov'), muteBtn=$('mute');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2, W=400; let H=720, scale=1;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const GOLD='#dcb868', BONE='#f1e8d4';
const FLOOR=()=>H-6;

/* ---------- audio: small synth, starts from the first button press ---------- */
let ac=null, muted=false;
try{ muted = localStorage.getItem('ea-mute')==='1'; }catch(e){}
function wakeAudio(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); }catch(e){} }
function tone(f,d,type='sine',v=.1,slide=0,delay=0){
  if(!ac||muted) return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);
}
const sfx={
  cast(){tone(620,.16,'triangle',.07,420)},
  hurt(){tone(170,.28,'sawtooth',.16,-110)},
  block(){tone(900,.16,'triangle',.1,500)},
  strike(){tone(1300,.09,'square',.035,-900)},
  toll(){tone(240,.5,'sine',.13);tone(481,.4,'sine',.05)},
  coin(){tone(988,.07,'square',.04);tone(1319,.14,'square',.04,0,.07)},
  pick(){[523,659,784].forEach((f,i)=>tone(f,.28,'triangle',.08,0,i*.08))},
  win(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.4,'triangle',.09,0,i*.11))},
  lose(){[330,262,196,131].forEach((f,i)=>tone(f,.5,'sine',.12,0,i*.2))},
  rage(){tone(90,.7,'sawtooth',.13,70)}
};

/* ---------- world state ---------- */
const S={mode:'title',stage:0,t:0,shake:0,flash:0,god:false,hits:0,best:0,runSeconds:0,paused:false};
let P, B, bolts=[], shots=[], rings=[], cols=[], parts=[], seeds=[], beams=[], helpers=[], bg=null;
S.recipes=[];
try{ S.best=+localStorage.getItem('ea-best')||0; S.recipes=JSON.parse(localStorage.getItem('ea-recipes')||'[]'); }catch(e){}

function newPlayer(){
  return {gear:{hat:null,robe:null,charm:null},loot:[],moonUsed:false,sageN:0,slots:2,gold:0,wand:null,thirdEye:false,reward:null,cleanFight:true,a:Math.PI/2,rr:RO,tr:RO,x:W/2,y:H-150,vx:0,hp:4,max:4,hit:5,inv:0,scale:1,rate:.2,cast:0,spells:[],mana:0,manaMax:100,cd:0,shield:0,shieldSpell:null,shieldPw:1,boneCasts:0,grazeGlow:0};
}

/* ---------- attack helpers ---------- */
let DT=0;
function every(k,iv,fn){ const m=B.tm; if(m[k]===undefined)m[k]=iv*.6; m[k]-=DT; if(m[k]<=0){m[k]+=iv;fn();} }
function shot(x,y,a,s,o={}){ if(shots.length>420)return; shots.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:5.5,c:B.color,grazed:false,...o}); }
const aim=()=>Math.atan2(P.y-B.y,P.x-B.x);
function fan(n,spread,s,o,base){ const a=base===undefined?aim():base; for(let i=0;i<n;i++) shot(B.x,B.y+20,a+(n>1?(i/(n-1)-.5)*spread:0),s,o); }
function ring(n,s,o,off=rnd(0,TAU),x=B.x,y=B.y){ for(let i=0;i<n;i++) shot(x,y,off+i/n*TAU,s,o); }
function gapRing(n,s,gapN,o){ const a=aim()+(S.orbit?(Math.random()<.5?-1:1)*rnd(.9,1.9):0); for(let i=0;i<n;i++){ const d=i-(n-1)/2; const ang=a+Math.PI+i/n*TAU; const fromGap=Math.abs(((ang-a+Math.PI*3)%TAU)-Math.PI); if(fromGap>gapN*TAU/n/2+.001) shot(B.x,B.y,ang,s,o);} }
function wave(v,gap,c){ rings.push({x:B.x,y:B.y,rad:30,v,gap,a:aim()+(S.orbit?(Math.random()<.5?-1:1)*rnd(.8,1.6):rnd(-.25,.25)),w:11,c:c||B.color,hit:false}); }
function column(x,warn=.75){ cols.push({x:clamp(x,20,W-20),w:46,t:0,warn,on:.22,c:B.color,hit:false}); }
function seed(n=8){ const tx=rnd(40,W-40),ty=rnd(H*.34,H*.82),f=1.15; shots.push({x:B.x,y:B.y,vx:(tx-B.x)/f,vy:(ty-B.y)/f,r:9,c:B.color,fuse:f,burst:n,seed:true,grazed:true}); }
function spiral(arms,step,sp,o){ B.ang=(B.ang||0)+step; for(let i=0;i<arms;i++) shot(B.x,B.y,B.ang+i/arms*TAU,sp,o); }

/* ---------- boss art: engraved card figures ---------- */
function poly(c,pts,close=true){ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); if(close)c.closePath(); }
const ln=(c,col,w=2)=>{c.strokeStyle=col;c.lineWidth=w;c.lineJoin='round';c.lineCap='round';c.stroke()};
const fl=(c,col)=>{c.fillStyle=col;c.fill()};
function circle(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function eyes(c,dx,y,r,col){ [ -dx,dx ].forEach(s=>{circle(c,s,y,r);fl(c,col)}); }

function drawCinder(c,t){
  for(let i=0;i<7;i++){ const a=-Math.PI/2+(i-3)*.38, h=30+Math.sin(t*9+i*2)*9, x=Math.cos(a)*30,y=Math.sin(a)*30;
    poly(c,[[x-11,y+5],[x+Math.cos(a)*h,y+Math.sin(a)*h],[x+11,y+5]]); fl(c,i%2?'#f2a03d':'#e8592c'); }
  circle(c,0,4,36); fl(c,'#2a1412'); ln(c,'#e8743b',2.5);
  poly(c,[[-30,-22],[-34,-46],[-16,-30],[0,-52],[16,-30],[34,-46],[30,-22]]); fl(c,GOLD); ln(c,'#7d5a22',1.5);
  eyes(c,13,0,5,'#ffd27a'); poly(c,[[-14,16],[-6,23],[0,17],[6,23],[14,16]],false); ln(c,'#f2a03d',2.5);
}
function drawFrost(c,t){
  for(let i=0;i<10;i++){ c.save(); c.rotate(i/10*TAU+t*.15); poly(c,[[-5,-30],[0,-54-(i%2)*10],[5,-30]]); fl(c,i%2?'#bfeaf2':'#79c6dd'); c.restore(); }
  poly(c,[[0,-40],[30,-12],[26,34],[-26,34],[-30,-12]]); fl(c,'#1d3a58'); ln(c,'#a9e3f0',2.5);
  poly(c,[[0,-24],[17,-6],[12,18],[-12,18],[-17,-6]]); fl(c,'#e6f7fa');
  eyes(c,7,-4,3,'#1d3a58'); poly(c,[[0,-40],[0,-26]],false); ln(c,'#a9e3f0',1.5);
}
function drawBell(c,t){
  c.rotate(Math.sin(t*2.4)*.16);
  c.beginPath(); c.moveTo(-40,32); c.quadraticCurveTo(-27,20,-25,-12); c.quadraticCurveTo(-22,-40,0,-40); c.quadraticCurveTo(22,-40,25,-12); c.quadraticCurveTo(27,20,40,32); c.closePath();
  fl(c,'#a9875a'); ln(c,'#f0d9a5',2.5);
  poly(c,[[-27,8],[27,8]],false); ln(c,'#5f4628',2); poly(c,[[-30,18],[30,18]],false); ln(c,'#5f4628',2);
  circle(c,0,-44,6); ln(c,'#f0d9a5',3);
  c.beginPath(); c.ellipse(-9,-14,5,8,0,0,TAU); c.ellipse(9,-14,5,8,0,0,TAU); fl(c,'#2a1a10');
  c.save(); c.rotate(Math.sin(t*5)*.3); poly(c,[[0,32],[0,42]],false); ln(c,'#f0d9a5',2.5); circle(c,0,46,6); fl(c,'#f0d9a5'); c.restore();
}
function drawStorm(c,t){
  for(let i=0;i<8;i++){ const a=i/8*TAU+t*.5; circle(c,Math.cos(a)*36,Math.sin(a)*24,15); fl(c,i%2?'#3d4a73':'#55628f'); }
  c.beginPath(); c.ellipse(0,0,34,20,0,0,TAU); fl(c,'#f3ecc8'); ln(c,'#1b2038',2.5);
  const lx=Math.sin(t*1.7)*9, ly=Math.cos(t*1.1)*5;
  circle(c,lx,ly,12); fl(c,'#e4c946'); circle(c,lx,ly,6); fl(c,'#14162b');
  const bolt=Math.floor(t*6)%2; poly(c,[[-22+bolt*44,20],[-16+bolt*44,34],[-23+bolt*44,34],[-14+bolt*44,52]],false); ln(c,'#e4c946',2.5);
}
function drawThorn(c,t){
  for(let i=0;i<9;i++){ c.save(); c.rotate(i/9*TAU+Math.sin(t*.8)*.25); c.beginPath(); c.moveTo(-10,-14); c.quadraticCurveTo(-18,-38,0,-58); c.quadraticCurveTo(18,-38,10,-14); c.closePath(); fl(c,i%2?'#8d3350':'#b84a5d'); ln(c,'#35121f',1.5);
    poly(c,[[9,-36],[17,-40],[11,-30]]); fl(c,'#e6d7a8'); c.restore(); }
  circle(c,0,0,23); fl(c,'#2e4f2e'); ln(c,'#9dbb6a',2.5);
  circle(c,0,0,10+Math.sin(t*3)*2); fl(c,'#e0c65c'); circle(c,0,0,4); fl(c,'#2a1a10');
}
function drawBone(c,t){
  for(let i=0;i<6;i++){ const s=i<3?-1:1,k=i%3; c.beginPath(); c.moveTo(s*14,12+k*11); c.quadraticCurveTo(s*(50+Math.sin(t*2+k)*3),6+k*12,s*38,34+k*11); ln(c,'#d9d2bb',4); }
  c.beginPath(); c.moveTo(-30,-6); c.bezierCurveTo(-34,-48,34,-48,30,-6); c.quadraticCurveTo(30,12,17,18); c.lineTo(17,30); c.lineTo(-17,30); c.lineTo(-17,18); c.quadraticCurveTo(-30,12,-30,-6); c.closePath(); fl(c,'#ebe4cd'); ln(c,'#6f6650',2);
  eyes(c,12,-6,8.5,'#20142a'); eyes(c,12,-6,2.5,'#a8f0b0');
  poly(c,[[0,4],[-5,13],[5,13]]); fl(c,'#20142a');
  [-10,-3,4,11].forEach(x=>{poly(c,[[x,20],[x,30]],false);ln(c,'#6f6650',1.5)});
}
function drawMirror(c,t){
  for(let i=0;i<6;i++){ const a=i/6*TAU+t*.8; c.save(); c.translate(Math.cos(a)*56,Math.sin(a)*40); c.rotate(a); poly(c,[[-5,-9],[6,-3],[1,10]]); fl(c,'#cfd7e8'); c.restore(); }
  c.beginPath(); c.ellipse(0,0,32,44,0,0,TAU); fl(c,'#8ea3bf'); ln(c,GOLD,4);
  c.save(); c.clip(); poly(c,[[-40,-20],[20,-50],[-6,50],[-40,50]]); fl(c,'#b8c7da'); c.restore();
  c.beginPath(); c.moveTo(-14,28); c.quadraticCurveTo(-16,-8,0,-14); c.quadraticCurveTo(16,-8,14,28); c.closePath(); fl(c,'#2b2238');
  poly(c,[[-13,-9],[0,-40],[13,-9]]); fl(c,'#2b2238');
  eyes(c,5,2,2.2,'#f0a8d8');
}
function drawVoid(c,t,color){
  for(let i=0;i<24;i++){ c.save(); c.rotate(i/24*TAU+t*.1); const h=i%2?18:32+Math.sin(t*3+i)*5; poly(c,[[-4,-42],[0,-42-h],[4,-42]]); fl(c,i%2?'#7d5ad0':GOLD); c.restore(); }
  circle(c,0,0,44); fl(c,'#06040c'); ln(c,GOLD,2.5);
  for(let i=0;i<5;i++){ const a=i/5*TAU-t*.4; const x=Math.cos(a)*26,y=Math.sin(a)*26; c.beginPath(); c.ellipse(x,y,7,4,0,0,TAU); fl(c,'#efe6c9'); circle(c,x,y,2.4); fl(c,'#7d2bd0'); }
  circle(c,0,0,9); fl(c,'#efe6c9'); circle(c,0,0,5); fl(c,'#b02050');
}

function fightReward(){
  const base=10+3*S.pos, parts=[`${base} for the win`]; let g=base;
  if(BOSSES[S.stage].elite){g+=25;parts.push('25 for the elite');}
  if(P.cleanFight){g+=10;parts.push('10 for no hits');if(hasGear('coin')){g+=15;parts.push('15 from your coin');}}
  if(['tower','death','moon','hanged'].some(isMod)){g+=8;parts.push('8 for the omen');}
  if(hasWand('greedy')){const x=Math.round(g*.5);g+=x;parts.push(`${x} from your wand`);}
  return {g,parts};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function forgeOptions(n){
  const sp=P.spells, out=[], seen=new Set();
  const add=(label,result,apply)=>{ const k=spellKey(result)+apply.slot; if(seen.has(k))return; seen.add(k); out.push({label,result,...apply}); };
  if(sp.length<P.slots) add('Keep as a new spell',n,{slot:sp.length});
  sp.forEach((s,i)=>{
    add(`Fuse: ${spellName(s)} + ${spellName(n)}`,fuse(s,n),{slot:i});
    if(s.type!==n.type) add(`Fuse: ${spellName(n)} + ${spellName(s)}`,fuse(n,s),{slot:i});
  });
  if(sp.length>=P.slots) sp.forEach((s,i)=>add(`Replace ${spellName(s)}`,n,{slot:i}));
  return out;
}

function draw(){
  const c=ctx; c.setTransform(1,0,0,1,0,0); c.imageSmoothingEnabled=false;

  if(!B||S.mode==='shop') return;

  if(S.orbit&&P){ for(const r of [RI,RO]){ const live=P.tr===r,rr=r*K,st=(live?5:7)/rr; c.globalAlpha=live?.75:.3; c.fillStyle=live?BONE:B.color; for(let a=S.t*.1;a<TAU+S.t*.1;a+=st)c.fillRect(Math.round(LW/2+Math.cos(a)*rr),Math.round(CY()*K+Math.sin(a)*rr),1,1); c.globalAlpha=1; }
    for(const k of bands){ const w=px(k.w); if(k.t<k.warn){ if(Math.floor(S.t*12)%2){ arcDots(W/2,CY(),k.r-k.w/2,0,TAU,1,BONE); arcDots(W/2,CY(),k.r+k.w/2,0,TAU,1,BONE); } } else { arcDots(W/2,CY(),k.r,0,TAU,w,B.color); arcDots(W/2,CY(),k.r,0,TAU,Math.max(2,w-6),'#fffbee'); } } }
  for(const k of cols){

    if(k.t<k.warn){ const on=(Math.floor(S.t*12)%2)+1; c.fillStyle=k.c; for(let y=0;y<LH;y+=2)for(let x=x0+(y%4?0:1);x<x0+w;x+=on+1)c.fillRect(x,y,1,1); const m=Math.round(w/2*(1-k.t/k.warn)); c.fillRect(x0+w/2-m,0,1,LH);c.fillRect(x0+w/2+m,0,1,LH); }

  }

  for(const b of beams){ if(b.sy!==undefined) lineDots(b.sx,b.sy,B.x,B.y,GOLD); else { lineDots(b.x,0,b.x+rnd(-10,10),B.y*.5,'#fff2a0',2); lineDots(b.x,B.y*.5,b.x,B.y,'#fff2a0',2);} }
  for(const b of bolts){ if(b.c) blit(c,px(b.x),px(b.y),disc(b.c,Math.max(1,Math.round(b.r*K)))); else { c.fillStyle='#7d5a22';c.fillRect(px(b.x)-1,px(b.y),3,6);c.fillStyle='#ffe9a8';c.fillRect(px(b.x),px(b.y)-1,1,6); } }
  for(const s of seeds){ if(s.homing) blit(c,px(s.x),px(s.y),disc('#9dbb6a',1)); }

function drawTitle(){
  const c=ctx; c.setTransform(1,0,0,1,0,0); c.imageSmoothingEnabled=false; c.drawImage(bg,0,0);

}

/* ---------- input: relative drag so your thumb never hides the wizard ---------- */
const KEYS={left:false,right:false,up:false,down:false}; let drag=null;
const toWorld=e=>{const r=cv.getBoundingClientRect();const y=(e.clientY-r.top)*H/r.height;return{x:(e.clientX-r.left)*W/r.width,y:isMod('hanged')?H-y:y}};
function swapRing(){ if(!P||!S.orbit)return; P.tr=P.tr===RO?RI:RO; tone(P.tr===RI?660:440,.08,'square',.03); }
cv.addEventListener('pointerdown',e=>{ if(!P)return; if(S.open){ if(!stick)stick={id:e.pointerId,x:e.clientX,y:e.clientY}; try{cv.setPointerCapture(e.pointerId)}catch(_){ } e.preventDefault(); return; } if(S.fo){ if(S.mode==='fight'){foHold={id:e.pointerId,x:e.clientX,moved:false,t:performance.now()}; try{cv.setPointerCapture(e.pointerId)}catch(_){ } e.preventDefault();} return; } const w=toWorld(e); drag={id:e.pointerId,dx:P.x-w.x,dy:P.y-w.y,lx:w.x,ly:w.y,rad:0,moved:0,t:performance.now()}; try{cv.setPointerCapture(e.pointerId)}catch(_){ } e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(S.open){ if(stick&&e.pointerId===stick.id){ let dx=(e.clientX-stick.x)/34,dy=(e.clientY-stick.y)/34; const l=Math.hypot(dx,dy); if(l>1){stick.x+=(dx/l)*(l-1)*34;stick.y+=(dy/l)*(l-1)*34;dx/=l;dy/=l;} stickV={x:dx,y:isMod('hanged')?-dy:dy}; } e.preventDefault(); return; } if(S.fo){ if(foHold&&e.pointerId===foHold.id&&!foHold.moved&&Math.abs(e.clientX-foHold.x)>20){foHold.moved=true;foDodge(e.clientX>foHold.x?1:-1);} e.preventDefault(); return; } if(!drag||e.pointerId!==drag.id||!P)return; const w=toWorld(e);
  if(S.orbit){ const dx=w.x-drag.lx,dy=w.y-drag.ly,tx=-Math.sin(P.a),ty=Math.cos(P.a),nx=Math.cos(P.a),ny=Math.sin(P.a);
    drag.moved+=Math.hypot(dx,dy); P.a+=(dx*tx+dy*ty)*1.5/P.rr; drag.rad=drag.rad*.9+(dx*nx+dy*ny);
    if(drag.rad>26&&P.tr===RI){swapRing();drag.rad=0;} else if(drag.rad<-26&&P.tr===RO){swapRing();drag.rad=0;}
  } else { P.x=w.x+drag.dx; P.y=w.y+drag.dy; }
  drag.lx=w.x;drag.ly=w.y;drag.dx=P.x-w.x;drag.dy=P.y-w.y; e.preventDefault(); });
const endDrag=e=>{ if(stick&&e.pointerId===stick.id){stick=null;stickV={x:0,y:0};} if(foHold&&e.pointerId===foHold.id){ if(!foHold.moved&&e.type==='pointerup')foThrow(); foHold=null; } if(drag&&e.pointerId===drag.id){ if(S.orbit&&drag.moved<7&&performance.now()-drag.t<220&&e.type==='pointerup')swapRing(); drag=null; } };

addEventListener('keyup',e=>{ if(['1','2','3','j','k','l'].includes(e.key)&&P)endBeam();const k=keymap[e.key];if(k)KEYS[k]=false;});

/* ---------- sizing ---------- */
function resize(){
  const pw=stage.parentElement.clientWidth, ph=stage.parentElement.clientHeight;
  const cw=Math.min(pw,Math.round(ph*.62)); stage.style.width=cw+'px'; stage.style.setProperty('--u',(cw/LW)+'px');
  const oldH=H; H=Math.max(560,W*ph/cw); LH=Math.round(H*K);

  bg=makeBg(B?BOSSES[S.stage]:BOSSES[7]);
  if(P&&oldH!==H) P.y=clamp(P.y*H/oldH,H*.4,H-96);
}
new ResizeObserver(resize).observe(stage.parentElement);

/* ---------- loop and boot ---------- */

function frame(now){
  const dt=Math.min(.033,(now-last)/1000||0); last=now;
  if(S.mode==='title'){ S.t+=dt; drawTitle(); }
  else { syncSpells(); if(S.mode==='draw'&&!S.paused)updateDraw(dt); if(!S.paused&&S.mode!=='pick'&&S.mode!=='dead'&&S.mode!=='victory'&&S.mode!=='draw'&&S.mode!=='shop') step(dt); draw(); }

}
